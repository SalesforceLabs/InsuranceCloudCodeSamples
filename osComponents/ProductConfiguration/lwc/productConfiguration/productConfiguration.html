<template>
    <lightning-card>
        <!-- Loading Spinner Overlay -->
        <template if:true={isLoading}>
            <div class="slds-spinner_container">
                <div class="slds-spinner slds-spinner_medium slds-spinner_brand" role="status">
                    <span class="slds-assistive-text">{labels.LOADING}</span>
                    <div class="slds-spinner__dot-a"></div>
                    <div class="slds-spinner__dot-b"></div>
                </div>
            </div>
        </template>

        <!-- Configuration Messages -->
        <template lwc:if={hasConfigMessages}>
            <div class="slds-p-horizontal_medium slds-p-top_medium" onnavigate={handleNavigate}>
                <div class="slds-box slds-p-bottom_none">
                    <div class="slds-var-m-bottom_small">
                        <button class="slds-button slds-button_reset slds-grid slds-grid_vertical-align-center messages-toggle-button" onclick={handleToggleMessages}>
                            <lightning-icon icon-name={messagesIconName} size="x-small" alternative-text={labels.TOGGLE_MESSAGES} class="slds-m-right_x-small"></lightning-icon>
                            <h2 class="slds-text-heading_small">{labels.MESSAGES} ({configMessageCount})</h2>
                        </button>
                    </div>
                    <template if:true={isMessagesExpanded}>
                        <template for:each={configMessages} for:item="message">
                            <div key={message.key} class="slds-var-m-bottom_small">
                                <c-product-configuration-message-item message={message}></c-product-configuration-message-item>
                            </div>
                        </template>
                    </template>
                </div>
            </div>
        </template>

        <!-- Use a non-wrapping grid to enforce side-by-side layout -->
        <div class="slds-grid">
            <!-- Left Panel: Tree -->
            <div class="slds-col slds-size_4-of-12 slds-p-around_medium slds-border_right">
                <template if:true={treeItems.length}>
                    <lightning-tree items={treeItems} selected-item={selectedNode.name} onselect={handleSelect}></lightning-tree>
                </template>
            </div>

            <!-- Right Panel: Details and Coverages -->
            <div class="slds-col slds-size_8-of-12 slds-p-around_medium">
                <!-- Validation Message Display -->
                <template if:true={displayValidationMsg}>
                    <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert">
                        <span class="slds-icon_container slds-m-right_x-small">
                            <lightning-icon icon-name="utility:warning" variant="inverse" size="x-small"></lightning-icon>
                        </span>
                        <h2>{displayValidationMsg}</h2>
                    </div>
                </template>

                <!-- Error Message Display -->
                <template if:true={error}>
                    <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert">
                        <span class="slds-assistive-text">{labels.ERROR}</span>
                        <h2 class="slds-text-body_small">
                            <lightning-icon icon-name="utility:error" alternative-text={labels.ERROR} size="x-small" variant="inverse" class="slds-m-right_x-small"></lightning-icon>
                            {error}
                        </h2>
                    </div>
                </template>

                <template if:true={selectedNode}>
                    <!-- Delete Button - Show above Details header for non-root products -->
                    <template if:true={showDeleteButton}>
                        <div class="slds-grid slds-grid_align-end slds-m-bottom_small">
                            <lightning-button
                                label={labels.DELETE}
                                variant="neutral"
                                onclick={handleDeleteButtonClick}
                                disabled={isLoading}>
                            </lightning-button>
                        </div>
                    </template>

                    <!-- Details Card -->
                    <div>
                        <div class="detailHeader slds-p-around_x-small slds-border_top slds-border_right slds-border_left slds-border_bottom">
                            <h2 class="slds-text-heading_small slds-m-around_none">{labels.DETAILS}</h2>
                        </div>
                        <lightning-card>
                            <div class="slds-card__body slds-card__body_inner">
                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                    <h3 class="slds-text-heading_small slds-p-bottom_small">{productTitle}</h3>
                                    <template if:true={selectedNodePrice}>
                                        <div class="slds-grid slds-grid_vertical-align-center">
                                            <lightning-formatted-number value={selectedNodePrice} format-style="currency" currency-code={currencyCode} class="slds-text-heading_small"></lightning-formatted-number>
                                            <template if:true={selectedNodeTax}>
                                                <lightning-helptext content={selectedNodeTax} icon-name="utility:info" icon-variant="bare" class="slds-m-bottom_xx-small slds-p-left_xx-small"></lightning-helptext>
                                            </template>
                                        </div>
                                    </template>
                                </div>

                                <!-- Show attributes if they exist -->
                                <template if:true={categorizedAttributes.length}>
                                    <!-- Grouped attributes by category -->
                                    <template for:each={categorizedAttributes} for:item="category">
                                        <div key={category.key} class="slds-m-top_medium">
                                            <!-- Category Header -->
                                            <h4 class="slds-text-heading_x-small slds-m-bottom_small slds-text-color_weak">{category.categoryName}</h4>

                                            <!-- Attributes within category -->
                                            <div class="slds-grid slds-wrap">
                                                <template for:each={category.attributes} for:item="attribute">
                                                    <div key={attribute.id}
                                                        class="slds-col slds-size_1-of_1 slds-medium-size_1-of-2 slds-p-bottom_small">
                                                        <div class="slds-form-element">
                                                            <span if:false={attribute.isLookup} class="slds-form-element__label slds-text-body_small">{attribute.label}</span>
                                                            <div class="slds-form-element__control">
                                                                <!-- Display lookup attribute-->
                                                                <template if:true={attribute.isLookup}>
                                                                    <template if:true={attribute.displayValue}>
                                                                        <lightning-record-edit-form record-id={attribute.value} object-api-name={attribute.lookupObjectApiName}>
                                                                            <lightning-output-field field-name="Name"></lightning-output-field>
                                                                        </lightning-record-edit-form>
                                                                    </template>
                                                                    <template if:false={attribute.displayValue}>
                                                                        <div class="slds-text-body_small">-</div>
                                                                    </template>
                                                                </template>
                                                                <!-- Display non-lookup attributes as text -->
                                                                <template if:false={attribute.isLookup}>
                                                                    <template if:true={attribute.displayValue}>
                                                                        <div class="slds-text-body_small">{attribute.displayValue}</div>
                                                                    </template>
                                                                    <template if:false={attribute.displayValue}>
                                                                        <div class="slds-text-body_small">-</div>
                                                                    </template>
                                                                </template>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </template>

                                <!-- Show "No attributes" message if no attributes exist -->
                                <template if:false={categorizedAttributes.length}>
                                    <div class="slds-text-align_center slds-p-vertical_large">
                                        <p class="slds-text-color_weak">{labels.NO_ATTRIBUTES_MSG}</p>
                                    </div>
                                </template>
                            </div>
                        </lightning-card>
                    </div>

                    <!-- Coverages Card -->
                    <template if:true={hasCoverages}>
                        <div class="slds-m-top_large">
                            <div class="detailHeader slds-p-around_x-small slds-border_top slds-border_right slds-border_left slds-border_bottom">
                                <h2 class="slds-text-heading_small slds-m-around_none">{labels.COVERAGES}</h2>
                            </div>
                            <lightning-card>
                                <div class="slds-card__body slds-card__body_inner slds-p-top_medium">
                                    <template for:each={displayNode.coverages} for:item="coverage">
                                        <div key={coverage.key} class={coverage.containerClass}>
                                            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                                <lightning-input type="checkbox" label={coverage.name}
                                                    checked={coverage.isSelected} onchange={handleCoverageSelectionChange}
                                                    data-coverage-key={coverage.key}
                                                    disabled={coverage.isDisabledOrLoading}
                                                    class="slds-m-bottom_small"></lightning-input>

                                                <template if:true={coverage.price}>
                                                    <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small price-container">
                                                        <lightning-formatted-number value={coverage.price} format-style="currency" currency-code={currencyCode} class="slds-text-heading_small"></lightning-formatted-number>
                                                        <template if:true={coverage.tax}>
                                                            <lightning-helptext content={coverage.tax} icon-name="utility:info" icon-variant="bare" class="slds-m-bottom_xx-small slds-p-left_xx-small"></lightning-helptext>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>

                                            <!-- Only show attributes when coverage is selected -->
                                            <template if:true={coverage.isSelected}>
                                                <div class="slds-m-left_large">
                                                    <!-- Grouped coverage attributes by category -->
                                                    <template for:each={coverage.categorizedAttributes} for:item="category">
                                                        <div key={category.key} class="slds-m-top_small">
                                                            <!-- Category Header -->
                                                            <h5 class="slds-text-heading_x-small slds-m-bottom_small slds-text-color_weak">{category.categoryName}</h5>

                                                            <!-- Attributes within category -->
                                                            <div class="slds-grid slds-wrap">
                                                                <template for:each={category.attributes} for:item="attr">
                                                                    <div key={attr.id}
                                                                        class="slds-col slds-size_1-of_1 slds-medium-size_1-of-2 slds-p-bottom_small slds-p-right_small">

                                                                        <!-- Render based on controlType -->
                                                                        <template if:true={attr.isCombobox}>
                                                                            <lightning-combobox name={attr.developerName} label={attr.label}
                                                                                value={attr.value} options={attr.options}
                                                                                onchange={handleAttributeChange}
                                                                                onblur={handleAttributeBlur}
                                                                                data-coverage-key={coverage.key}
                                                                                data-attr-code={attr.code}
                                                                                data-attr-dev-name={attr.developerName}
                                                                                data-product-code={coverage.productCode}
                                                                                data-instance-keys={coverage.instanceKeysString}
                                                                                data-control-type={attr.controlType}
                                                                                read-only={attr.isReadOnly}
                                                                                disabled={attr.isDisabledOrLoading}
                                                                                required={attr.isRequired}
                                                                                class="slds-text-body_small"></lightning-combobox>
                                                                        </template>

                                                                        <template if:true={attr.isRadio}>
                                                                            <lightning-radio-group name={attr.developerName} label={attr.label}
                                                                                value={attr.value} options={attr.options}
                                                                                onchange={handleAttributeChange}
                                                                                data-coverage-key={coverage.key}
                                                                                data-attr-code={attr.code}
                                                                                data-attr-dev-name={attr.developerName}
                                                                                data-product-code={coverage.productCode}
                                                                                data-instance-keys={coverage.instanceKeysString}
                                                                                data-control-type={attr.controlType}
                                                                                disabled={attr.isDisabledOrLoading}
                                                                                required={attr.isRequired}
                                                                                class="slds-text-body_small"></lightning-radio-group>
                                                                        </template>

                                                                        <template if:true={attr.isSlider}>
                                                                            <lightning-slider name={attr.developerName} label={attr.label}
                                                                                value={attr.value}
                                                                                min={attr.minimumValue}
                                                                                max={attr.maximumValue}
                                                                                step={attr.stepValue}
                                                                                onchange={handleAttributeChange}
                                                                                data-coverage-key={coverage.key}
                                                                                data-attr-code={attr.code}
                                                                                data-attr-dev-name={attr.developerName}
                                                                                data-product-code={coverage.productCode}
                                                                                data-instance-keys={coverage.instanceKeysString}
                                                                                data-control-type={attr.controlType}
                                                                                disabled={attr.isDisabledOrLoading}
                                                                                class="slds-text-body_small"></lightning-slider>
                                                                        </template>

                                                                        <template if:true={attr.isToggle}>
                                                                            <lightning-input
                                                                                type="toggle"
                                                                                name={attr.developerName}
                                                                                label={attr.label}
                                                                                checked={attr.value}
                                                                                variant="label-hidden"
                                                                                onchange={handleAttributeChange}
                                                                                data-coverage-key={coverage.key}
                                                                                data-attr-code={attr.code}
                                                                                data-attr-dev-name={attr.developerName}
                                                                                data-product-code={coverage.productCode}
                                                                                data-instance-keys={coverage.instanceKeysString}
                                                                                data-control-type={attr.controlType}
                                                                                disabled={attr.isDisabledOrLoading}
                                                                                required={attr.isRequired}
                                                                                class="slds-text-body_small">
                                                                            </lightning-input>
                                                                        </template>

                                                                        <template if:true={attr.isMultivalue}>
                                                                            <lightning-combobox name={attr.developerName} label={attr.label}
                                                                                options={attr.options}
                                                                                value={attr.value}
                                                                                onchange={handleAttributeChange}
                                                                                data-coverage-key={coverage.key}
                                                                                data-attr-code={attr.code}
                                                                                data-value-decoder={attr.valueDecoder}
                                                                                data-attr-dev-name={attr.developerName}
                                                                                data-product-code={coverage.productCode}
                                                                                data-instance-keys={coverage.instanceKeysString}
                                                                                data-control-type={attr.controlType}
                                                                                disabled={attr.isDisabledOrLoading}
                                                                                required={attr.isRequired}
                                                                                class="slds-text-body_small"></lightning-combobox>
                                                                            <template if:true={attr.decoderValue}>
                                                                                <lightning-formatted-text value={attr.decoderValue}></lightning-formatted-text>
                                                                            </template>
                                                                        </template>

                                                                        <template if:true={attr.isLookup}>
                                                                            <div class="slds-form-element">
                                                                                <label class="slds-form-element__label slds-text-body_small">{attr.label}</label>
                                                                                <div class="slds-form-element__control">
                                                                                    <template if:true={attr.displayValue}>
                                                                                    </template>
                                                                                    <template if:false={attr.displayValue}>
                                                                                        <span class="slds-text-body_small">-</span>
                                                                                    </template>
                                                                                </div>
                                                                            </div>
                                                                        </template>

                                                                        <template if:true={attr.isStandardInput}>
                                                                            <lightning-input
                                                                                type={attr.inputType}
                                                                                name={attr.developerName}
                                                                                label={attr.label}
                                                                                value={attr.value}
                                                                                checked={attr.value}
                                                                                step={attr.step}
                                                                                formatter={attr.formatter}
                                                                                onchange={handleAttributeChange}
                                                                                onblur={handleAttributeBlur}
                                                                                data-coverage-key={coverage.key}
                                                                                data-attr-code={attr.code}
                                                                                data-attr-dev-name={attr.developerName}
                                                                                data-product-code={coverage.productCode}
                                                                                data-instance-keys={coverage.instanceKeysString}
                                                                                data-control-type={attr.controlType}
                                                                                read-only={attr.isReadOnly}
                                                                                disabled={attr.isDisabledOrLoading}
                                                                                required={attr.isRequired}
                                                                                class="slds-text-body_small">
                                                                            </lightning-input>
                                                                        </template>
                                                                    </div>
                                                                </template>
                                                            </div>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </lightning-card>
                        </div>
                    </template>
                </template>
                <template if:false={selectedNode}>
                    <div class="slds-align_absolute-center slds-p-vertical_large">
                        <p>{labels.SELECT_ITEM_MESSAGE}</p>
                    </div>
                </template>
            </div>
        </div>

        <!-- Footer: Price Summary -->
        <div class="sticky-footer slds-card__footer slds-grid">
             <!-- Left side: Price Summary title and Instant Pricing toggle -->
             <div class="slds-col slds-size_2-of-4 slds-align-top">
                 <h3 class="slds-text-heading_small slds-text-align_left slds-m-bottom_medium">{labels.PRICE_SUMMARY}</h3>
                 <div class="slds-grid slds-grid_vertical-align-center slds-p-top_large">
                     <lightning-input
                         type="checkbox"
                         label={labels.INSTANT_PRICING}
                         checked={instantPricing}
                         onchange={handleInstantPricingToggle}
                         class="slds-text-body_small slds-m-right_small">
                     </lightning-input>
                     <lightning-button
                         label={labels.UPDATE_PRICES}
                         onclick={handleUpdatePrices}
                         variant="neutral"
                         disabled={isUpdatePricesDisabled}
                         class="slds-text-body_small">
                     </lightning-button>
                 </div>
             </div>

            <!-- Right side: Price details -->
            <div class="slds-col slds-size_2-of-4">
                <div class="slds-float_right slds-size_2-of-5">
                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_x-small">
                        <span class="slds-text-body_regular">{labels.PREMIUM}</span>
                        <lightning-formatted-number value={priceSummary.premium} format-style="currency" currency-code={currencyCode} class="slds-text-body_regular"></lightning-formatted-number>
                    </div>
                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                        <span class="slds-text-body_small slds-text-color_weak">{labels.TAXES_FEES_SURCHARGE}</span>
                        <lightning-formatted-number value={priceSummary.taxesFees} format-style="currency" currency-code={currencyCode} class="slds-text-body_small slds-text-color_weak"></lightning-formatted-number>
                    </div>
                    <div class="slds-grid slds-grid_align-spread slds-border_top slds-p-top_small">
                        <span class="slds-text-heading_small">{labels.TOTAL_PREMIUM}</span>
                        <lightning-formatted-number value={priceSummary.totalPremium} format-style="currency" currency-code={currencyCode} class="slds-text-heading_small"></lightning-formatted-number>
                    </div>
                </div>
            </div>
        </div>

        <!-- Custom Navigation Buttons (shown when clearStateOnPrev is true) -->
        <template lwc:if={showCustomNextPrevButtons}>
            <div class="slds-card__footer slds-grid slds-grid_align-end slds-p-around_medium">
                <lightning-button
                    label={labels.PREVIOUS}
                    onclick={handleCustomPrevious}
                    variant="neutral"
                    disabled={isLoading}
                    class="slds-m-right_small">
                </lightning-button>
                <lightning-button
                    label={labels.NEXT}
                    onclick={handleCustomNext}
                    variant="brand"
                    disabled={isLoading}>
                </lightning-button>
            </div>
        </template>

        <!-- Delete Confirmation Modal -->
        <template if:true={showDeleteConfirmation}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">{labels.CONFIRM_DELETE}</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p>{labels.DELETE_CONFIRMATION_MESSAGE}</p>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button
                            label={labels.CANCEL}
                            onclick={handleCancelDelete}
                            class="slds-m-right_x-small">
                        </lightning-button>
                        <lightning-button
                            label={labels.CONFIRM}
                            variant="brand"
                            onclick={handleConfirmDelete}>
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
