<template>
    <template if:true={isCurrency}>
        <lightning-formatted-number
                value={value}
                format-style="currency"
                currency-code={currencyIsoCode}
        ></lightning-formatted-number>
    </template>

    <template if:true={isPercentage}>
        <lightning-formatted-number
                value={value}
                format-style="percent"
                minimum-fraction-digits="0"
                maximum-fraction-digits="2"
        ></lightning-formatted-number>
    </template>

    <template if:true={isDate}>
        <lightning-formatted-date-time
                value={value}
                year="numeric"
                month="numeric"
                day="numeric"
        ></lightning-formatted-date-time>
    </template>

    <template if:true={isDateTime}>
        <lightning-formatted-date-time
                value={value}
                year="numeric"
                month="numeric"
                day="numeric"
                hour="2-digit"
                minute="2-digit"
        ></lightning-formatted-date-time>
    </template>

    <template if:true={isText}>
        {displayValue}
    </template>
</template>
