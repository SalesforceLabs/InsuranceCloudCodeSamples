<template>
  <div class="sf-shell">
    <!-- ── Salesforce primary nav (cloud + search) ──────────── -->
    <header class="sf-primary">
      <!-- SLDS global header logo - matches the real DOM:
           <div class="slds-global-header__logo"><span class="slds-assistive-text">…</span></div>
           The cloud SVG is rendered via a background-image so the markup
           stays exactly as Salesforce ships it. -->
      <div class="slds-global-header__logo sf-primary-cloud">
        <span class="slds-assistive-text">Salesforce</span>
      </div>

      <div class="sf-search">
        <span class="sf-search-icon" aria-hidden="true">
          <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path d="M49.62 45.27L36.22 32a18.9 18.9 0 10-34.1-9.2A18.91 18.91 0 0032 36.27l13.3 13.3a1.45 1.45 0 002.1 0l2.1-2.1a1.68 1.68 0 00.12-2.2zm-28.7-11.5a12.9 12.9 0 1112.9-12.9 12.87 12.87 0 01-12.9 12.9z"  fill-rule="evenodd"/></svg>
        </span>
        <input
          class="sf-search-input"
          type="search"
          placeholder={sfSearchPlaceholder}
          aria-label="Search Salesforce"
          value={sfSearchQuery}
          oninput={handleSfSearchInput}
          onfocus={handleSfSearchFocus}
          onkeydown={handleSfSearchKeydown}
        />
        <template lwc:if={sfSearchOpen}>
          <div class="sf-search-panel" role="dialog" aria-label="Search Salesforce">
            <template lwc:if={hasSfSearchResults}>
              <ul class="sf-search-results" role="listbox">
                <template for:each={sfSearchResults} for:item="r">
                  <li
                    key={r.id}
                    class="sf-search-result"
                    role="option"
                    data-tab-id={r.id}
                    tabindex="0"
                    onclick={handleSfSearchResultPick}
                    onkeydown={handleSfSearchResultKey}
                  >
                    <!-- The two viewBoxes below differ by 10x on purpose:
                         the org authors `account` on a 100x100 grid and
                         `quotes` on 1000x1000. Do not unify them. -->
                    <span class={r.markClass} aria-hidden="true">
                      <template lwc:if={r.isAccount}>
                        <svg viewBox="0 0 100 100" fill="#fff" aria-hidden="true" focusable="false"><path d="M79 51.1c.1-2.1-1.4-2.7-2-2.7H55.2c-1.9 0-2.2 2-2.2 2.2V74h26zM64 67.9a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2c0-1.1.9-2 2-2h2a2 2 0 012 2zm0-10.2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2c0-1.1.9-2 2-2h2a2 2 0 012 2zm10 10.2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2c0-1.1.9-2 2-2h2a2 2 0 012 2zm0-10.2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2c0-1.1.9-2 2-2h2a2 2 0 012 2zM59 40.3V28.7c.1-2.1-1.4-2.7-2-2.7H23.2c-1.9 0-2.2 2-2.2 2.2V74h26V44.7s0-2.4 2.2-2.4h7.9c1.1 0 1.9-1.2 1.9-2M32 66.9a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2c0-1.1.9-2 2-2h2a2 2 0 012 2zm0-10.3a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2c0-1.1.9-2 2-2h2a2 2 0 012 2zm0-10.2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2c0-1.1.9-2 2-2h2a2 2 0 012 2zm0-10.2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2c0-1.1.9-2 2-2h2a2 2 0 012 2zm11 30.7a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2c0-1.1.9-2 2-2h2a2 2 0 012 2zm0-10.3a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2c0-1.1.9-2 2-2h2a2 2 0 012 2zm0-10.2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2c0-1.1.9-2 2-2h2a2 2 0 012 2zm0-10.2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2c0-1.1.9-2 2-2h2a2 2 0 012 2zm11 0a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2c0-1.1.9-2 2-2h2a2 2 0 012 2z"/></svg>
                      </template>
                      <template lwc:if={r.isRfq}>
                        <svg viewBox="0 0 1000 1000" fill="#fff" aria-hidden="true" focusable="false"><path d="M720 220H501c-14-1-26 6-36 16L197 505a61 61 0 000 85l212 212c23 23 61 23 85 0l271-272c10-10 16-26 15-40V280c0-33-27-60-60-60M504 660l-14 14c-8 8-20 8-28 0L326 538c-8-8-8-20 0-28l14-14c8-8 20-8 28 0l136 136c8 8 8 20 0 28m80-80l-14 14c-8 8-20 8-28 0L406 458c-8-8-8-20 0-28l14-14c8-8 20-8 28 0l136 136c8 8 8 20 0 28m56-170c-28 0-50-22-50-50s22-50 50-50 50 22 50 50-22 50-50 50"/></svg>
                      </template>
                    </span>
                    <span class="sf-search-result-body">
                      <span class="sf-search-result-label">{r.label}</span>
                      <span class="sf-search-result-meta">{r.meta}</span>
                    </span>
                  </li>
                </template>
              </ul>
            </template>
            <template lwc:else>
              <p class="sf-search-empty" role="status">{sfSearchEmptyCopy}</p>
            </template>
          </div>
        </template>
      </div>

      <!-- Agentforce Ask pill. In the org this is a child of the global
           header's search item, sitting immediately right of the search box,
           so it is anchored to that box rather than placed in the flow of
           .sf-primary. See .sf-ask in the stylesheet. -->
      <c-ask-agentforce-button
        class="sf-ask"
        lwc:ref="askButton"
        expanded={isCoworkerActive}
        onask={handleAskAgentforce}
      ></c-ask-agentforce-button>

      <div class="sf-primary-right">
        <div class="sf-header-icons-wrap" onkeydown={handleSetupMenuKeydown}>

    <!-- ── Setup home workspace tab panel - opened from the global
         header gear menu → Setup. Replicates the org's Setup landing
         page and owns its own Setup context bar. -->
    <template lwc:if={setupHomeOpen}>
      <div class={setupHomePanelClass}>
        <c-setup-home onclose={handleSetupHomeClose}></c-setup-home>
      </div>
    </template>

    <!-- ── Setup workspace tab panel - opened from App Launcher →
         Setup. Lives alongside the account / RFQ / policy tabs so the
         broker can switch back to any other tab without losing setup
         state. Active/hidden via the standard sf-shell-body pattern. -->
    <template lwc:if={setupOpen}>
      <div class={setupPanelClass}>
        <c-agentforce-setup onclose={handleSetupClose}></c-agentforce-setup>
      </div>
    </template>

    <!-- ── Standalone Client 360 workspace tab panel - opened from the
         App Launcher → Client 360. Renders the dashboard in standalone
         mode (Account picker + LOB filter). -->
    <template lwc:if={client360Open}>
      <div class={client360PanelClass}>
        <c-client-360-dashboard
          standalone={client360Standalone}
          account-id={activeAccountId}
        ></c-client-360-dashboard>
      </div>
    </template>

    <!-- ── Standalone Revenue Intelligence workspace tab panel -
         opened from the App Launcher → Revenue Intelligence. Org-wide
         commissions, revenue leakage, and billing health. -->
    <template lwc:if={revenueOpen}>
      <div class={revenuePanelClass}>
        <c-revenue-intelligence-dashboard></c-revenue-intelligence-dashboard>
      </div>
    </template>

    <!-- ── Dashboards landing tab panel - Setup-lookalike page with
         launch tiles for the three analytics surfaces. Each tile
         dispatches `dashboardopen`, routed by handleDashboardOpen. -->
    <template lwc:if={dashboardsOpen}>
      <div class={dashboardsPanelClass}>
        <c-dashboards-home
          ondashboardopen={handleDashboardOpen}
          onclose={handleDashboardsClose}
        ></c-dashboards-home>
      </div>
    </template>

    <!-- ── Home (Run My Day) workspace tab panel. Kept mounted at all
         times (homeOpen defaults to true) so switching from Home to
         an account tab and back is instantaneous and c-run-my-day
         preserves its internal state. Visibility is driven by
         homePanelClass, not by lwc:if, for the same reason. Props
         are forwarded through from c-app so it stays the single
         source of truth for persona + bound-account context.

         Meeting Playbooks no longer borrow this panel - each one opens
         as its own workspace tab (see the meetingPanels loop below). -->
    <template lwc:if={homeOpen}>
      <div class={homePanelClass}>
        <c-run-my-day
          persona-id={personaId}
          bound-account-ids={boundAccountIds}
          active-tab={rmdTab}
          meetings-revision={rmdMeetingsRevision}
          focus-date-key={rmdFocusDateKey}
          highlight-meeting-id={rmdHighlightMeetingId}
        ></c-run-my-day>
      </div>
    </template>

    <!-- ── Meeting Playbook workspace tab panels. One per open meeting,
         all kept mounted and toggled through panelClass so switching to
         an account tab and back preserves the prep the broker was
         reading. Mirrors the org, where clicking a carousel card lands
         on /lightning/r/MeetingPlaybook/<id>/view in its own tab. -->
    <template for:each={meetingPanels} for:item="mtg">
      <div key={mtg.id} class={mtg.panelClass}>
        <c-meeting-center
          meeting-id={mtg.meetingId}
          onclose={handleMeetingCenterClose}
        ></c-meeting-center>
      </div>
    </template>

    <!-- ────────────────── Account body (workspace tab content) ────────────────── -->
    <div class={accountBodyClass}>

    <!-- ── Highlights Panel ──────────────────────────────────── -->
    <header class="slds-page-header sf-record-header">
      <div class="slds-page-header__row">
        <!-- Account avatar + title -->
        <div class="slds-page-header__col-title">
          <div class="slds-media slds-media_center">
            <div class="slds-media__figure">
              <span class="sf-record-avatar" aria-hidden="true">
                <svg viewBox="0 0 100 100" fill="#fff" aria-hidden="true" focusable="false"><path d="M79 51.1c.1-2.1-1.4-2.7-2-2.7H55.2c-1.9 0-2.2 2-2.2 2.2V74h26zM64 67.9a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2c0-1.1.9-2 2-2h2a2 2 0 012 2zm0-10.2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2c0-1.1.9-2 2-2h2a2 2 0 012 2zm10 10.2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2c0-1.1.9-2 2-2h2a2 2 0 012 2zm0-10.2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2c0-1.1.9-2 2-2h2a2 2 0 012 2zM59 40.3V28.7c.1-2.1-1.4-2.7-2-2.7H23.2c-1.9 0-2.2 2-2.2 2.2V74h26V44.7s0-2.4 2.2-2.4h7.9c1.1 0 1.9-1.2 1.9-2M32 66.9a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2c0-1.1.9-2 2-2h2a2 2 0 012 2zm0-10.3a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2c0-1.1.9-2 2-2h2a2 2 0 012 2zm0-10.2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2c0-1.1.9-2 2-2h2a2 2 0 012 2zm0-10.2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2c0-1.1.9-2 2-2h2a2 2 0 012 2zm11 30.7a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2c0-1.1.9-2 2-2h2a2 2 0 012 2zm0-10.3a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2c0-1.1.9-2 2-2h2a2 2 0 012 2zm0-10.2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2c0-1.1.9-2 2-2h2a2 2 0 012 2zm0-10.2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2c0-1.1.9-2 2-2h2a2 2 0 012 2zm11 0a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2c0-1.1.9-2 2-2h2a2 2 0 012 2z"/></svg>
              </span>
            </div>
            <div class="slds-media__body">
              <p class="slds-page-header__name-meta">Account</p>
              <h1 class="slds-page-header__title slds-truncate sf-record-title">
                {account.name}
              </h1>
            </div>
          </div>
        </div>

        <!-- Action button group + Quick Action dropdown -->
        <div class="slds-page-header__col-actions">
          <!-- View Account Hierarchy is an icon-only 32px button sitting to
               the left of the action cluster, with its label as assistive
               text - the org renders no visible caption here. -->
          <button class="sf-hierarchy-btn" type="button" title="View Account Hierarchy">
            <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path d="M23.1,23H10.8c-0.7,0-1.4,0.6-1.4,1.3v10.5H5.3c-0.7,0-1.4,0.7-1.4,1.4v10c0,0.7,0.7,1.4,1.4,1.4H19c0.7,0,1.4-0.7,1.4-1.4v-10c0-0.7-0.7-1.4-1.4-1.4h-4.1v-6.4h21.9v6.4h-4.1c-0.7,0-1.4,0.7-1.4,1.4v10c0,0.7,0.7,1.4,1.4,1.4h13.7c0.7,0,1.3-0.7,1.3-1.4v-10c0-0.7-0.6-1.4-1.3-1.4h-4.2V24.3c0-0.7-0.7-1.3-1.4-1.3H28.6v-6.4h4.1c0.7,0,1.3-0.7,1.3-1.4v-10c0-0.7-0.6-1.4-1.3-1.4H19c-0.7,0-1.4,0.7-1.4,1.4v10c0,0.7,0.7,1.4,1.4,1.4h4.2V23z"/></svg>
            <span class="slds-assistive-text">View Account Hierarchy</span>
          </button>
          <!-- Follow is a standalone pill; Create RFQ / New Contact /
               New Case / caret form one joined group, matching the org. -->
          <button class="slds-button slds-button_neutral sf-follow-btn" type="button">
            <span class="sf-record-btn-icon" aria-hidden="true">
              <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M30 29h16.5c.8 0 1.5-.7 1.5-1.5v-3c0-.8-.7-1.5-1.5-1.5H30c-.6 0-1-.4-1-1V5.5c0-.8-.7-1.5-1.5-1.5h-3c-.8 0-1.5.7-1.5 1.5V22c0 .6-.4 1-1 1H5.5c-.8 0-1.5.7-1.5 1.5v3c0 .8.7 1.5 1.5 1.5H22c.6 0 1 .4 1 1v16.5c0 .8.7 1.5 1.5 1.5h3c.8 0 1.5-.7 1.5-1.5V30c0-.6.4-1 1-1z"/></svg>
            </span>
            Follow
          </button>
          <div class="slds-button-group sf-action-group" role="group">
            <button
              class="slds-button slds-button_neutral sf-record-btn"
              type="button"
              data-action="start-rfq"
              onclick={handleAction}
            >
              Create RFQ
            </button>
            <button class="slds-button slds-button_neutral sf-record-btn" type="button">New Contact</button>
            <button class="slds-button slds-button_neutral sf-record-btn" type="button">New Case</button>
            <div class={dropdownClass}>
              <button
                class="slds-button slds-button_icon slds-button_icon-border-filled sf-caret-btn action-dropdown-btn"
                type="button"
                aria-label="Show more actions"
                aria-haspopup="true"
                aria-expanded={dropdownAriaExpanded}
                title="Show more actions"
                onclick={toggleDropdown}
              >
                <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M47.6 17.8L27.1 38.5c-.6.6-1.6.6-2.2 0L4.4 17.8c-.6-.6-.6-1.6 0-2.2l2.2-2.2c.6-.6 1.6-.6 2.2 0l16.1 16.3c.6.6 1.6.6 2.2 0l16.1-16.2c.6-.6 1.6-.6 2.2 0l2.2 2.2c.5.6.5 1.5 0 2.1z"/></svg>
              </button>
              <template lwc:if={dropdownOpen}>
                <div class="slds-dropdown slds-dropdown_right slds-dropdown_small action-dropdown">
                  <ul class="slds-dropdown__list" role="menu">
                    <li class="slds-dropdown__item" role="presentation">
                      <a href="#edit" role="menuitem">Edit</a>
                    </li>
                    <li class="slds-dropdown__item" role="presentation">
                      <a href="#new-opp" role="menuitem">New Opportunity</a>
                    </li>
                    <li class="slds-dropdown__item" role="presentation">
                      <a href="#delete" role="menuitem">Delete</a>
                    </li>
                  </ul>
                </div>
              </template>
            </div>
          </div>
        </div>
      </div>

      <!-- Field strip -->
      <div class="slds-page-header__row sf-record-fields">
        <template for:each={account.fields} for:item="f">
          <div class="sf-record-field" key={f.id}>
            <span class="sf-record-field-label">{f.label}</span>
            <span class="sf-record-field-value">
              <!-- Owner row: 20px circular user avatar, the owner name as a
                   link, then the Change Owner pencil. The org's hover-preview
                   trigger carries `hide-hover-icon`, so it never paints - no
                   visible "Preview" affordance here either. -->
              <template lwc:if={f.isOwner}>
                <span class="sf-owner-avatar" aria-hidden="true">
                  <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                    <path fill="#ffffff" d="M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-3 0-9 1.5-9 5v1h18v-1c0-3.5-6-5-9-5z"/>
                  </svg>
                </span>
                <a class="sf-record-field-link" href="#owner">{f.value}</a>
                <button class="sf-owner-change" type="button" title="Change Owner" aria-label="Change Owner">
                  <svg class="sf-owner-edit" viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><g ><path d="M9.5 33.4l8.9 8.9c.4.4 1 .4 1.4 0L42 20c.4-.4.4-1 0-1.4l-8.8-8.8c-.4-.4-1-.4-1.4 0L9.5 32.1c-.4.4-.4 1 0 1.3zM36.1 5.7c-.4.4-.4 1 0 1.4l8.8 8.8c.4.4 1 .4 1.4 0l2.5-2.5c1.6-1.5 1.6-3.9 0-5.5l-4.7-4.7c-1.6-1.6-4.1-1.6-5.7 0l-2.3 2.5zM2.1 48.2c-.2 1 .7 1.9 1.7 1.7l10.9-2.6c.4-.1.7-.3.9-.5l.2-.2c.2-.2.3-.9-.1-1.3l-9-9c-.4-.4-1.1-.3-1.3-.1l-.2.2c-.3.3-.4.6-.5.9L2.1 48.2z"/></g></svg>
                </button>
              </template>
              <template lwc:elseif={f.value}>
                <span class="sf-record-field-text">{f.value}</span>
              </template>
              <template lwc:else>
                <span class="sf-record-field-blank">&nbsp;</span>
              </template>
            </span>
          </div>
        </template>
      </div>
    </header>

    <!-- ── 2-column body: Related lists (left) + Client Pulse (right) -->
    <div class={bodyGridClass}>
      <!-- LEFT COLUMN ─────────────────────────────────────── -->
      <div class="sf-body-main">
        <!-- Record tabs (Related / Details / …) -->
        <div
          class="sf-record-tabs"
          role="tablist"
          aria-label="Account record sections"
          onkeydown={handleRecordTabKeydown}
        >
          <template for:each={secondaryTabs} for:item="t">
            <button
              class={t.className}
              type="button"
              data-id={t.id}
              onclick={selectTab}
              role="tab"
              id={t.tabDomId}
              tabindex={t.tabIndex}
              aria-selected={t.selected}
              aria-controls={t.panelId}
              key={t.id}
            >{t.label}</button>
          </template>
        </div>

        <!-- Related lists - LEX related-list cards matching the org Account page -->
        <template lwc:if={isRelatedTab}>
        <section
          class="sf-related"
          role="tabpanel"
          id={relatedPanelId}
          aria-labelledby={relatedTabDomId}
        >
          <!-- Duplicate-check result card. Standard "merge" object icon
               (hot-orange circle, white glyph) then plain body copy -
               the org renders this as a normal related-list card, not
               as a warning banner. -->
          <article class="sf-related-banner" aria-live="polite">
            <span class="sf-related-merge" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="#ffffff" focusable="false">
                <path d="M11 21V12.4L6.4 7.8 7.8 6.4 11 9.6V3h2v6.6l3.2-3.2 1.4 1.4L13 12.4V21h-2z"/>
                <path d="M4 3h3v2H4zM17 3h3v2h-3z"/>
              </svg>
            </span>
            <p class="sf-related-banner-text">We found no potential duplicates of this Account.</p>
          </article>

          <article class="sf-related-row" aria-labelledby="rl-contacts">
            <span class="sf-related-icon sf-related-icon_contact" aria-hidden="true">
              <svg aria-hidden="true" viewBox="0 0 1000 1000" fill="#fff" focusable="false"><path d="M740 290H260c-33 0-60 27-60 60v290c0 33 27 60 60 60h480c33 0 60-27 60-60V350c0-33-27-60-60-60M486 630H314c-19 0-34-21-34-41 1-30 32-48 65-63 23-10 26-19 26-29s-6-19-14-26a68 68 0 01-21-50c0-38 23-70 63-70s63 32 63 70c0 20-7 38-21 50-8 7-14 16-14 26s3 19 26 28c33 14 64 34 65 64 2 20-13 41-32 41m234-70c0 11-9 20-20 20h-90c-11 0-20-9-20-20v-30c0-11 9-20 20-20h90c11 0 20 9 20 20zm0-110c0 11-9 20-20 20H550c-11 0-20-9-20-20v-30c0-11 9-20 20-20h150c11 0 20 9 20 20z"/></svg>
            </span>
            <h2 id="rl-contacts" class="sf-related-label">
              <a class="sf-related-title-link" href="#contacts">Contacts</a>
              <span class="sf-related-count">(0)</span>
            </h2>
            <button class="slds-button slds-button_neutral sf-related-btn" type="button">New</button>
          </article>

          <article class="sf-related-card sf-rl-card" aria-labelledby="rl-opps">
            <header class="sf-related-row sf-related-row_inline">
              <span class="sf-related-icon sf-related-icon_opp" aria-hidden="true">
                <svg aria-hidden="true" viewBox="0 0 1000 1000" fill="#fff" focusable="false"><path d="M711 690H289c-10 0-19 9-19 19v1c0 33 27 60 60 60h340c33 0 60-27 60-60v-1c0-10-9-19-19-19m49-410a60 60 0 00-39 106c-17 39-56 66-102 64-53-3-96-46-99-99 0-9 0-17 2-25a60 60 0 00-22-116 60 60 0 00-22 116c2 8 2 16 2 25-3 53-46 96-99 99-46 3-86-25-102-64a60 60 0 00-39-106c-33 0-60 27-60 60s27 60 60 60l28 214c1 9 9 16 19 16h426c9 0 17-7 19-16l28-214c33 0 60-27 60-60s-27-60-60-60"/></svg>
              </span>
              <h2 id="rl-opps" class="sf-related-label">
                <a class="sf-related-title-link" href="#opportunities">Opportunities</a>
                <span class="sf-related-count">{relatedOppCountLabel}</span>
              </h2>
              <button class="slds-button slds-button_neutral sf-related-btn" type="button">New</button>
            </header>
            <template lwc:if={hasRelatedOpportunities}>
              <div class="sf-rl-table-wrap">
                <table class="sf-rl-table" role="grid" aria-label="Opportunities">
                  <thead>
                    <tr>
                      <th scope="col">Opportunity Name</th>
                      <th scope="col">Stage</th>
                      <th scope="col">Amount</th>
                      <th scope="col">Close Date</th>
                      <th scope="col"><span class="slds-assistive-text">Action</span></th>
                    </tr>
                  </thead>
                  <tbody>
                    <template for:each={relatedOpportunities} for:item="row">
                      <tr key={row.id}>
                        <th scope="row">
                          <a class="sf-rl-name" href="#opp">{row.name}</a>
                          <button class="sf-rl-preview" type="button" title="Preview">Preview</button>
                        </th>
                        <td>{row.stage}</td>
                        <td>{row.amount}</td>
                        <td>{row.closeDate}</td>
                        <td>
                          <button class="sf-rl-row-menu" type="button" aria-label="Show Actions">
                            <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path d="M47.6 17.8L27.1 38.5c-.6.6-1.6.6-2.2 0L4.4 17.8c-.6-.6-.6-1.6 0-2.2l2.2-2.2c.6-.6 1.6-.6 2.2 0l16.1 16.3c.6.6 1.6.6 2.2 0l16.1-16.2c.6-.6 1.6-.6 2.2 0l2.2 2.2c.5.6.5 1.5 0 2.1z"/></svg>
                          </button>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
                <a class="sf-rl-view-all" href="#view-all-opps">View All</a>
              </div>
            </template>
          </article>

          <article class="sf-related-row" aria-labelledby="rl-cases">
            <span class="sf-related-icon sf-related-icon_case" aria-hidden="true">
              <svg aria-hidden="true" viewBox="0 0 1000 1000" fill="#fff" focusable="false"><path d="M380 290h40c6 0 10-4 10-10v-30h140v30c0 6 4 10 10 10h40c6 0 10-4 10-10v-30c0-33-27-60-60-60H430c-33 0-60 27-60 60v30c0 6 4 10 10 10m360 60H260c-33 0-60 27-60 60v320c0 33 27 60 60 60h480c33 0 60-27 60-60V410c0-33-27-60-60-60"/></svg>
            </span>
            <h2 id="rl-cases" class="sf-related-label">
              <a class="sf-related-title-link" href="#cases">Cases</a>
              <span class="sf-related-count">(0)</span>
            </h2>
            <button class="slds-button slds-button_neutral sf-related-btn" type="button">New</button>
          </article>

          <article class="sf-related-row" aria-labelledby="rl-partners">
            <span class="sf-related-icon sf-related-icon_partner" aria-hidden="true">
              <svg aria-hidden="true" viewBox="0 0 1000 1000" fill="#fff" focusable="false"><path d="M770 317h-60c-13 0-26-6-36-15l-48-41c-10-8-23-14-36-14H473c-15 0-29 6-40 17l-62 51c-5 4-5 12-1 17l19 18c13 10 30 12 43 3l55-33c7-5 17-3 23 3l173 168c4 4 7 10 7 16v45c0 12 9 25 20 25h60c11 0 20-9 20-21V337c0-12-9-20-20-20M600 497L492 392l-30 18c-15 9-32 14-49 14-21 0-43-8-60-22l-39-32c-9-7-14-15-15-26-2-11-10-17-20-17h-69c-11 0-20 6-20 18v182c0 12 9 20 20 20h40c3 0 7-11 11-16 15-20 37-31 61-34 24-2 47 6 66 23l125 114c11 10 19 21 24 35 3 7 11 9 16 4l47-47c24-24 42-80 20-106zm-251 74a28 28 0 00-42 4c-11 14-9 34 4 46l125 113c6 6 14 8 22 7s15-5 20-12c11-14 9-34-4-46z"/></svg>
            </span>
            <h2 id="rl-partners" class="sf-related-label">
              <a class="sf-related-title-link" href="#partners">Partners</a>
              <span class="sf-related-count">(0)</span>
            </h2>
            <button class="slds-button slds-button_neutral sf-related-btn" type="button">New</button>
          </article>

          <article class="sf-related-card sf-notes-card" aria-labelledby="rl-notes">
            <div class="sf-related-row sf-related-row_inline">
              <span class="sf-related-icon sf-related-icon_notes" aria-hidden="true">
                <svg aria-hidden="true" viewBox="0 0 1000 1000" fill="#fff" focusable="false"><path d="M713 670l-11 11a66 66 0 01-46 19h-33c-30 0-63-23-63-65v-31c0-25 11-40 18-48l135-136c4-4 7-12 7-17V300c0-33-27-60-60-60H340c-33 0-60 30-60 60h-20c-22 0-40 18-40 40s18 40 40 40h20v80h-20c-22 0-40 18-40 40s18 40 40 40h20v80h-20c-22 0-40 18-40 40s18 40 40 40h20c0 40 27 60 60 60h320c33 0 60-27 60-60v-27c0-6-3-7-7-3M610 390c0 11-9 20-20 20H390c-11 0-20-9-20-20v-20c0-11 9-20 20-20h200c11 0 20 9 20 20zm-90 240c0 11-9 20-20 20H390c-11 0-20-9-20-20v-20c0-11 9-20 20-20h110c11 0 20 9 20 20zm30-120c0 11-9 20-20 20H390c-11 0-20-9-20-20v-20c0-11 9-20 20-20h140c11 0 20 9 20 20zm264-54l-12-12c-8-8-20-8-28 0L621 599l-1 3v33c0 3 0 5 3 5h33l4-1 154-154c8-9 8-21 0-29"/></svg>
              </span>
              <h2 id="rl-notes" class="sf-related-label">
                <a class="sf-related-title-link" href="#notes">Notes &amp; Attachments</a>
                <span class="sf-related-count">(0)</span>
              </h2>
              <button class="slds-button slds-button_neutral sf-related-btn" type="button">
                Upload Files
              </button>
            </div>
            <div class="sf-notes-dropzone">
              <button class="sf-notes-upload-btn" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path fill="currentColor" d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/>
                </svg>
                Upload Files
              </button>
              <p class="sf-notes-drop-helper">Or drop files</p>
            </div>
          </article>

          <article class="sf-related-row" aria-labelledby="rl-invoices">
            <span class="sf-related-icon sf-related-icon_invoice" aria-hidden="true">
              <svg aria-hidden="true" viewBox="0 0 1000 1000" fill="#fff" focusable="false"><path d="M671 455a5 5 0 005-5V255c0-15-7-29-18-39s-25-16-40-16H312a60 60 0 00-40 17 55 55 0 00-17 35v394l2 7c2 7 6 13 10 18 5 5 10 10 16 13s13 5 20 6h232c4 0 7-4 5-8a152 152 0 01131-226zM341 321c0-3 0-6 2-8 0-2 3-5 5-6l7-4h245c3 0 5 2 7 4l5 6v27c0 6-3 11-8 14-4 4-10 5-15 5H362c-6 0-11 0-15-5s-7-9-8-14v-19zm154 245c0 3 0 5-2 8l-4 6-6 4H354l-7-4-5-6-2-7v-19c0-5 3-10 6-14 4-4 9-5 14-5h121l7 4 5 6 2 7zm47-94H366c-14 0-26-8-26-19v-18c0-11 11-19 26-19h177c14 0 26 8 26 19v18c0 10-12 19-27 19m132 153c-27-11-30-18-30-24s6-11 19-11 22 6 38 15l7 2c4 0 10-3 13-8l14-15c2-2 4-7 3-11 0-4-3-9-6-11-6-4-23-13-39-18v-25c0-6-5-9-10-9h-32q-6 0-6 9v26c-41 9-55 36-55 60 0 41 33 58 61 69 30 11 33 20 33 25s-9 13-20 13-24-4-41-15l-8-2c-5 0-10 2-12 7l-10 18c-5 8-3 13 3 20 5 6 25 17 50 22v29c0 6 0 9 6 9h32c5 0 10-3 10-9v-30c31-9 53-34 52-63 0-42-37-62-71-74h-1z"/></svg>
            </span>
            <h2 id="rl-invoices" class="sf-related-label">
              <a class="sf-related-title-link" href="#invoices">Invoices</a>
              <span class="sf-related-count">(0)</span>
            </h2>
            <button class="slds-button slds-button_neutral sf-related-btn" type="button">Settle Invoices</button>
          </article>
        </section>
        </template>

        <!-- Details tab body - two-column output grid mirroring a
             stock Lightning Account record page (Account Information
             + Address Information). -->
        <template lwc:if={isDetailsTab}>
          <section
            class="sf-record-details"
            role="tabpanel"
            id={detailsPanelId}
            aria-labelledby={detailsTabDomId}
          >
            <article class="sf-details-card">
              <header class="sf-details-card__head">
                <h2 class="sf-details-card__title">Account Information</h2>
              </header>
              <dl class="sf-details-grid">
                <template for:each={detailsInfoFields} for:item="f">
                  <div key={f.id} class="sf-details-field">
                    <dt class="sf-details-field__label">{f.label}</dt>
                    <dd class="sf-details-field__value">{f.value}</dd>
                  </div>
                </template>
              </dl>
              <template lwc:if={detailsDescription}>
                <div class="sf-details-field sf-details-field_full">
                  <dt class="sf-details-field__label">Description</dt>
                  <dd class="sf-details-field__value">{detailsDescription}</dd>
                </div>
              </template>
            </article>

            <article class="sf-details-card">
              <header class="sf-details-card__head">
                <h2 class="sf-details-card__title">Address Information</h2>
              </header>
              <dl class="sf-details-grid">
                <template for:each={detailsAddresses} for:item="a">
                  <div key={a.id} class="sf-details-field">
                    <dt class="sf-details-field__label">{a.label}</dt>
                    <dd class="sf-details-field__value sf-details-field__value_multiline">
                      <template for:each={a.lines} for:item="ln">
                        <span key={ln.id} class="sf-details-addr-line">{ln.value}</span>
                      </template>
                    </dd>
                  </div>
                </template>
              </dl>
            </article>
          </section>
        </template>

        <!-- RFQs tab body - SLDS data table of the account's RFQ history -->
        <template lwc:if={isRfqsTab}>
          <section
            class="sf-record-rfqs"
            role="tabpanel"
            id={rfqsPanelId}
            aria-labelledby={rfqsTabDomId}
          >
            <c-account-rfq-list
              account-id={activeAccountId}
              rfqs={currentAccountRfqs}
              onrfqselect={handleRfqRowSelect}
              onrfqaction={handleRfqAction}
            ></c-account-rfq-list>
          </section>
        </template>

        <!-- Submission Board tab body - LOB-grouped Ready RFQs +
             carrier appetite matrix. Emits `routebundle` when the
             broker sends a bundle so the app shell can flip
             statuses + broadcast the Quote Bot / Agentforce pair. -->
        <template lwc:if={isSubmissionBoardTab}>
          <section
            class="sf-record-submission-board"
            role="tabpanel"
            id={submissionBoardPanelId}
            aria-labelledby={submissionBoardTabDomId}
          >
            <c-submission-board
              account-id={activeAccountId}
              account-name={activeAccountName}
              rfqs={currentAccountRfqs}
              onroutebundle={handleRouteBundle}
              onratingcomplete={handleRatingComplete}
              ontoast={handleBoardToast}
            ></c-submission-board>
          </section>
        </template>

        <!-- Policies tab body - SLDS related-list mirroring the RFQs tab
             (transparent panel chrome + title strip + table with its own
             card chrome). -->
        <template lwc:if={isPoliciesTab}>
          <div class="sf-record-policies">
            <section class="sf-policies">
              <header class="sf-policies__head">
                <div class="sf-policies__title-block">
                  <h2 class="sf-policies__title">Insurance Policies</h2>
                  <p class="sf-policies__count">
                    <template lwc:if={hasPolicies}>{policiesCountLabel}</template>
                    <template lwc:else>No items to display</template>
                  </p>
                </div>
              </header>

              <template lwc:if={hasPolicies}>
                <table
                  class="sf-policies__table"
                  role="grid"
                  aria-label="Insurance Policies"
                >
                  <thead>
                    <tr>
                      <th scope="col"><div class="slds-truncate" title="Policy Number">Policy Number</div></th>
                      <th scope="col"><div class="slds-truncate" title="Policy Name">Policy Name</div></th>
                      <th scope="col"><div class="slds-truncate" title="Policy Type">Policy Type</div></th>
                      <th scope="col"><div class="slds-truncate" title="Expiration Date">Expiration Date</div></th>
                      <th scope="col" class="sf-policies__th-num"><div class="slds-truncate" title="Premium Amount">Premium Amount</div></th>
                      <th scope="col"><div class="slds-truncate" title="Status">Status</div></th>
                      <th scope="col" class="sf-policies__col-actions">
                        <span class="slds-assistive-text">Actions</span>
                      </th>
                    </tr>
                  </thead>
                  <tbody>
                    <template for:each={accountPolicies} for:item="p">
                      <tr key={p.id}>
                        <td>
                          <a
                            href="#open-policy"
                            class="sf-policies__link"
                            data-id={p.id}
                            data-name={p.name}
                            data-number={p.number}
                            data-lob={p.lob}
                            onclick={handlePolicyOpen}
                          >{p.number}</a>
                        </td>
                        <td>{p.name}</td>
                        <td class="sf-policies__cell-muted">{p.lob}</td>
                        <td class="sf-policies__cell-muted">{p.expiration}</td>
                        <td class="sf-policies__cell-num">{p.premium}</td>
                        <td><span class="sf-policies__status">{p.status}</span></td>
                        <td class="sf-policies__col-actions">
                          <div class="sf-policies__menu-wrap">
                            <button
                              class="sf-policies__row-menu-btn"
                              type="button"
                              aria-haspopup="menu"
                              aria-expanded={p.menuBtnAria}
                              title={p.actionsLabel}
                              data-id={p.id}
                              onclick={handlePolicyMenuToggle}
                            >
                              <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M8 20c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6 2.7-6 6-6zm18 0c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6 2.7-6 6-6zm18 0c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6 2.7-6 6-6z"/></svg>
                              <span class="slds-assistive-text">{p.actionsLabel}</span>
                            </button>
                            <template lwc:if={p.menuOpen}>
                              <div
                                class="slds-dropdown slds-dropdown_right slds-dropdown_small sf-policies__row-menu"
                                style={p.menuStyle}
                              >
                                <ul class="slds-dropdown__list" role="menu">
                                  <li class="slds-dropdown__item" role="presentation">
                                    <a
                                      href="#action"
                                      role="menuitem"
                                      data-id={p.id}
                                      data-number={p.number}
                                      data-lob={p.lob}
                                      data-action="create-renewal"
                                      onclick={handlePolicyMenuAction}
                                    >New Request For Quote</a>
                                  </li>
                                </ul>
                              </div>
                            </template>
                          </div>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </template>
            </section>

          </div>
        </template>

        <!-- Client 360 tab body - single-pane analytics dashboard,
             auto-filtered to the active account. -->
        <template lwc:if={isClient360Tab}>
          <section
            class="sf-record-client360"
            role="tabpanel"
            id={client360PanelId}
            aria-labelledby={client360TabDomId}
          >
            <c-client-360-dashboard
              account-id={activeAccountId}
            ></c-client-360-dashboard>
          </section>
        </template>
      </div>

      <!-- RIGHT SIDEBAR - the org's second record column. Activity /
           Chatter leads, then this app's Client Pulse card. -->
      <template lwc:if={showRelatedSidebar}>
      <aside class="sf-sidebar-stack">
        <!-- Activity / Chatter -->
        <c-activity-panel record-label="account"></c-activity-panel>

        <!-- Client Pulse (Agentforce AI card) -->
        <section class="sf-pulse">
          <header class="sf-pulse-head">
            <span class="sf-pulse-spark" aria-hidden="true">
              <svg aria-hidden="true" viewBox="0 0 13 13" focusable="false">
                <path fill="currentColor" d="M8.86791 6.77738L7.03536 7.68928C6.48478 7.96366 6.03946 8.40751 5.76418 8.95626L4.84925 10.7827C4.7197 11.0437 4.34456 11.0437 4.21501 10.7827L3.30008 8.95626C3.02479 8.40751 2.57947 7.96366 2.0289 7.68928L0.196345 6.77738C-0.0654483 6.64826 -0.0654483 6.27436 0.196345 6.14524L2.0289 5.23334C2.57947 4.95896 3.02479 4.51512 3.30008 3.96636L4.21501 2.13987C4.34456 1.87894 4.7197 1.87894 4.84925 2.13987L5.76418 3.96636C6.03946 4.51512 6.48478 4.95896 7.03536 5.23334L8.86791 6.14524C9.12971 6.27436 9.12971 6.64826 8.86791 6.77738ZM12.865 10.8392L12.0796 10.4465C11.8421 10.3308 11.6532 10.1372 11.5344 9.90313L11.1404 9.12035C11.0864 9.00737 10.9245 9.00737 10.8678 9.12035L10.4738 9.90313C10.3577 10.1398 10.1634 10.3281 9.92858 10.4465L9.1432 10.8392C9.02985 10.893 9.02985 11.0544 9.1432 11.1109L9.92858 11.5037C10.1661 11.6193 10.355 11.813 10.4738 12.047L10.8678 12.8298C10.9218 12.9428 11.0837 12.9428 11.1404 12.8298L11.5344 12.047C11.6505 11.8103 11.8448 11.622 12.0796 11.5037L12.865 11.1109C12.9783 11.0571 12.9783 10.8957 12.865 10.8392ZM12.865 1.80363L12.0796 1.41089C11.8421 1.29522 11.6532 1.10154 11.5344 0.867516L11.1404 0.0847341C11.0864 -0.0282447 10.9245 -0.0282447 10.8678 0.0847341L10.4738 0.867516C10.3577 1.10423 10.1634 1.29253 9.92858 1.41089L9.1432 1.80363C9.02985 1.85742 9.02985 2.01882 9.1432 2.07531L9.92858 2.46805C10.1661 2.58372 10.355 2.7774 10.4738 3.01142L10.8678 3.7942C10.9218 3.90718 11.0837 3.90718 11.1404 3.7942L11.5344 3.01142C11.6505 2.77471 11.8448 2.58641 12.0796 2.46805L12.865 2.07531C12.9783 2.02151 12.9783 1.86011 12.865 1.80363Z"/>
              </svg>
            </span>
            <h3 class="sf-pulse-title">Client Pulse</h3>
          </header>

          <p class="sf-pulse-body">
            This tool uses generative AI. Review responses to ensure they're
            accurate, valid, and harmless before you use them.
          </p>

          <div class="sf-pulse-illustration" aria-hidden="true">
            <span class="sf-pulse-blob sf-pulse-blob_a"></span>
            <span class="sf-pulse-blob sf-pulse-blob_b"></span>
            <div class="sf-pulse-doc">
              <span class="sf-pulse-doc-line sf-pulse-doc-line_brand"></span>
              <span class="sf-pulse-doc-line"></span>
              <span class="sf-pulse-doc-line"></span>
              <span class="sf-pulse-doc-line sf-pulse-doc-line_short"></span>
            </div>
            <span class="sf-pulse-plus sf-pulse-plus_a">+</span>
            <span class="sf-pulse-plus sf-pulse-plus_b">+</span>
          </div>

          <p class="sf-pulse-prompt">Start with a prompt</p>

          <button class="sf-pulse-cta" type="button" onclick={handlePulsePrompt}>
            Pers Account Client Demo
            <svg
              class="sf-pulse-cta-plus"
              viewBox="0 0 24 24"
              aria-hidden="true"
             focusable="false">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                d="M12 6 L12 18 M6 12 L18 12"
              />
            </svg>
          </button>
        </section>
      </aside>
      </template>
    </div>
    </div>
    <!-- end of account body (workspace tab content) -->

    <!-- ────────────── RFQ wizard workspace tab panels ───────────────
         Each open RFQ tab renders its own wizard panel. All panels
         live in the DOM simultaneously so switching back and forth
         between workspace tabs preserves the wizard state. CSS
         handles show/hide via the `_active` / `_hidden` modifier. -->
    <template for:each={rfqPanelEntries} for:item="t">
      <div class={t.panelClass} key={t.id} data-id={t.id}>
        <template lwc:if={t.isRfqPa}>
          <c-rfq-workspace
            context={t.context}
            session-tabs={t.sessionTabs}
            sibling-review-payloads={t.siblingReviewPayloads}
            onnavigate={handleWizardNavigate}
            onpolicybound={handleWizardPolicyBound}
            onrisksubmitted={handleWizardRiskSubmitted}
            onswitchsession={handleSwitchSession}
            onreviewsnapshot={handleReviewSnapshot}
          ></c-rfq-workspace>
        </template>
        <template lwc:if={t.isRfqEb}>
          <c-rfq-workspace-eb
            context={t.context}
            session-tabs={t.sessionTabs}
            sibling-review-payloads={t.siblingReviewPayloads}
            onnavigate={handleWizardNavigate}
            onpolicybound={handleWizardPolicyBound}
            onrisksubmitted={handleWizardRiskSubmitted}
            onswitchsession={handleSwitchSession}
            onreviewsnapshot={handleReviewSnapshot}
          ></c-rfq-workspace-eb>
        </template>
        <template lwc:if={t.isRfqHome}>
          <c-rfq-workspace-home
            context={t.context}
            session-tabs={t.sessionTabs}
            sibling-review-payloads={t.siblingReviewPayloads}
            onnavigate={handleWizardNavigate}
            onpolicybound={handleWizardPolicyBound}
            onrisksubmitted={handleWizardRiskSubmitted}
            onswitchsession={handleSwitchSession}
            onreviewsnapshot={handleReviewSnapshot}
          ></c-rfq-workspace-home>
        </template>
      </div>
    </template>

    <!-- ────────────── Insurance Policy workspace tab panels ──────────── -->
    <!-- EB policies open the rate-plan page; P&C policies open the FSC-style
         record page with the Details / Related / Policy UI hierarchy. -->
    <template for:each={policyPanelEntries} for:item="t">
      <div class={t.panelClass} key={t.id} data-id={t.id}>
        <template lwc:if={t.isEbPolicy}>
          <c-eb-policy-record-page
            policy-name={t.policyName}
            policy-number={t.policyNumber}
            lob={t.policyLob}
            renew-context={t.renewContext}
          ></c-eb-policy-record-page>
        </template>
        <template lwc:else>
          <c-insurance-policy-record-page
            policy-id={t.id}
            policy-name={t.policyName}
            policy-number={t.policyNumber}
            lob={t.policyLob}
            account-id={t.accountId}
            policy-seed={t.policySeed}
            renew-context={t.renewalContext}
          ></c-insurance-policy-record-page>
        </template>
      </div>
    </template>

    <!-- Agentforce Coworker workspace tab panel - opened by the global-header
         Ask pill. The org routes Ask to /lightning/coworker, a full page in
         its own tab, so there is no shell-level docked panel here. The nested
         RFQ workspaces still mount their own c-agentforce-panel for their
         record-scoped launches; those are unaffected. -->
    <template lwc:if={coworkerOpen}>
      <div class={coworkerPanelClass}>
        <c-agentforce-coworker persona-id={personaId}></c-agentforce-coworker>
      </div>
    </template>
  </div>
</template>
