<template>
  <div class="dh">
    <!-- ── Chrome (mirrors the Setup page's tab strip + close) ──── -->
    <div class="dh__chrome">
      <div class="dh__chrome-tabs" role="tablist" aria-label="Dashboards sections">
        <button class="dh__chrome-tab is-active" type="button" role="tab" aria-selected="true">Home</button>
      </div>
      <button
        class="dh__chrome-close"
        type="button"
        onclick={handleClose}
        title="Close Dashboards and return to the record page"
        aria-label="Close Dashboards"
      >
        <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path d="M31 25.4l13-13.1c.6-.6.6-1.5 0-2.1l-2-2.1c-.6-.6-1.5-.6-2.1 0L26.8 21.2c-.4.4-1 .4-1.4 0L12.3 8c-.6-.6-1.5-.6-2.1 0l-2.1 2.1c-.6.6-.6 1.5 0 2.1l13.1 13.1c.4.4.4 1 0 1.4L8 39.9c-.6.6-.6 1.5 0 2.1l2.1 2.1c.6.6 1.5.6 2.1 0L25.3 31c.4-.4 1-.4 1.4 0l13.1 13.1c.6.6 1.5.6 2.1 0L44 42c.6-.6.6-1.5 0-2.1L31 26.8c-.4-.4-.4-1 0-1.4z"/></svg>
      </button>
    </div>

    <div class="dh__body">
      <!-- Eyebrow + title -->
      <div class="dh__header">
        <div class="dh__eyebrow">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
            <path d="M3 3h8v8H3V3zm10 0h8v5h-8V3zm0 7h8v11h-8V10zM3 13h8v8H3v-8z"/>
          </svg>
          <span>DASHBOARDS</span>
        </div>
        <h1 class="dh__title">Dashboards</h1>
        <p class="dh__subtitle">
          Jump into your daily cockpit, an account deep-dive, or the
          org-wide revenue picture.
        </p>
      </div>

      <!-- Launch tiles -->
      <ul class="dh__grid">
        <template for:each={tilesDecorated} for:item="tile">
          <li key={tile.id} class="dh__grid-cell">
            <button
              type="button"
              class={tile.cls}
              data-id={tile.id}
              aria-label={tile.openLabel}
              onclick={handleTileClick}
            >
              <span class="dh-tile__icon" aria-hidden="true">
                <!-- Per-dashboard glyph (matches the App Launcher icons) -->
                <template lwc:if={tile.isRunMyDay}>
                  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
                    <path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 10.5H1v2h3v-2zm9-9.95h-2V3.5h2V.55zm7.45 3.91l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7l1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4zM20 10.5v2h3v-2h-3zm-8-5c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm-1 16.95h2V19.5h-2v2.95zm-7.45-3.91l1.41 1.41 1.79-1.8-1.41-1.41-1.79 1.8z"/>
                  </svg>
                </template>
                <template lwc:elseif={tile.isClient360}>
                  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
                    <path d="M3 13h4v8H3v-8zm7-9h4v17h-4V4zm7 5h4v12h-4V9z"/>
                  </svg>
                </template>
                <template lwc:elseif={tile.isRevenue}>
                  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
                    <path d="M3 17l4-4 4 4 6-6 4 4v6H3z" opacity="0.4"/>
                    <path d="M3 14.5l4-4 4 4 6-6 4 4-1.4 1.4L16 10.3l-6 6-4-4-1.6 1.6z"/>
                  </svg>
                </template>
              </span>

              <span class="dh-tile__body">
                <span class="dh-tile__meta">{tile.meta}</span>
                <span class="dh-tile__label">{tile.label}</span>
                <span class="dh-tile__desc">{tile.description}</span>
              </span>

              <span class="dh-tile__cta" aria-hidden="true">
                <span class="dh-tile__cta-text">Open</span>
                <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path d="M17.9 4.4l20.7 20.5c.6.6.6 1.6 0 2.2L17.9 47.6c-.6.6-1.6.6-2.2 0l-2.2-2.2c-.6-.6-.6-1.6 0-2.2l16.3-16.1c.6-.6.6-1.6 0-2.2L13.6 8.8c-.6-.6-.6-1.6 0-2.2l2.2-2.2c.6-.5 1.5-.5 2.1 0z"/></svg>
              </span>
            </button>
          </li>
        </template>
      </ul>
    </div>
  </div>
</template>
