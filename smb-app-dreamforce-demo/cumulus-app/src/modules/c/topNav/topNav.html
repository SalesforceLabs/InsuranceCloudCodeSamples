<template>
  <header class="nav">
    <div class="nav-inner">
      <!-- Brand -->
      <button class="brand" onclick={goHome} type="button">
        <span class="brand-logo">
          <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <defs>
              <linearGradient id="atlas-grad" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0%" stop-color="#7c3aed" />
                <stop offset="100%" stop-color="#066afe" />
              </linearGradient>
            </defs>
            <circle cx="16" cy="16" r="12" fill="url(#atlas-grad)" />
            <line x1="4" y1="16" x2="28" y2="16" stroke="#fff" stroke-width="1.4" stroke-opacity="0.92" stroke-linecap="round" />
            <ellipse cx="16" cy="16" rx="4.5" ry="12" fill="none" stroke="#fff" stroke-width="1.4" stroke-opacity="0.92" />
            <line x1="6.5" y1="10.5" x2="25.5" y2="10.5" stroke="#fff" stroke-width="1" stroke-opacity="0.55" stroke-linecap="round" />
            <line x1="6.5" y1="21.5" x2="25.5" y2="21.5" stroke="#fff" stroke-width="1" stroke-opacity="0.55" stroke-linecap="round" />
          </svg>
        </span>
        <span class="brand-name">Atlas</span>
      </button>

      <!-- Utility icons -->
      <div class="utility">
        <!-- SLDS 2 density toggle (Comfy ↔ Compact) -->
        <button
          class="icon-btn density-toggle"
          title={densityTitle}
          type="button"
          onclick={toggleDensity}
          aria-label={densityTitle}
        >
          <template lwc:if={isCompact}>
            <!-- Compact: condensed horizontal bars (custom density indicator) -->
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z" />
            </svg>
          </template>
          <template lwc:else>
            <!-- Comfy: spaced horizontal bars -->
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M3 5h18v2H3zM3 11h18v2H3zM3 17h18v2H3z"
              />
            </svg>
          </template>
          <span class="density-toggle__label">{densityLabel}</span>
        </button>

        <div class="tn-search">
          <button
            class={searchButtonClass}
            type="button"
            aria-label="Search"
            title="Search"
            aria-haspopup="dialog"
            aria-expanded={searchOpen}
            onclick={handleSearchToggle}
          >
            <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path d="M49.62 45.27L36.22 32a18.9 18.9 0 10-34.1-9.2A18.91 18.91 0 0032 36.27l13.3 13.3a1.45 1.45 0 002.1 0l2.1-2.1a1.68 1.68 0 00.12-2.2zm-28.7-11.5a12.9 12.9 0 1112.9-12.9 12.87 12.87 0 01-12.9 12.9z"  fill-rule="evenodd"/></svg>
          </button>

          <template lwc:if={searchOpen}>
            <!-- Click-outside scrim catches dismiss without a document
                 listener. Same pattern c-picklist uses. -->
            <div class="tn-search__scrim" onclick={handleSearchScrim}></div>

            <div
              class={searchPanelClass}
              role="dialog"
              aria-label="Search Digital Experiences"
            >
              <div class="tn-search__input-wrap">
                <svg class="tn-search__input-icon" viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path d="M49.62 45.27L36.22 32a18.9 18.9 0 10-34.1-9.2A18.91 18.91 0 0032 36.27l13.3 13.3a1.45 1.45 0 002.1 0l2.1-2.1a1.68 1.68 0 00.12-2.2zm-28.7-11.5a12.9 12.9 0 1112.9-12.9 12.87 12.87 0 01-12.9 12.9z"  fill-rule="evenodd"/></svg>
                <input
                  class="tn-search__input"
                  type="search"
                  placeholder="Search accounts and RFQs..."
                  value={searchQuery}
                  oninput={handleSearchInput}
                  onkeydown={handleSearchKey}
                  aria-label="Search Digital Experiences"
                />
              </div>

              <div class="tn-search__section-label">
                Digital Experiences
              </div>

              <template lwc:if={hasSearchResults}>
                <ul class="tn-search__results" role="listbox">
                  <template for:each={searchResults} for:item="r">
                    <li
                      key={r.id}
                      class="tn-search__result"
                      role="option"
                      data-tab-id={r.id}
                      tabindex="0"
                      onclick={handleResultPick}
                      onkeydown={handleSearchKey}
                    >
                      <span class="tn-search__result-mark" aria-hidden="true">
                        <template lwc:if={r.kindIsAccount}>
                          <svg viewBox="0 0 24 24" fill="currentColor" focusable="false"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-4 0-8 2-8 6v1h16v-1c0-4-4-6-8-6z"/></svg>
                        </template>
                        <template lwc:if={r.kindIsRfq}>
                          <svg viewBox="0 0 24 24" fill="currentColor" focusable="false"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6zm0 7V3.5L19.5 9H14zM8 12h8v2H8zm0 4h8v2H8z"/></svg>
                        </template>
                      </span>
                      <span class="tn-search__result-body">
                        <span class="tn-search__result-label">{r.label}</span>
                        <span class="tn-search__result-meta">{r.meta}</span>
                      </span>
                    </li>
                  </template>
                </ul>
              </template>

              <template lwc:else>
                <p class="tn-search__empty" role="status">
                  {searchEmptyCopy}
                </p>
              </template>
            </div>
          </template>
        </div>

        <button class="icon-btn bell" type="button" aria-label="Notifications" title="Notifications" onclick={toggleSlack}>
          <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><g ><path d="M46 33h-.5c-1.9 0-3.5-1.6-3.5-3.5V18c0-9.1-7.6-16.4-16.8-16C16.6 2.4 10 9.8 10 18.5v11.1c0 1.9-1.6 3.4-3.5 3.4H6c-2.2 0-4 1.9-4 4.1v1.5c0 .7.7 1.4 1.5 1.4h45c.8 0 1.5-.7 1.5-1.5V37c0-2.2-1.8-4-4-4zM30.9 44h-9.8c-.6 0-1.1.6-1 1.2.5 2.8 3 4.8 5.9 4.8s5.4-2.1 5.9-4.8c.1-.6-.4-1.2-1-1.2z"/></g></svg>
          <span class="bell-dot"></span>
        </button>

        <button class="icon-btn" type="button" aria-label="Menu" title="Menu">
          <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path d="M46.5 14h-41c-.8 0-1.5-.7-1.5-1.5v-3C4 8.7 4.7 8 5.5 8h41c.8 0 1.5.7 1.5 1.5v3c0 .8-.7 1.5-1.5 1.5zM46.5 28.9h-41c-.8 0-1.5-.7-1.5-1.5v-3c0-.7.7-1.4 1.5-1.4h41c.8 0 1.5.7 1.5 1.5v3c0 .7-.7 1.4-1.5 1.4zM46.5 44h-41c-.8 0-1.5-.7-1.5-1.5v-3c0-.8.7-1.5 1.5-1.5h41c.8 0 1.5.7 1.5 1.5v3c0 .8-.7 1.5-1.5 1.5z"/></svg>
        </button>

        <!-- Persona menu (demo Profile-based Home assignment).
             Clicking the avatar opens a small picker that swaps
             active persona → Run My Day layout switches to that
             persona's Home. -->
        <div class="tn-persona">
          <button
            class="avatar"
            title={personaAvatarTitle}
            type="button"
            aria-haspopup="menu"
            aria-expanded={personaMenuOpen}
            style={avatarStyle}
            onclick={handlePersonaToggle}
          >
            {initials}
          </button>

          <template lwc:if={personaMenuOpen}>
            <div class="tn-persona__scrim" onclick={handlePersonaScrim}></div>

            <div
              class={personaMenuClass}
              role="menu"
              aria-label="Switch persona"
            >
              <div class="tn-persona-menu__head">
                <span class="tn-persona-menu__eyebrow">Signed in as</span>
                <span class="tn-persona-menu__name">{personaName}</span>
              </div>
              <div class="tn-persona-menu__section-label">Switch persona</div>
              <ul class="tn-persona-menu__list" role="none">
                <template for:each={personaOptions} for:item="p">
                  <li
                    key={p.id}
                    class={p.cls}
                    role="menuitemradio"
                    aria-checked={p.isActive}
                    data-persona-id={p.id}
                    tabindex="0"
                    onclick={handlePersonaPick}
                  >
                    <span
                      class="tn-persona-option__avatar"
                      style={p.avatarStyle}
                      aria-hidden="true"
                    >{p.initials}</span>
                    <span class="tn-persona-option__body">
                      <span class="tn-persona-option__name">{p.name}</span>
                      <span class="tn-persona-option__role">{p.profileLabel}</span>
                    </span>
                    <template lwc:if={p.isActive}>
                      <svg
                        class="tn-persona-option__check"
                        viewBox="0 0 24 24"
                        fill="currentColor"
                        aria-hidden="true"
                        focusable="false"
                      >
                        <path d="M9 16.2l-3.5-3.5a1 1 0 011.4-1.4L9 13.4l7.1-7.1a1 1 0 011.4 1.4l-7.8 7.9a1 1 0 01-1.4 0z"/>
                      </svg>
                    </template>
                  </li>
                </template>
              </ul>
            </div>
          </template>
        </div>
      </div>
    </div>
  </header>
</template>
