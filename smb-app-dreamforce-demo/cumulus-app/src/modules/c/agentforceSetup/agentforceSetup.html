<template>
  <div class="afs-setup">
    <!-- Setup chrome (Home / Object Manager tabs + close ×) was
         removed per spec - the workspace footer's Cancel button now
         handles the exit-from-Setup affordance. The handleClose
         handler in JS stays dormant for one-line restore if a chrome
         bar comes back. -->

    <div class="afs-setup__body">
      <!-- Setup sidebar removed - RFQ Setup is now the only sidebar
           entry and is the default landing view, so the navigation
           rail adds no value. The main content takes the full body
           width. The sidebar getters / handler stay dormant in JS
           for one-line restore. -->

      <!-- ── Setup main content ────────────────────────────────── -->
      <main class="afs-setup__main">
        <!-- The SETUP eyebrow + gear icon were removed per spec.
             The workspace header "Setup" now carries that role. The
             `.afs-setup__header-eyebrow` CSS rule stays in the
             stylesheet for a one-line markup restore. -->

      <!-- ═══════════════════════════════════════════════════════
           RFQ Setup view (existing dashboard + wizard)
           ═══════════════════════════════════════════════════════ -->
      <template lwc:if={isRfqSetupView}>
        <header class="afs-setup__header">
          <div class="afs-setup__header-row">
            <h1 class="afs-setup__title">RFQ Setup</h1>
            <button class="afs-button afs-button_brand afs-setup__cta" type="button" onclick={handleNewPlaybook}>
              <svg class="afs-setup__cta-icon" viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M30 29h16.5c.8 0 1.5-.7 1.5-1.5v-3c0-.8-.7-1.5-1.5-1.5H30c-.6 0-1-.4-1-1V5.5c0-.8-.7-1.5-1.5-1.5h-3c-.8 0-1.5.7-1.5 1.5V22c0 .6-.4 1-1 1H5.5c-.8 0-1.5.7-1.5 1.5v3c0 .8.7 1.5 1.5 1.5H22c.6 0 1 .4 1 1v16.5c0 .8.7 1.5 1.5 1.5h3c.8 0 1.5-.7 1.5-1.5V30c0-.6.4-1 1-1z"/></svg>
              New Template
            </button>
          </div>
          <p class="afs-setup__sub">
            Build RFQ templates for quote and renewal, mapped to the Product Catalog.
          </p>
        </header>

        <!-- ── Template tiles ────────────────────────────────── -->
        <template lwc:if={hasPlaybooks}>
        <ul class="afs-setup__playbooks">
          <template for:each={playbookTiles} for:item="p">
            <li class={p.tileClass} key={p.id}>
              <header class="afs-setup__playbook-head">
                <span class="afs-setup__playbook-mark" aria-hidden="true">{p.initial}</span>
                <div class="afs-setup__playbook-meta">
                  <h2 class="afs-setup__playbook-name">{p.name}</h2>
                  <div class="afs-setup__playbook-badges">
                    <span class="afs-setup__playbook-badge">{p.badge}</span>
                    <span class={p.statusBadgeClass}>{p.statusBadge}</span>
                  </div>
                </div>

                <div class="afs-menu-anchor">
                  <button
                    class={p.moreBtnClass}
                    type="button"
                    aria-label="More actions"
                    aria-haspopup="menu"
                    aria-expanded={p.isOpen}
                    data-id={p.id}
                    onclick={handleToggleMenu}
                  >
                    <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M20 44c0-3.3 2.7-6 6-6s6 2.7 6 6-2.7 6-6 6-6-2.7-6-6zm0-18c0-3.3 2.7-6 6-6s6 2.7 6 6-2.7 6-6 6-6-2.7-6-6zm0-18c0-3.3 2.7-6 6-6s6 2.7 6 6-2.7 6-6 6-6-2.7-6-6z"/></svg>
                  </button>

                  <template lwc:if={p.isOpen}>
                    <ul class="afs-menu" role="menu" aria-label="Template actions">
                      <li role="none">
                        <button
                          class="afs-menu__item"
                          type="button"
                          role="menuitem"
                          data-id={p.id}
                          onclick={handleActivatePlaybook}
                        >
                          <svg class="afs-menu__icon" viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M19.1 42.5L2.6 25.9c-.6-.6-.6-1.6 0-2.2l2.2-2.2c.6-.6 1.6-.6 2.2 0L19.4 34c.4.4 1.1.4 1.5 0L45.2 9.5c.6-.6 1.6-.6 2.2 0l2.2 2.2c.6.6.6 1.6 0 2.2L21.3 42.5c-.6.7-1.6.7-2.2 0z"/></svg>
                          {p.activateLabel}
                        </button>
                      </li>
                      <li role="none">
                        <button
                          class="afs-menu__item"
                          type="button"
                          role="menuitem"
                          data-id={p.id}
                          onclick={handleEditPlaybook}
                        >
                          <svg class="afs-menu__icon" viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><g ><path d="M9.5 33.4l8.9 8.9c.4.4 1 .4 1.4 0L42 20c.4-.4.4-1 0-1.4l-8.8-8.8c-.4-.4-1-.4-1.4 0L9.5 32.1c-.4.4-.4 1 0 1.3zM36.1 5.7c-.4.4-.4 1 0 1.4l8.8 8.8c.4.4 1 .4 1.4 0l2.5-2.5c1.6-1.5 1.6-3.9 0-5.5l-4.7-4.7c-1.6-1.6-4.1-1.6-5.7 0l-2.3 2.5zM2.1 48.2c-.2 1 .7 1.9 1.7 1.7l10.9-2.6c.4-.1.7-.3.9-.5l.2-.2c.2-.2.3-.9-.1-1.3l-9-9c-.4-.4-1.1-.3-1.3-.1l-.2.2c-.3.3-.4.6-.5.9L2.1 48.2z"/></g></svg>
                          Edit
                        </button>
                      </li>
                      <li role="none">
                        <button
                          class="afs-menu__item"
                          type="button"
                          role="menuitem"
                          data-id={p.id}
                          onclick={handleClonePlaybook}
                        >
                          <!-- utility:copy glyph - two stacked rounded
                               rects to convey "duplicate". -->
                          <svg class="afs-menu__icon" viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M44 2H18c-2.2 0-4 1.8-4 4v2h24c2.2 0 4 1.8 4 4v28h2c2.2 0 4-1.8 4-4V6c0-2.2-1.8-4-4-4z"/><path  d="M38 16c0-2.2-1.8-4-4-4H8c-2.2 0-4 1.8-4 4v30c0 2.2 1.8 4 4 4h26c2.2 0 4-1.8 4-4V16zm-18 7c0 .6-.4 1-1 1h-8c-.6 0-1-.4-1-1v-2c0-.6.4-1 1-1h8c.6 0 1 .4 1 1v2zm8 16c0 .6-.4 1-1 1H11c-.6 0-1-.4-1-1v-2c0-.6.4-1 1-1h16c.6 0 1 .4 1 1v2zm4-8c0 .6-.4 1-1 1H11c-.6 0-1-.4-1-1v-2c0-.6.4-1 1-1h20c.6 0 1 .4 1 1v2z"/></svg>
                          Clone
                        </button>
                      </li>
                      <li role="none" class="afs-menu__sep" aria-hidden="true"></li>
                      <li role="none">
                        <button
                          class="afs-menu__item afs-menu__item_destructive"
                          type="button"
                          role="menuitem"
                          data-id={p.id}
                          onclick={handleDeletePlaybook}
                        >
                          <svg class="afs-menu__icon" viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                            <path fill="currentColor" d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM8 9h8v10H8V9zm7.5-5l-1-1h-5l-1 1H5v2h14V4z"/>
                          </svg>
                          Delete
                        </button>
                      </li>
                    </ul>
                  </template>
                </div>
              </header>

              <!-- Tile meta - Root Product · Version · Live since
                   in a single horizontal line so the tile stays slim
                   and admins can scan template identity at a glance. -->
              <p class="afs-setup__playbook-meta-line">{p.metaLine}</p>
            </li>
          </template>
        </ul>
        </template>

        <template lwc:if={hasPlaybooks}></template>
        <template lwc:else>
          <c-empty-state
            illustration-name="success:new"
            title="No templates yet"
            size="medium"
          >
            Use + New Template above to scope an RFQ flow by Line of
            Business, Line of Coverage, and Root Product. New
            templates land here once published.
          </c-empty-state>
        </template>

        <!-- Click-outside-to-close scrim for any open kebab menu -->
        <template lwc:if={openMenuId}>
          <div class="afs-menu-scrim" onclick={handleCloseMenu}></div>
        </template>
      </template>

      <!-- ═══════════════════════════════════════════════════════
           Quote Compare Setup view - owns its own dashboard +
           wizard chrome.
           ═══════════════════════════════════════════════════════ -->
      <template lwc:if={isQuoteCompareView}>
        <c-quote-compare-setup></c-quote-compare-setup>
      </template>

      <!-- ═══════════════════════════════════════════════════════
           Insurance Settings view - 5-domain modular Setup shell.
           Owns its own Root Product picker, categorized left nav,
           and right-canvas router. Bubbled `configurationsave`
           events surface here for any future toast/validation work.
           ═══════════════════════════════════════════════════════ -->
      <template lwc:if={isInsuranceSetupView}>
        <c-insurance-setup-workspace
          onworkspacecancel={handleClose}
        ></c-insurance-setup-workspace>
      </template>
      </main>
    </div>

    <!-- ═════════════════════════════════════════════════════════
         New Playbook wizard (modal)
         ═════════════════════════════════════════════════════════ -->
    <template lwc:if={wizardOpen}>
      <section role="dialog" aria-modal="true" aria-labelledby="afs-wizard-title" class={wizardOpenClass}>
        <div class="afs-wizard__container">
          <header class="afs-wizard__head">
            <h2 id="afs-wizard-title" class="afs-wizard__title">{wizardTitle}</h2>
            <button class="afs-wizard__close" type="button" onclick={handleWizardClose} aria-label="Close">
              <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M31 25.4l13-13.1c.6-.6.6-1.5 0-2.1l-2-2.1c-.6-.6-1.5-.6-2.1 0L26.8 21.2c-.4.4-1 .4-1.4 0L12.3 8c-.6-.6-1.5-.6-2.1 0l-2.1 2.1c-.6.6-.6 1.5 0 2.1l13.1 13.1c.4.4.4 1 0 1.4L8 39.9c-.6.6-.6 1.5 0 2.1l2.1 2.1c.6.6 1.5.6 2.1 0L25.3 31c.4-.4 1-.4 1.4 0l13.1 13.1c.6.6 1.5.6 2.1 0L44 42c.6-.6.6-1.5 0-2.1L31 26.8c-.4-.4-.4-1 0-1.4z"/></svg>
            </button>
          </header>

          <div class="afs-wizard__body">
            <!-- ── Stepper-driven steps (Initialize / Configure / Publish) ── -->
            <template lwc:if={isDefineStep}>
              <aside class="afs-wizard__nav" aria-label="Template setup steps">
                <div class="afs-wizard__progress">
                  <header class="afs-wizard__progress-head">
                    <span class="afs-wizard__progress-eyebrow">RFQ Progress</span>
                  </header>
                  <ol class="afs-wizard__nav-list">
                    <template for:each={wizardSteps} for:item="s">
                      <li class={s.cls} key={s.id} aria-current={s.ariaCurrent}>
                        <span class="afs-wizard__nav-mark-wrap" aria-hidden="true">
                          <span class={s.markCls}>
                            <template lwc:if={s.isDone}>
                              <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M19.1 42.5L2.6 25.9c-.6-.6-.6-1.6 0-2.2l2.2-2.2c.6-.6 1.6-.6 2.2 0L19.4 34c.4.4 1.1.4 1.5 0L45.2 9.5c.6-.6 1.6-.6 2.2 0l2.2 2.2c.6.6.6 1.6 0 2.2L21.3 42.5c-.6.7-1.6.7-2.2 0z"/></svg>
                            </template>
                            <template lwc:else>{s.index}</template>
                          </span>
                        </span>
                        <span class="afs-wizard__nav-text">
                          <span class="afs-wizard__nav-label">{s.label}</span>
                          <span class="afs-wizard__nav-sub">{s.sub}</span>
                        </span>
                      </li>
                    </template>
                  </ol>
                </div>
              </aside>
              <section class="afs-wizard__panel">
                <h3 class="afs-wizard__panel-title">Initialize Template</h3>
                <p class="afs-wizard__panel-sub">
                  Pick LOB and LOC to scope the template and drive downstream stages.
                </p>

                <template lwc:if={wasRestoreClamped}>
                  <div class="afs-banner afs-banner_info" role="status">
                    <span class="afs-banner__icon" aria-hidden="true">
                      <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                        <path fill="currentColor" d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 15h-2v-6h2v6zm-1-7.5a1.25 1.25 0 110-2.5 1.25 1.25 0 010 2.5z"/>
                      </svg>
                    </span>
                    <span class="afs-banner__copy">
                      <strong>Picked up where you left off.</strong>
                      We brought you back to <strong>Initialize</strong>
                      because Line of Business and Coverage weren&apos;t in
                      your saved session.
                      <button
                        type="button"
                        class="afs-banner__link"
                        onclick={handleDismissRestoreBanner}
                      >Got it</button>
                    </span>
                  </div>
                </template>

                <div class="afs-init-grid">
                  <div class="afs-field">
                    <span class="afs-field__label">
                      Line of Business <abbr class="slds-required" title="required">*</abbr>
                    </span>
                    <c-picklist
                      options={lobOptions}
                      value={lob}
                      placeholder="Choose a Line of Business…"
                      accessible-label="Line of Business"
                      onchange={handleLobChange}
                    ></c-picklist>
                  </div>

                  <div class="afs-field">
                    <span class="afs-field__label">
                      Line of Coverage <abbr class="slds-required" title="required">*</abbr>
                    </span>
                    <c-picklist
                      options={coverageOptions}
                      value={coverage}
                      placeholder="Choose a Line of Coverage…"
                      accessible-label="Line of Coverage"
                      disabled={isLobEmpty}
                      onchange={handleCoverageChange}
                    ></c-picklist>
                  </div>

                </div>

                <template lwc:if={hasExistingTemplateForPair}>
                  <!-- Flat existing-template prompt - header → sub →
                       (optional warning banner) → action tiles. The
                       former grey wrapper with the blue left border
                       was removed so contextual banners across all
                       Setup wizards follow the same placement
                       pattern: section copy first, banner second,
                       interactive content last. -->
                  <section
                    class="afs-mode-prompt"
                    role="region"
                    aria-label="Existing template prompt"
                  >
                    <h4 class="afs-mode-prompt__title">Existing template detected</h4>
                    <p class="afs-mode-prompt__sub">
                      A template already exists for this selection
                      (<strong>{existingPlaybookName}</strong>). Do you want to
                      edit the existing shipped layout or clone it as a new
                      profile?
                    </p>

                    <!-- Active-version warning fires as soon as the
                         LOB + Coverage pair resolves to an active
                         template - pre-choice - so the admin sees
                         the deactivation context before deciding
                         between Edit and Create new version. Copy
                         names the current version + its tenure
                         window and the overlap rule that determines
                         whether it gets deactivated on publish. -->
                    <template lwc:if={existingPlaybookIsActive}>
                      <div class="afs-banner afs-banner_warning" role="alert">
                        <span class="afs-banner__icon" aria-hidden="true">
                          <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M51.4 42.5l-22.9-37c-1.2-2-3.8-2-5 0L.6 42.5C-.8 44.8.6 48 3.1 48h45.8c2.5 0 4-3.2 2.5-5.5zM26 40c-1.7 0-3-1.3-3-3s1.3-3 3-3 3 1.3 3 3-1.3 3-3 3zm3-9c0 .6-.4 1-1 1h-4c-.6 0-1-.4-1-1V18c0-.6.4-1 1-1h4c.6 0 1 .4 1 1v13z"/></svg>
                        </span>
                        <span class="afs-banner__copy">
                          <strong>{existingPlaybookName} {existingPlaybookVersionLabel}</strong>
                          is currently live
                          <template lwc:if={existingPlaybookHasEnd}>
                            from <strong>{existingPlaybookLiveSinceLabel}</strong>
                            through <strong>{existingPlaybookEndLabel}</strong>.
                            If you choose <strong>Create new version</strong>
                            and its <strong>Effective Start Date</strong>
                            falls on or before <strong>{existingPlaybookEndLabel}</strong>,
                            {existingPlaybookName} {existingPlaybookVersionLabel}
                            will be deactivated when the new version is
                            published.
                          </template>
                          <template lwc:else>
                            since <strong>{existingPlaybookLiveSinceLabel}</strong>
                            (no scheduled end). If you choose
                            <strong>Create new version</strong>, set its
                            <strong>Effective Start Date</strong> to
                            <strong>{tomorrowLabel}</strong> or later to
                            keep {existingPlaybookName} live until then.
                            Otherwise it will be deactivated when the new
                            version is published.
                          </template>
                        </span>
                      </div>
                    </template>

                    <div class="afs-tile-grid">
                      <button
                        type="button"
                        class={editTileClass}
                        data-mode="edit"
                        onclick={handleModeChoice}
                      >
                        <span class="afs-tile__icon" aria-hidden="true">
                          <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><g ><path d="M9.5 33.4l8.9 8.9c.4.4 1 .4 1.4 0L42 20c.4-.4.4-1 0-1.4l-8.8-8.8c-.4-.4-1-.4-1.4 0L9.5 32.1c-.4.4-.4 1 0 1.3zM36.1 5.7c-.4.4-.4 1 0 1.4l8.8 8.8c.4.4 1 .4 1.4 0l2.5-2.5c1.6-1.5 1.6-3.9 0-5.5l-4.7-4.7c-1.6-1.6-4.1-1.6-5.7 0l-2.3 2.5zM2.1 48.2c-.2 1 .7 1.9 1.7 1.7l10.9-2.6c.4-.1.7-.3.9-.5l.2-.2c.2-.2.3-.9-.1-1.3l-9-9c-.4-.4-1.1-.3-1.3-.1l-.2.2c-.3.3-.4.6-.5.9L2.1 48.2z"/></g></svg>
                        </span>
                        <span class="afs-tile__title">Edit existing layout</span>
                        <span class="afs-tile__sub">
                          Update the shipped template in place. The RFQ flow
                          updates for every broker live.
                        </span>
                      </button>
                      <button
                        type="button"
                        class={cloneTileClass}
                        data-mode="clone"
                        onclick={handleModeChoice}
                      >
                        <span class="afs-tile__icon" aria-hidden="true">
                          <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M44 2H18c-2.2 0-4 1.8-4 4v2h24c2.2 0 4 1.8 4 4v28h2c2.2 0 4-1.8 4-4V6c0-2.2-1.8-4-4-4z"/><path  d="M38 16c0-2.2-1.8-4-4-4H8c-2.2 0-4 1.8-4 4v30c0 2.2 1.8 4 4 4h26c2.2 0 4-1.8 4-4V16zm-18 7c0 .6-.4 1-1 1h-8c-.6 0-1-.4-1-1v-2c0-.6.4-1 1-1h8c.6 0 1 .4 1 1v2zm8 16c0 .6-.4 1-1 1H11c-.6 0-1-.4-1-1v-2c0-.6.4-1 1-1h16c.6 0 1 .4 1 1v2zm4-8c0 .6-.4 1-1 1H11c-.6 0-1-.4-1-1v-2c0-.6.4-1 1-1h20c.6 0 1 .4 1 1v2z"/></svg>
                        </span>
                        <span class="afs-tile__title">Create new version</span>
                        <span class="afs-tile__sub">
                          Save your changes as a new version of this
                          template. The current version is preserved.
                        </span>
                      </button>
                    </div>
                  </section>
                </template>
              </section>
            </template>

            <template lwc:if={isConfigureStep}>
              <aside class="afs-wizard__nav" aria-label="Template setup steps">
                <div class="afs-wizard__progress">
                  <header class="afs-wizard__progress-head">
                    <span class="afs-wizard__progress-eyebrow">RFQ Progress</span>
                  </header>
                  <ol class="afs-wizard__nav-list">
                    <template for:each={wizardSteps} for:item="s">
                      <li class={s.cls} key={s.id} aria-current={s.ariaCurrent}>
                        <span class="afs-wizard__nav-mark-wrap" aria-hidden="true">
                          <span class={s.markCls}>
                            <template lwc:if={s.isDone}>
                              <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M19.1 42.5L2.6 25.9c-.6-.6-.6-1.6 0-2.2l2.2-2.2c.6-.6 1.6-.6 2.2 0L19.4 34c.4.4 1.1.4 1.5 0L45.2 9.5c.6-.6 1.6-.6 2.2 0l2.2 2.2c.6.6.6 1.6 0 2.2L21.3 42.5c-.6.7-1.6.7-2.2 0z"/></svg>
                            </template>
                            <template lwc:else>{s.index}</template>
                          </span>
                        </span>
                        <span class="afs-wizard__nav-text">
                          <span class="afs-wizard__nav-label">{s.label}</span>
                          <span class="afs-wizard__nav-sub">{s.sub}</span>
                        </span>
                      </li>
                    </template>
                  </ol>
                </div>
              </aside>
              <section class="afs-wizard__panel afs-wizard__panel_configure">
                <header class="afs-wizard__panel-head">
                  <h3 class="afs-wizard__panel-title">Configure Template</h3>
                  <p class="afs-wizard__panel-sub">
                    Pick a canvas stage to configure its data, field rules, and integrations.
                  </p>
                </header>
                <c-rfq-playbook-setup
                  lob={lob}
                  coverage={coverage}
                  onassignmentschange={handleAssignmentsChange}
                ></c-rfq-playbook-setup>
              </section>
            </template>

            <template lwc:if={isAssignStep}>
              <aside class="afs-wizard__nav" aria-label="Template setup steps">
                <div class="afs-wizard__progress">
                  <header class="afs-wizard__progress-head">
                    <span class="afs-wizard__progress-eyebrow">RFQ Progress</span>
                  </header>
                  <ol class="afs-wizard__nav-list">
                    <template for:each={wizardSteps} for:item="s">
                      <li class={s.cls} key={s.id} aria-current={s.ariaCurrent}>
                        <span class="afs-wizard__nav-mark-wrap" aria-hidden="true">
                          <span class={s.markCls}>
                            <template lwc:if={s.isDone}>
                              <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M19.1 42.5L2.6 25.9c-.6-.6-.6-1.6 0-2.2l2.2-2.2c.6-.6 1.6-.6 2.2 0L19.4 34c.4.4 1.1.4 1.5 0L45.2 9.5c.6-.6 1.6-.6 2.2 0l2.2 2.2c.6.6.6 1.6 0 2.2L21.3 42.5c-.6.7-1.6.7-2.2 0z"/></svg>
                            </template>
                            <template lwc:else>{s.index}</template>
                          </span>
                        </span>
                        <span class="afs-wizard__nav-text">
                          <span class="afs-wizard__nav-label">{s.label}</span>
                          <span class="afs-wizard__nav-sub">{s.sub}</span>
                        </span>
                      </li>
                    </template>
                  </ol>
                </div>
              </aside>
              <section class="afs-wizard__panel">
                <h3 class="afs-wizard__panel-title">Publish Template</h3>
                <p class="afs-wizard__panel-sub">
                  Assign visibility, then activate. Producers see it in the RFQ launcher on publish.
                </p>

                <!-- Version & Validity - PCM-style versioned template metadata -->
                <div class="afs-assign-card">
                  <header class="afs-assign-card__head">
                    <strong>Version &amp; Validity</strong>
                    <span class="afs-assign-card__hint">{versioningSummary}</span>
                  </header>

                  <template lwc:if={showVersionWarning}>
                    <div
                      class={publishVersionBannerClass}
                      role={publishVersionBannerRole}
                    >
                      <span class="afs-banner__icon" aria-hidden="true">
                        <template lwc:if={versionWillDeactivateOld}>
                          <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M51.4 42.5l-22.9-37c-1.2-2-3.8-2-5 0L.6 42.5C-.8 44.8.6 48 3.1 48h45.8c2.5 0 4-3.2 2.5-5.5zM26 40c-1.7 0-3-1.3-3-3s1.3-3 3-3 3 1.3 3 3-1.3 3-3 3zm3-9c0 .6-.4 1-1 1h-4c-.6 0-1-.4-1-1V18c0-.6.4-1 1-1h4c.6 0 1 .4 1 1v13z"/></svg>
                        </template>
                        <template lwc:else>
                          <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                            <path fill="currentColor" d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 15h-2v-6h2v6zm-1-7.5a1.25 1.25 0 110-2.5 1.25 1.25 0 010 2.5z"/>
                          </svg>
                        </template>
                      </span>
                      <span class="afs-banner__copy">{publishVersionNote}</span>
                    </div>
                  </template>

                  <div class="afs-version-grid">
                    <label class="afs-field afs-field_full">
                      <span class="afs-field__label">
                        Version Name <abbr class="slds-required" title="required">*</abbr>
                      </span>
                      <input
                        class="afs-field__input"
                        type="text"
                        value={versionName}
                        oninput={handleVersionNameChange}
                        placeholder="e.g., v1.0 - Initial Launch"
                        aria-label="Version Name"
                      />
                    </label>

                    <label class="afs-field">
                      <span class="afs-field__label">
                        Effective Start Date <abbr class="slds-required" title="required">*</abbr>
                      </span>
                      <c-date-input
                        value={effectiveStartDate}
                        accessible-label="Effective Start Date"
                        onchange={handleStartDateChange}
                      ></c-date-input>
                    </label>

                    <label class="afs-field">
                      <span class="afs-field__label">
                        Effective End Date <abbr class="slds-required" title="required">*</abbr>
                      </span>
                      <c-date-input
                        value={effectiveEndDate}
                        min={effectiveStartDate}
                        accessible-label="Effective End Date"
                        onchange={handleEndDateChange}
                      ></c-date-input>
                    </label>

                    <template lwc:if={isEndBeforeStart}>
                      <p class="afs-field__error afs-field_full" role="alert">
                        End Date must be on or after Start Date.
                      </p>
                    </template>
                  </div>
                </div>

                <!-- Activation - right-aligned toggle (SLDS 2 equivalent of lightning-input type="toggle") -->
                <div class="afs-assign-card afs-assign-card_row">
                  <header class="afs-assign-card__head">
                    <strong>Activation</strong>
                    <span class="afs-assign-card__hint">
                      Activate now or save as draft. You can publish later from the template list.
                    </span>
                  </header>

                  <button
                    type="button"
                    class="afs-toggle"
                    role="switch"
                    aria-checked={isTemplateActive}
                    aria-label="Template Status"
                    onclick={handleTemplateStatusToggle}
                  >
                    <span class="afs-toggle__caption" aria-hidden="true">Template Status</span>
                    <span class={templateStatusTrackClass} aria-hidden="true">
                      <span class="afs-toggle__thumb"></span>
                    </span>
                    <span class="afs-toggle__state" aria-live="polite">{templateStatusLabel}</span>
                  </button>
                </div>
              </section>
            </template>
          </div>

          <footer class="afs-wizard__foot">
            <template lwc:if={showPrevious}>
              <button class="afs-button afs-button_neutral" type="button" onclick={handlePrevious}>
                Previous
              </button>
            </template>
            <span class="afs-wizard__foot-spacer"></span>
            <button
              class="afs-button afs-button_brand"
              type="button"
              onclick={handleNext}
              disabled={nextDisabled}
            >
              {primaryActionLabel}
            </button>
          </footer>
        </div>
      </section>
      <div class={wizardBackdropClass} role="presentation"></div>
    </template>
  </div>
</template>
