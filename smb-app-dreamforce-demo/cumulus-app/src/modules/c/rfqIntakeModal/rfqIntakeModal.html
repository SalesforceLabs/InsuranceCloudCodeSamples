<template>
  <template lwc:if={open}>
    <!-- Standard SLDS modal structure: section.slds-modal > container >
         header / content / footer, with a sibling backdrop. -->
    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      aria-labelledby="rfq-intake-heading"
      aria-describedby="rfq-intake-content"
      class="slds-modal slds-fade-in-open slds-modal_medium"
      onclick={handleBackdrop}
    >
      <div class="slds-modal__container" onclick={stopPropagation}>
        <!-- ── Header ─────────────────────────────────────────── -->
        <header class="slds-modal__header">
          <button
            class="slds-button slds-button_icon slds-modal__close"
            type="button"
            title="Close"
            aria-label="Close this window"
            onclick={handleCancel}
          >
            <svg
              class="slds-button__icon"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
             viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M31 25.4l13-13.1c.6-.6.6-1.5 0-2.1l-2-2.1c-.6-.6-1.5-.6-2.1 0L26.8 21.2c-.4.4-1 .4-1.4 0L12.3 8c-.6-.6-1.5-.6-2.1 0l-2.1 2.1c-.6.6-.6 1.5 0 2.1l13.1 13.1c.4.4.4 1 0 1.4L8 39.9c-.6.6-.6 1.5 0 2.1l2.1 2.1c.6.6 1.5.6 2.1 0L25.3 31c.4-.4 1-.4 1.4 0l13.1 13.1c.6.6 1.5.6 2.1 0L44 42c.6-.6.6-1.5 0-2.1L31 26.8c-.4-.4-.4-1 0-1.4z"/></svg>
          </button>
          <h1 id="rfq-intake-heading" class="slds-modal__title slds-hyphenate">
            {modalTitle}
          </h1>
          <template lwc:if={modalSubtitle}>
            <p class="intake-modal__subtitle">{modalSubtitle}</p>
          </template>
        </header>

        <!-- ── Content ────────────────────────────────────────── -->
        <div class="slds-modal__content slds-p-around_medium" id="rfq-intake-content">
          <!-- No-template warning: surfaces at the very top of the modal
               body when the picked LOB + LOC has no active RFQ template.
               Blocks Save & Continue via the submitDisabled getter. See
               rfqIntakeModal.js for the hasMatchingTemplate check that
               drives this. -->
          <template lwc:if={showNoTemplateWarning}>
            <div class="intake-banner intake-banner_warning" role="alert">
              <span class="intake-banner__icon" aria-hidden="true">
                <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path d="M51.4 42.5l-22.9-37c-1.2-2-3.8-2-5 0L.6 42.5C-.8 44.8.6 48 3.1 48h45.8c2.5 0 4-3.2 2.5-5.5zM26 40c-1.7 0-3-1.3-3-3s1.3-3 3-3 3 1.3 3 3-1.3 3-3 3zm3-9c0 .6-.4 1-1 1h-4c-.6 0-1-.4-1-1V18c0-.6.4-1 1-1h4c.6 0 1 .4 1 1v13z"/></svg>
              </span>
              <span class="intake-banner__copy">
                <strong>No RFQ template exists for {lobLabel} + {locLabel}.</strong>
                Create an active template in <em>RFQ Setup</em> for this
                Line of Business and Line of Coverage before starting a
                new RFQ.
              </span>
            </div>
          </template>

          <p class="required-legend">
            <abbr class="slds-required" title="required">*</abbr> Required Information
          </p>

          <!-- Context-driven dropdowns (2-column grid) -->
          <div class="slds-grid slds-gutters slds-wrap intake-locked-grid">
            <div class="slds-col slds-size_1-of-1 slds-form-element intake-form-element">
              <label class="slds-form-element__label" for="intake-account">
                Account Name
              </label>
              <div class="slds-form-element__control">
                <!-- SLDS resolved-lookup: the selected record renders as a pill
                     whose action anchor is the clickable account link. -->
                <span class="slds-pill account-pill" id="intake-account">
                  <span class="slds-pill__icon_container account-pill__icon" title="Account">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                      <path
                        fill="currentColor"
                        d="M3 3h10v18H2V3zm11 6h9v12h-9V9zM4.5 5v1.5H6V5H4.5zm3 0v1.5H9V5H7.5zm3 0v1.5H12V5h-1.5zM4.5 8v1.5H6V8H4.5zm3 0v1.5H9V8H7.5zm3 0v1.5H12V8h-1.5zM4.5 11v1.5H6V11H4.5zm3 0v1.5H9V11H7.5zm3 0v1.5H12V11h-1.5z"
                      />
                    </svg>
                  </span>
                  <a
                    href="#account"
                    class="slds-pill__action account-pill__action"
                    title={accountName}
                    onclick={handleAccountClick}
                  >
                    <span class="slds-pill__label">{accountName}</span>
                  </a>
                  <!-- SLDS-style lock glyph (utility:lock equivalent) - replaces
                       the 🔒 unicode emoji so theme/color/size are deterministic
                       and the icon survives dark mode + density changes. -->
                  <span class="account-pill__lock" aria-hidden="true">
                    <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                      <path
                        fill="currentColor"
                        d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"
                      />
                    </svg>
                  </span>
                </span>
              </div>
            </div>

            <!-- Opportunity (optional) - sits right below Account so the
                 broker can tag the RFQ to a Salesforce Opportunity
                 record before scoping the LOB/LOC below. Plain text
                 input today; could be swapped to a record-picker
                 lookup once the data layer wires Opportunity objects
                 through.

                 Hybrid "Add Another LOC" path skips this field - the
                 broker is spawning a sibling LOC on the same
                 Opportunity they already scoped on the source RFQ, so
                 re-prompting adds noise without decision value. The
                 renewal path skips it too - the policy term is the only
                 thing that screen asks the broker to decide. -->
            <template lwc:if={showOpportunityField}>
              <div class="slds-col slds-size_1-of-1 slds-form-element intake-form-element">
                <label class="slds-form-element__label" for="intake-opportunity">
                  Opportunity
                </label>
                <div class="slds-form-element__control">
                  <input
                    type="text"
                    id="intake-opportunity"
                    class="slds-input intake-input"
                    placeholder="e.g., Mavericks Renewal 2026 (optional)"
                    value={opportunity}
                    oninput={handleOpportunityInput}
                  />
                </div>
              </div>
            </template>

            <div class="slds-col slds-size_1-of-2 slds-form-element intake-form-element">
              <label class="slds-form-element__label" for="intake-lob">
                Line of Business
                <abbr class="slds-required" title="required">*</abbr>
              </label>
              <div class="slds-form-element__control">
                <c-picklist
                  options={lobOptions}
                  value={lobLabel}
                  accessible-label="Line of Business"
                  disabled={lobDisabled}
                  onchange={handleLobChange}
                ></c-picklist>
              </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-form-element intake-form-element">
              <label class="slds-form-element__label" for="intake-loc">
                Line of Coverage
                <abbr class="slds-required" title="required">*</abbr>
              </label>
              <div class="slds-form-element__control">
                <c-picklist
                  options={locOptions}
                  value={locLabel}
                  accessible-label="Line of Coverage"
                  disabled={locDisabled}
                  onchange={handleLocChange}
                ></c-picklist>
              </div>
            </div>

            <!-- Effective From / Effective To - the new policy term
                 the broker is quoting for. Optional; downstream
                 workspace defaults to the day after priorEffectiveTo
                 when these are empty.

                 Hybrid "Add Another LOC" path skips these too - the
                 sibling LOC inherits the policy term from the source
                 RFQ at bundle-formation time (see c/app
                 handleIntakeContinue), so we don't re-ask. The renewal
                 path keeps them, pre-filled with the day after the
                 expiring term - they're the only editable fields there. -->
            <template lwc:if={showTermFields}>
              <div class="slds-col slds-size_1-of-2 slds-form-element intake-form-element">
                <label class="slds-form-element__label" for="intake-eff-from">
                  Effective From
                </label>
                <div class="slds-form-element__control">
                  <c-date-input
                    input-id="intake-eff-from"
                    value={effectiveFrom}
                    accessible-label="Effective From"
                    onchange={handleEffectiveFromChange}
                  ></c-date-input>
                </div>
              </div>
              <div class="slds-col slds-size_1-of-2 slds-form-element intake-form-element">
                <label class="slds-form-element__label" for="intake-eff-to">
                  Effective To
                </label>
                <div class="slds-form-element__control">
                  <c-date-input
                    input-id="intake-eff-to"
                    value={effectiveTo}
                    min={effectiveFrom}
                    accessible-label="Effective To"
                    onchange={handleEffectiveToChange}
                  ></c-date-input>
                </div>
              </div>
            </template>
          </div>

          <!-- Setup method: start fresh or clone the incumbent (better CX).
               Hidden in the hybrid "Add Another LOC" flow, which clones
               the LOC's incumbent automatically once the broker picks it
               (see handleLocChange) - the household already holds a
               policy for that coverage, so its limits are the useful
               starting point. Hidden on the renewal path too, where
               cloning the policy the broker acted on is the whole
               point of the action. -->
          <template lwc:if={showStartModeFields}>
            <fieldset class="slds-form-element renewal-branch">
              <legend class="slds-form-element__label renewal-branch-legend">
                How do you want to start?
                <abbr class="slds-required" title="required">*</abbr>
              </legend>
              <div class="slds-form-element__control">
                <label class={modeScratchClass}>
                  <input
                    type="radio"
                    name="rfq-intake-start-mode"
                    value="scratch"
                    checked={isScratch}
                    onchange={handleStartModeChange}
                  />
                  <span class="renewal-radio-faux" aria-hidden="true"></span>
                  <span class="renewal-radio-body">
                    <span class="renewal-radio-title">Start New Quote</span>
                    <span class="renewal-radio-detail">Build the RFQ from scratch by manually entering coverage and enrollment details.</span>
                  </span>
                </label>
                <label class={modeCloneClass}>
                  <input
                    type="radio"
                    name="rfq-intake-start-mode"
                    value="clone"
                    checked={isClone}
                    onchange={handleStartModeChange}
                  />
                  <span class="renewal-radio-faux" aria-hidden="true"></span>
                  <span class="renewal-radio-body">
                    <span class="renewal-radio-title">
                      Clone From Existing Policy
                    </span>
                    <span class="renewal-radio-detail">Prefill details from an existing policy, and only adjust what changed.</span>
                  </span>
                </label>
              </div>
            </fieldset>
          </template>

          <!-- Prior Policy dropdown - only when cloning, and only when
               the broker hasn't already named the policy by launching
               New Request For Quote from its row. -->
          <template lwc:if={showPriorPolicyPicker}>
            <div class="slds-form-element intake-form-element intake-prior-select">
              <label class="slds-form-element__label" for="intake-pp">
                Select Prior Policy
                <abbr class="slds-required" title="required">*</abbr>
              </label>
              <div class="slds-form-element__control">
                <c-picklist
                  options={priorPolicyOptions}
                  value={priorPolicy}
                  placeholder="Prior Policy"
                  accessible-label="Prior Policy"
                  onchange={handlePriorPolicyChange}
                ></c-picklist>
              </div>
            </div>
          </template>

          <!-- Prior Policy detail card - appears once a prior policy is cloned. -->
          <template lwc:if={showPriorPolicyDetail}>
            <div class="intake-prior-detail">
              <header class="intake-prior-detail-head">
                <h2 class="intake-prior-detail-title">Prior Policy Details</h2>
                <span class="intake-prior-detail-meta">Pre-fills the wizard from the incumbent record</span>
              </header>
              <dl class="slds-grid slds-gutters slds-wrap intake-prior-detail-grid">
                <div class="slds-col slds-size_1-of-2 intake-prior-detail-item">
                  <dt class="intake-prior-detail-term">Prior Carrier</dt>
                  <dd class="intake-prior-detail-value">{priorCarrierDisplay}</dd>
                </div>
                <div class="slds-col slds-size_1-of-2 intake-prior-detail-item">
                  <dt class="intake-prior-detail-term">Policy / Group Number</dt>
                  <dd class="intake-prior-detail-value">{priorPolicyNumberDisplay}</dd>
                </div>
                <div class="slds-col slds-size_1-of-2 intake-prior-detail-item">
                  <dt class="intake-prior-detail-term">Annual Premium</dt>
                  <dd class="intake-prior-detail-value">{priorPremiumDisplay}</dd>
                </div>
                <div class="slds-col slds-size_1-of-2 intake-prior-detail-item">
                  <dt class="intake-prior-detail-term">Years of Coverage</dt>
                  <dd class="intake-prior-detail-value">{priorYearsDisplay}</dd>
                </div>
              </dl>
            </div>
          </template>
        </div>

        <!-- ── Footer ─────────────────────────────────────────── -->
        <footer class="slds-modal__footer">
          <button
            class="slds-button slds-button_neutral"
            type="button"
            onclick={handleCancel}
          >
            Cancel
          </button>
          <button
            class="slds-button slds-button_brand"
            type="button"
            onclick={handleContinue}
            disabled={submitDisabled}
          >
            Save &amp; Continue
          </button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" aria-hidden="true"></div>
  </template>
</template>
