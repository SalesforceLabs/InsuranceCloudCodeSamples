<template>
  <template lwc:if={open}>
    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      aria-labelledby="eb-rate-heading"
      class="slds-modal slds-fade-in-open slds-modal_medium"
      onclick={handleBackdrop}
    >
      <div class="slds-modal__container" onclick={stopPropagation}>
        <!-- ── Header ─────────────────────────────────────────── -->
        <header class="slds-modal__header">
          <button
            class="slds-button slds-button_icon slds-modal__close"
            type="button"
            title="Close"
            aria-label="Close this window"
            onclick={handleCancel}
          >
            <svg
              class="slds-button__icon"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
             viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M31 25.4l13-13.1c.6-.6.6-1.5 0-2.1l-2-2.1c-.6-.6-1.5-.6-2.1 0L26.8 21.2c-.4.4-1 .4-1.4 0L12.3 8c-.6-.6-1.5-.6-2.1 0l-2.1 2.1c-.6.6-.6 1.5 0 2.1l13.1 13.1c.4.4.4 1 0 1.4L8 39.9c-.6.6-.6 1.5 0 2.1l2.1 2.1c.6.6 1.5.6 2.1 0L25.3 31c.4-.4 1-.4 1.4 0l13.1 13.1c.6.6 1.5.6 2.1 0L44 42c.6-.6.6-1.5 0-2.1L31 26.8c-.4-.4-.4-1 0-1.4z"/></svg>
          </button>
          <h1 id="eb-rate-heading" class="slds-modal__title slds-hyphenate">
            New Insurance Rate Plan
          </h1>
        </header>

        <!-- ── Content ────────────────────────────────────────── -->
        <div class="slds-modal__content slds-p-around_medium">
          <p class="required-legend">
            <abbr class="slds-required" title="required">*</abbr> Required Information
          </p>

          <div class="slds-grid slds-wrap slds-gutters eb-rate__grid">
            <!-- ── Row 1 - Insurance Policy + Type ── -->
            <div class="slds-col slds-size_1-of-2 eb-rate__col">
              <!-- Insurance Policy (required, read-only lookup pill) -->
              <div class="slds-form-element eb-rate__field">
                <label class="slds-form-element__label" for="eb-rate-policy">
                  Insurance Policy
                  <abbr class="slds-required" title="required">*</abbr>
                </label>
                <div class="slds-form-element__control">
                  <span class="slds-pill eb-rate__pill" id="eb-rate-policy">
                    <span
                      class="slds-pill__icon_container eb-rate__pill-icon"
                      title="Insurance Policy"
                    >
                      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path
                          fill="currentColor"
                          d="M4 3h11l5 5v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm10 1.5V8h3.5L14 4.5zM7 11h10v1.5H7V11zm0 4h10v1.5H7V15z"
                        />
                      </svg>
                    </span>
                    <span class="slds-pill__action eb-rate__pill-action">
                      <span class="slds-pill__label">{insurancePolicy}</span>
                    </span>
                    <span class="eb-rate__pill-lock" aria-hidden="true">
                      <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                        <path
                          fill="currentColor"
                          d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"
                        />
                      </svg>
                    </span>
                  </span>
                </div>
              </div>
            </div>
            <div class="slds-col slds-size_1-of-2 eb-rate__col">
              <!-- Rate Plan Type (required) -->
              <div class="slds-form-element eb-rate__field">
                <label class="slds-form-element__label" for="eb-rate-type">
                  Rate Plan Type
                  <abbr class="slds-required" title="required">*</abbr>
                </label>
                <div class="slds-form-element__control">
                  <c-picklist
                    options={typeOptions}
                    value={fieldType}
                    placeholder="--None--"
                    accessible-label="Rate Plan Type"
                    onchange={handleTypeChange}
                  ></c-picklist>
                </div>
              </div>
            </div>

            <!-- ── Row 2 - Frequency + Eligible Tiers, side by side ── -->
            <div class="slds-col slds-size_1-of-2 eb-rate__col">
              <div class="slds-form-element eb-rate__field">
                <label class="slds-form-element__label" for="eb-rate-frequency">
                  Frequency
                  <abbr class="slds-required" title="required">*</abbr>
                </label>
                <div class="slds-form-element__control">
                  <c-picklist
                    options={frequencyOptions}
                    value={fieldFrequency}
                    placeholder="--None--"
                    accessible-label="Frequency"
                    onchange={handleFrequencyChange}
                  ></c-picklist>
                </div>
              </div>
            </div>

            <!-- Eligible Tiers (SLDS 2 multi-select combobox) -->
            <div class="slds-col slds-size_1-of-2 eb-rate__col">
              <div class="slds-form-element eb-rate__field">
                <label class="slds-form-element__label" for="eb-rate-tier-trigger">
                  Eligible Tiers
                  <abbr class="slds-required" title="required">*</abbr>
                </label>
                <div class="slds-form-element__control eb-rate__multi">
                  <button
                    id="eb-rate-tier-trigger"
                    type="button"
                    class={eligibleTierTriggerCls}
                    role="combobox"
                    aria-haspopup="listbox"
                    aria-expanded={tierMenuAriaExpanded}
                    aria-label="Eligible Tiers"
                    onclick={handleTierMenuToggle}
                  >
                    <span class={eligibleTierValueCls}>{eligibleTierTriggerLabel}</span>
                    <svg
                      class="eb-rate__multi-chev"
                      viewBox="0 0 24 24"
                      aria-hidden="true"
                      focusable="false"
                    >
                      <path
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M6 9l6 6 6-6"
                      />
                    </svg>
                  </button>

                  <template lwc:if={isTierMenuOpen}>
                    <!-- Transparent scrim catches outside clicks without a
                         document-level listener (mirrors c-picklist). -->
                    <div class="eb-rate__multi-scrim" onclick={handleTierMenuScrim}></div>
                    <ul
                      class="eb-rate__multi-menu"
                      role="listbox"
                      aria-multiselectable="true"
                      aria-label="Eligible Tiers"
                      style={tierMenuStyle}
                    >
                      <template for:each={eligibleTierMenuItems} for:item="m">
                        <li
                          key={m.id}
                          role="option"
                          aria-selected={m.ariaSelected}
                          class={m.cls}
                        >
                          <label class="eb-rate__multi-item-label-wrap">
                            <input
                              type="checkbox"
                              class="eb-rate__multi-input"
                              data-id={m.id}
                              checked={m.selected}
                              onchange={handleEligibleTierToggle}
                              aria-label={m.label}
                            />
                            <span class="eb-rate__multi-check" aria-hidden="true"></span>
                            <span class="eb-rate__multi-item-label">{m.label}</span>
                          </label>
                        </li>
                      </template>
                    </ul>
                  </template>
                </div>
              </div>
            </div>
          </div>

        </div>

        <!-- ── Footer (right → left: Save & Add Line Items, Save, Cancel) ── -->
        <footer class="slds-modal__footer">
          <button
            class="slds-button slds-button_neutral"
            type="button"
            onclick={handleCancel}
          >
            Cancel
          </button>
          <button
            class="slds-button slds-button_brand"
            type="button"
            disabled={saveDisabled}
            onclick={handleSave}
          >
            Save
          </button>
          <button
            class="slds-button slds-button_neutral"
            type="button"
            disabled={saveAddDisabled}
            onclick={handleSaveAddLineItems}
          >
            Save &amp; Add Line Items
          </button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
