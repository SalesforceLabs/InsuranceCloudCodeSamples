<template>
  <div class={overlayClass} onclick={handleOverlayClick} aria-hidden={hiddenAttr}></div>

  <aside class={drawerClass} role="dialog" aria-label="Slack - acct-vanguard-logistics">

    <!-- ── Dark workspace sidebar (Slack signature) ────────────────── -->
    <nav class="sidebar" aria-label="Workspace navigation">
      <button class="ws-logo" type="button" aria-label="Atlas workspace" title="Atlas · Commercial Fleet Brokerage">
        <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="ws-grad" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0%" stop-color="#7c3aed" />
              <stop offset="100%" stop-color="#066afe" />
            </linearGradient>
          </defs>
          <circle cx="16" cy="16" r="12" fill="url(#ws-grad)" />
          <line x1="4" y1="16" x2="28" y2="16" stroke="#fff" stroke-width="1.4" stroke-opacity="0.92" stroke-linecap="round" />
          <ellipse cx="16" cy="16" rx="4.5" ry="12" fill="none" stroke="#fff" stroke-width="1.4" stroke-opacity="0.92" />
          <line x1="6.5" y1="10.5" x2="25.5" y2="10.5" stroke="#fff" stroke-width="1" stroke-opacity="0.55" stroke-linecap="round" />
          <line x1="6.5" y1="21.5" x2="25.5" y2="21.5" stroke="#fff" stroke-width="1" stroke-opacity="0.55" stroke-linecap="round" />
        </svg>
      </button>

      <ul class="ws-nav">
        <li>
          <button class="ws-nav-btn is-active" type="button" title="Home" aria-label="Home">
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span class="ws-nav-label">Home</span>
          </button>
        </li>
        <li>
          <button class="ws-nav-btn" type="button" title="Direct messages" aria-label="DMs">
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/></svg>
            <span class="ws-nav-label">DMs</span>
          </button>
        </li>
        <li>
          <button class="ws-nav-btn" type="button" title="Activity" aria-label="Activity">
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M12 22a2 2 0 002-2h-4a2 2 0 002 2zm6-6V11a6 6 0 10-12 0v5l-2 2v1h16v-1l-2-2z"/></svg>
            <span class="ws-nav-badge">3</span>
            <span class="ws-nav-label">Activity</span>
          </button>
        </li>
        <li>
          <button class="ws-nav-btn" type="button" title="Later" aria-label="Saved for later">
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
            <span class="ws-nav-label">Later</span>
          </button>
        </li>
        <li>
          <button class="ws-nav-btn" type="button" title="More" aria-label="More">
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            <span class="ws-nav-label">More</span>
          </button>
        </li>
      </ul>

      <button class="ws-add" type="button" title="Add workspace" aria-label="Add workspace">
        <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
      </button>
    </nav>

    <!-- ── Main panel ─────────────────────────────────────────────── -->
    <section class="panel">
      <!-- Channel header -->
      <header class="drawer-head">
        <div class="head-row">
          <div class="channel">
            <button class="star" type="button" aria-label="Star this channel" title="Star">
              <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M22 9.24l-7.19-.62L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.63-7.03L22 9.24z"/></svg>
            </button>
            <button class="channel-title" type="button" aria-label="Channel details">
              <span class="hash">#</span>
              <span class="channel-name">{channelName}</span>
              <svg class="caret" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path fill="currentColor" d="M7 10l5 5 5-5z" />
              </svg>
            </button>
          </div>

          <div class="head-utility">
            <button class="member-stack" type="button" aria-label="Members">
              <svg class="member-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
              <span class="member-count">{memberCount}</span>
            </button>
            <button class="icon-btn" type="button" aria-label="Call" title="Start a huddle">
              <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M3 18v-1.5c0-1.5 3-2.5 4.5-2.5s4.5 1 4.5 2.5V18H3zm14-7.5h-1V8h1v2.5zm-9-2c1.5 0 2.5 1 2.5 2.5S9.5 13.5 8 13.5 5.5 12.5 5.5 11 6.5 8.5 8 8.5zm12.4 5.5l-4.4-2.5v1.5h-3v2h3V16l4.4-2z"/></svg>
            </button>
            <button class="icon-btn" type="button" aria-label="Notifications" title="Notifications">
              <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M12 22a2 2 0 002-2h-4a2 2 0 002 2zm6-6V11a6 6 0 10-12 0v5l-2 2v1h16v-1l-2-2z"/></svg>
            </button>
            <button class="icon-btn" type="button" aria-label="Search" title="Search">
              <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
            <button class="icon-btn kebab" type="button" aria-label="More">
              <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </button>
            <button class="icon-btn" onclick={handleClose} type="button" aria-label="Close">
              <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
          </div>
        </div>

        <!-- Sub-tab row: Messages | Add canvas | + -->
        <div class="sub-tabs">
          <button class="sub-tab is-active" type="button">
            <svg class="sub-tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
            Messages
          </button>
          <button class="sub-tab" type="button">
            <svg class="sub-tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/></svg>
            Add canvas
          </button>
          <button class="sub-tab plus" type="button" aria-label="Add tab">
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
          </button>
        </div>
      </header>

      <!-- Message stream -->
      <div class="drawer-body">
        <div class="day-divider">
          <span class="day-rule"></span>
          <button class="day-pill" type="button">
            Today
            <svg class="day-caret" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
          </button>
          <span class="day-rule"></span>
        </div>

        <template for:each={displayMessages} for:item="msg">
          <div class={msg.className} key={msg.id}>
            <span class={msg.avatarClass} style={msg.avatarStyle} aria-hidden="true">
              <template lwc:if={msg.avatarSrc}>
                <img class="msg-avatar-img" src={msg.avatarSrc} alt="" />
              </template>
              <template lwc:else>{msg.initials}</template>
            </span>
            <div class="msg-body">
              <div class="msg-meta">
                <span class="msg-author">{msg.author}</span>
                <template lwc:if={msg.hasRole}>
                  <span class="role-chip">{msg.role}</span>
                </template>
                <span class="msg-time">{msg.timestamp}</span>
              </div>
              <div class="msg-text">
                <template for:each={msg.segments} for:item="seg">
                  <span class={seg.className} key={seg.id}>{seg.text}</span>
                </template>
              </div>

              <template lwc:if={msg.hasAction}>
                <div class="msg-action-row">
                  <button
                    class="msg-action-btn"
                    type="button"
                    data-action-id={msg.actionId}
                    data-message-id={msg.id}
                    onclick={handleAction}
                  >
                    {msg.actionLabel}
                  </button>
                </div>
              </template>

              <template lwc:if={msg.hasReactions}>
                <div class="reactions">
                  <template for:each={msg.reactions} for:item="r">
                    <button class={r.className} type="button" key={r.id}>
                      <span class="reaction-emoji">{r.emoji}</span>
                      <span class="reaction-count">{r.count}</span>
                    </button>
                  </template>
                  <button class="reaction add" type="button" aria-label="Add reaction">
                    <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/><path fill="currentColor" d="M19 2v3h3v2h-3v3h-2V7h-3V5h3V2z"/></svg>
                  </button>
                </div>
              </template>

              <template lwc:if={msg.hasThread}>
                <button class="thread-link" type="button">
                  <span class="thread-avatars">
                    <span class="thread-avatar t1">MD</span>
                    <span class="thread-avatar t2">ST</span>
                  </span>
                  <span class="thread-count">{msg.threadReplies} replies</span>
                  <span class="thread-last">Last reply by {msg.threadLastReply}</span>
                </button>
              </template>
            </div>

            <!-- Hover toolbar -->
            <div class="msg-actions" role="toolbar" aria-label="Message actions">
              <button class="msg-act" type="button" aria-label="React" title="Add reaction">
                <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm3.5 6c.83 0 1.5.67 1.5 1.5S16.33 11 15.5 11 14 10.33 14 9.5 14.67 8 15.5 8zM8.5 8c.83 0 1.5.67 1.5 1.5S9.33 11 8.5 11 7 10.33 7 9.5 7.67 8 8.5 8zM12 17.5c-2.33 0-4.32-1.45-5.12-3.5h10.24c-.8 2.05-2.79 3.5-5.12 3.5z"/></svg>
              </button>
              <button class="msg-act" type="button" aria-label="Reply in thread" title="Reply in thread">
                <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1zm-4 6V3c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1z"/></svg>
              </button>
              <button class="msg-act" type="button" aria-label="Share" title="Share message">
                <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M14 9V5l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11z"/></svg>
              </button>
              <button class="msg-act" type="button" aria-label="Bookmark" title="Save for later">
                <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
              </button>
              <button class="msg-act" type="button" aria-label="More actions" title="More actions">
                <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
              </button>
            </div>
          </div>
        </template>
      </div>

      <!-- Composer -->
      <footer class="drawer-foot">
        <div class="composer">
          <div class="composer-format">
            <button class="fmt-btn" type="button" title="Bold">B</button>
            <button class="fmt-btn italic" type="button" title="Italic">i</button>
            <button class="fmt-btn strike" type="button" title="Strikethrough">S</button>
            <span class="fmt-sep"></span>
            <button class="fmt-btn" type="button" title="Link" aria-label="Insert link">
              <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
            </button>
            <button class="fmt-btn" type="button" title="Bulleted list" aria-label="Bulleted list">
              <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M4 10.5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zm0-6c-.83 0-1.5.67-1.5 1.5S3.17 7.5 4 7.5 5.5 6.83 5.5 6 4.83 4.5 4 4.5zm0 12c-.83 0-1.5.68-1.5 1.5s.68 1.5 1.5 1.5 1.5-.68 1.5-1.5-.67-1.5-1.5-1.5zM7 19h14v-2H7v2zm0-6h14v-2H7v2zm0-8v2h14V5H7z"/></svg>
            </button>
            <button class="fmt-btn" type="button" title="Code" aria-label="Code">
              <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0L19.2 12l-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
            </button>
          </div>

          <div class="composer-body">
            <span class="composer-placeholder">{composerPlaceholder}</span>
          </div>

          <div class="composer-toolbar">
            <div class="composer-tools">
              <button class="tool-btn" type="button" title="Add attachment" aria-label="Add attachment">
                <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
              </button>
              <button class="tool-btn" type="button" title="Formatting" aria-label="Formatting">
                Aa
              </button>
              <button class="tool-btn" type="button" title="Emoji" aria-label="Add emoji">
                <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
              </button>
              <button class="tool-btn" type="button" title="Mention" aria-label="Mention someone">@</button>
              <button class="tool-btn" type="button" title="Record video" aria-label="Record video">
                <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
              </button>
              <button class="tool-btn" type="button" title="Record audio" aria-label="Record audio">
                <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
              </button>
              <button class="tool-btn" type="button" title="Slash commands" aria-label="Slash commands">/</button>
            </div>
            <button class="send-btn" type="button" aria-label="Send" title="Send">
              <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
          </div>
        </div>
      </footer>
    </section>
  </aside>
</template>
