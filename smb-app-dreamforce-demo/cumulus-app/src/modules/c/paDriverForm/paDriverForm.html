<template>
  <div class="pa-form">
    <header class="pa-form__head">
      <h2 class="pa-form__title">Your Drivers</h2>
      <p class="pa-form__subtitle">Add your drivers &amp; details here</p>
    </header>

    <template for:each={driverCards} for:item="d">
      <article class="pa-form__card" key={d.id}>
        <header class="pa-form__card-head">
          <span class="pa-form__card-icon" aria-hidden="true">
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <path
                fill="currentColor"
                d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.42 0-8 2.69-8 6v2h16v-2c0-3.31-3.58-6-8-6z"
              />
            </svg>
          </span>
          <h3 class="pa-form__card-title">Driver {d.index} Details</h3>
        </header>

        <div class="pa-form__grid">
          <div class="slds-form-element">
            <label class="slds-form-element__label" for={d.ids.firstName}>
              First Name <abbr class="slds-required" title="required">*</abbr>
            </label>
            <div class="slds-form-element__control">
              <input
                class="slds-input"
                id={d.ids.firstName}
                type="text"
                placeholder="Enter Value"
                value={d.firstName}
                data-id={d.id}
                data-key="firstName"
                oninput={handleFieldChange}
              />
            </div>
          </div>

          <div class="slds-form-element">
            <label class="slds-form-element__label" for={d.ids.lastName}>
              Last Name <abbr class="slds-required" title="required">*</abbr>
            </label>
            <div class="slds-form-element__control">
              <input
                class="slds-input"
                id={d.ids.lastName}
                type="text"
                placeholder="Enter Value"
                value={d.lastName}
                data-id={d.id}
                data-key="lastName"
                oninput={handleFieldChange}
              />
            </div>
          </div>

          <div class="slds-form-element">
            <label class="slds-form-element__label" for={d.ids.dob}>
              Date of Birth <abbr class="slds-required" title="required">*</abbr>
            </label>
            <div class="slds-form-element__control">
              <c-date-input
                input-id={d.ids.dob}
                value={d.dob}
                data-id={d.id}
                data-key="dob"
                placeholder="MM/DD/YYYY"
                accessible-label="Date of Birth"
                onchange={handleFieldChange}
              ></c-date-input>
            </div>
          </div>

          <div class="slds-form-element">
            <label class="slds-form-element__label">Gender</label>
            <div class="slds-form-element__control">
              <c-picklist
                options={d.genderOptions}
                value={d.gender}
                placeholder="Select An Option"
                accessible-label="Gender"
                data-id={d.id}
                data-key="gender"
                onchange={handlePicklistChange}
              ></c-picklist>
            </div>
          </div>

          <div class="slds-form-element">
            <label class="slds-form-element__label" for={d.ids.licenseNumber}>
              License Number <abbr class="slds-required" title="required">*</abbr>
            </label>
            <div class="slds-form-element__control">
              <input
                class="slds-input"
                id={d.ids.licenseNumber}
                type="text"
                placeholder="Enter Value"
                value={d.licenseNumber}
                data-id={d.id}
                data-key="licenseNumber"
                oninput={handleFieldChange}
              />
            </div>
          </div>

          <div class="slds-form-element">
            <label class="slds-form-element__label" for={d.ids.contact}>
              Contact
            </label>
            <div class="slds-form-element__control">
              <input
                class="slds-input"
                id={d.ids.contact}
                type="tel"
                placeholder="Enter Value"
                value={d.contact}
                data-id={d.id}
                data-key="contact"
                oninput={handleFieldChange}
              />
            </div>
          </div>

          <div class="slds-form-element">
            <label class="slds-form-element__label" for={d.ids.email}>
              Email ID <abbr class="slds-required" title="required">*</abbr>
            </label>
            <div class="slds-form-element__control">
              <input
                class="slds-input"
                id={d.ids.email}
                type="email"
                placeholder="Enter Value"
                value={d.email}
                data-id={d.id}
                data-key="email"
                oninput={handleFieldChange}
              />
            </div>
          </div>

          <div class="slds-form-element">
            <label class="slds-form-element__label">
              ZIP Code <abbr class="slds-required" title="required">*</abbr>
            </label>
            <div class="slds-form-element__control">
              <c-picklist
                options={d.zipOptions}
                value={d.zip}
                placeholder="Select An Option"
                accessible-label="ZIP Code"
                data-id={d.id}
                data-key="zip"
                onchange={handlePicklistChange}
              ></c-picklist>
            </div>
          </div>
        </div>
      </article>
    </template>

    <button class="pa-form__add" type="button" onclick={handleAdd}>
      <span class="pa-form__add-icon" aria-hidden="true">
        <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M30 29h16.5c.8 0 1.5-.7 1.5-1.5v-3c0-.8-.7-1.5-1.5-1.5H30c-.6 0-1-.4-1-1V5.5c0-.8-.7-1.5-1.5-1.5h-3c-.8 0-1.5.7-1.5 1.5V22c0 .6-.4 1-1 1H5.5c-.8 0-1.5.7-1.5 1.5v3c0 .8.7 1.5 1.5 1.5H22c.6 0 1 .4 1 1v16.5c0 .8.7 1.5 1.5 1.5h3c.8 0 1.5-.7 1.5-1.5V30c0-.6.4-1 1-1z"/></svg>
      </span>
      Add Driver
    </button>
  </div>
</template>
