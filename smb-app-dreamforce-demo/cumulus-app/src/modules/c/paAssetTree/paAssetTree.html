<template>
  <div class="pa-asset-tree">
    <!-- ═══════════════════════════════════════════════════════════════
         Root level: Policy-Level Coverages card.
         Rendered when the tree paints its hierarchical body (Step 2
         coverages always; Step 3 review only when at least one policy
         coverage was captured). Review mode iterates a filtered row
         set (`visiblePolicyCoverageRowsForReview`) and paints each
         row as plain-text `"min – max"` values - no picklists, no
         checkboxes, no faux-input chips. Coverages mode iterates the
         full row set (`policyCoverageRows`) with the original
         checkbox + range picklist controls.
         ═══════════════════════════════════════════════════════════════ -->
    <template lwc:if={showPolicyCard}>
      <article class="slds-card pa-asset-tree__policy">
        <header
          class="pa-asset-tree__policy-head pa-asset-tree__policy-head_clickable"
          role="button"
          tabindex="0"
          aria-expanded={policyAriaExpanded}
          onclick={togglePolicy}
          onkeydown={handlePolicyKeydown}
        >
          <span class="pa-asset-tree__chevron-btn" aria-hidden="true">
            <svg class={policyChevronClass} viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M17.9 4.4l20.7 20.5c.6.6.6 1.6 0 2.2L17.9 47.6c-.6.6-1.6.6-2.2 0l-2.2-2.2c-.6-.6-.6-1.6 0-2.2l16.3-16.1c.6-.6.6-1.6 0-2.2L13.6 8.8c-.6-.6-.6-1.6 0-2.2l2.2-2.2c.6-.5 1.5-.5 2.1 0z"/></svg>
          </span>
          <span class="pa-asset-tree__policy-icon" aria-hidden="true">
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <path fill="currentColor" d="M12 2L4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3zm0 10h7c-.5 4-3.4 7.6-7 8.6V12H5V6.5l7-2.6V12z"/>
            </svg>
          </span>
          <h3 class="pa-asset-tree__policy-title">Policy-Level Coverages</h3>
        </header>

        <template lwc:if={policyExpanded}>
        <div class="pa-asset-tree__cov-ranges">
          <!-- Review mode: iterate the pre-filtered visible row set
               so the DOM only contains coverages the broker actually
               captured (included AND with at least one complete
               range). Each row is a summary line: bold coverage
               name flush-left, plain-text "min – max" value(s) on
               the right. No checkboxes, no picklist-shaped chips. -->
          <template lwc:if={isReview}>
            <template for:each={visiblePolicyCoverageRowsForReview} for:item="cov">
              <div class="pa-asset-tree__cov-row_review" key={cov.key}>
                <span class="pa-asset-tree__cov-ro-label">{cov.label}</span>
                <div class="pa-asset-tree__cov-ro-values">
                  <template lwc:if={cov.hasLimitFilled}>
                    <div class="pa-asset-tree__cov-ro-group">
                      <span class="pa-asset-tree__cov-range-label">Limit</span>
                      <span class="pa-asset-tree__cov-ro-value">{cov.roLimitDisplay}</span>
                    </div>
                  </template>
                  <template lwc:if={cov.hasDedFilled}>
                    <div class="pa-asset-tree__cov-ro-group">
                      <span class="pa-asset-tree__cov-range-label">Deductible</span>
                      <span class="pa-asset-tree__cov-ro-value">{cov.roDedDisplay}</span>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </template>

          <!-- Coverages / edit mode: the original checkbox + range
               picklist controls stay intact so Step 2 keeps its
               full editing surface. -->
          <template lwc:else>
            <template for:each={policyCoverageRows} for:item="cov">
              <div class={cov.rowClass} key={cov.key}>
                <label class="pa-asset-tree__cov-include">
                  <input
                    type="checkbox"
                    data-key={cov.key}
                    checked={cov.included}
                    disabled={cov.mandatory}
                    onchange={handleCoverageInclude}
                  />
                  <span class="pa-asset-tree__cov-faux" aria-hidden="true"></span>
                  <span class="pa-asset-tree__cov-include-label">{cov.label}</span>
                </label>

                <div class="pa-asset-tree__cov-range-fields">
                  <!-- Field labels carry the SLDS required asterisk
                       whenever the coverage row itself is mandatory
                       (e.g. Bodily Injury), since a mandatory
                       coverage can't be submitted without a value.
                       Optional rows render the bare label. -->
                  <template lwc:if={cov.hasLimit}>
                    <div class="pa-asset-tree__cov-range-group">
                      <span class="pa-asset-tree__cov-range-label">
                        Limit
                        <template lwc:if={cov.mandatory}><abbr class="slds-required" title="required">*</abbr></template>
                      </span>
                      <c-picklist
                        options={cov.limitOptions}
                        value={cov.limit}
                        placeholder="Select..."
                        accessible-label="Limit"
                        disabled={cov.disabled}
                        required={cov.mandatory}
                        data-coverage={cov.key}
                        data-field="limit"
                        onchange={handleCoverageRange}
                      ></c-picklist>
                    </div>
                  </template>

                  <template lwc:if={cov.hasDed}>
                    <div class="pa-asset-tree__cov-range-group">
                      <span class="pa-asset-tree__cov-range-label">
                        Deductible
                        <template lwc:if={cov.mandatory}><abbr class="slds-required" title="required">*</abbr></template>
                      </span>
                      <c-picklist
                        options={cov.dedOptions}
                        value={cov.ded}
                        placeholder="Select..."
                        accessible-label="Deductible"
                        disabled={cov.disabled}
                        required={cov.mandatory}
                        data-coverage={cov.key}
                        data-field="ded"
                        onchange={handleCoverageRange}
                      ></c-picklist>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </template>
        </div>
        </template>
      </article>
    </template>

    <!-- ═══════════════════════════════════════════════════════════════
         Vehicle tree.
         ═══════════════════════════════════════════════════════════════ -->
    <template lwc:if={hasVehicles}>
      <ul class="pa-asset-tree__list" role="tree" aria-label="Schedule of Vehicles">
        <template for:each={tree} for:item="veh">
          <li class="pa-asset-tree__node" key={veh.key} role="treeitem" aria-expanded={veh.expanded}>
            <!-- Level 1: Vehicle (parent) -->
            <div class="pa-asset-tree__veh">
              <template lwc:if={isCoveragesOrReview}>
                <button
                  class="pa-asset-tree__chevron-btn"
                  type="button"
                  data-vehicle-id={veh.id}
                  onclick={toggleVehicle}
                  aria-label="Toggle vehicle details"
                  aria-expanded={veh.expanded}
                >
                  <svg class={veh.chevronClass} viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M17.9 4.4l20.7 20.5c.6.6.6 1.6 0 2.2L17.9 47.6c-.6.6-1.6.6-2.2 0l-2.2-2.2c-.6-.6-.6-1.6 0-2.2l16.3-16.1c.6-.6.6-1.6 0-2.2L13.6 8.8c-.6-.6-.6-1.6 0-2.2l2.2-2.2c.6-.5 1.5-.5 2.1 0z"/></svg>
                </button>
              </template>
              <template lwc:if={isRoster}>
                <span class="pa-asset-tree__veh-icon" aria-hidden="true">
                  <!-- Car glyph (windshield + body + two wheels). -->
                  <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                    <path fill="currentColor" d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.22.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.04 3H5.81L6.85 7zM7.5 16a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm9 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/>
                  </svg>
                </span>
              </template>
              <div
                class={vehBodyClass}
                data-vehicle-id={veh.id}
                onclick={toggleVehicle}
              >
                <div class="pa-asset-tree__veh-titlerow">
                  <span class="pa-asset-tree__veh-title">{veh.name}</span>
                  <button
                    class="pa-asset-tree__view-btn"
                    type="button"
                    data-vehicle-id={veh.id}
                    onclick={handleViewVehicle}
                    title="View vehicle details"
                    aria-label="View vehicle details"
                  >
                    <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><g ><path d="M51.8 25.1C47.1 15.6 37.3 9 26 9S4.9 15.6.2 25.1c-.3.6-.3 1.3 0 1.8C4.9 36.4 14.7 43 26 43s21.1-6.6 25.8-16.1c.3-.6.3-1.2 0-1.8zM26 37c-6.1 0-11-4.9-11-11s4.9-11 11-11 11 4.9 11 11-4.9 11-11 11z"/><path d="M26 19c-3.9 0-7 3.1-7 7s3.1 7 7 7 7-3.1 7-7-3.1-7-7-7z"/></g></svg>
                    <span class="slds-assistive-text">View vehicle details</span>
                  </button>
                </div>
                <div class="pa-asset-tree__veh-meta">{veh.meta}</div>
              </div>
              <template lwc:if={veh.isDraft}>
                <span class={veh.statusClass}>{veh.statusLabel}</span>
              </template>
              <span class="pa-asset-tree__driver-count">{veh.driverChipLabel}</span>
              <template lwc:if={isRoster}>
                <!-- Overflow row-action menu - replaces the standalone
                     trash + assign controls. Pinned to the right edge so
                     every row's menu forms a clean vertical line. -->
                <div class="pa-asset-tree__veh-menu" onclick={stopPropagation}>
                  <button
                    class="pa-asset-tree__menu-btn"
                    type="button"
                    data-vehicle-id={veh.id}
                    onclick={toggleVehicleMenu}
                    aria-haspopup="menu"
                    aria-expanded={veh.menuOpen}
                    title="Vehicle actions"
                  >
                    <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M20 44c0-3.3 2.7-6 6-6s6 2.7 6 6-2.7 6-6 6-6-2.7-6-6zm0-18c0-3.3 2.7-6 6-6s6 2.7 6 6-2.7 6-6 6-6-2.7-6-6zm0-18c0-3.3 2.7-6 6-6s6 2.7 6 6-2.7 6-6 6-6-2.7-6-6z"/></svg>
                    <span class="slds-assistive-text">Vehicle actions</span>
                  </button>

                  <template lwc:if={veh.menuOpen}>
                    <ul class="pa-asset-tree__menu" role="menu">
                      <li
                        class="pa-asset-tree__menu-item"
                        role="menuitem"
                        tabindex="0"
                        data-vehicle-id={veh.id}
                        data-action="add_new_driver"
                        onclick={handleVehicleRowAction}
                        onkeydown={handleVehicleRowKeydown}
                      >
                        Add New Driver
                      </li>
                      <li
                        class="pa-asset-tree__menu-item"
                        role="menuitem"
                        tabindex="0"
                        data-vehicle-id={veh.id}
                        data-action="edit_vehicle"
                        onclick={handleVehicleRowAction}
                        onkeydown={handleVehicleRowKeydown}
                      >
                        Edit Vehicle
                      </li>
                      <li
                        class="pa-asset-tree__menu-item"
                        role="menuitem"
                        tabindex="0"
                        data-vehicle-id={veh.id}
                        data-action="delete_vehicle"
                        onclick={handleVehicleRowAction}
                        onkeydown={handleVehicleRowKeydown}
                      >
                        Delete Vehicle
                      </li>
                    </ul>
                  </template>

                </div>
              </template>
            </div>

            <!-- ═══ COVERAGES MODE: 3-level nested body ═══ -->
            <template lwc:if={veh.showBody}>
              <div class="pa-asset-tree__body">
                <!-- Level 2a: Vehicle Coverages - one row per coverage
                     with include checkbox + per-coverage value select.
                     Disabled state on the select tracks the checkbox so
                     the broker can only edit attributes for coverages
                     they've opted in to (mirrors Policy-Level Coverages).
                     Review mode drops the entire section when the
                     vehicle has zero captured coverages so the
                     summary card stays free of empty pills. -->
                <template lwc:if={veh.showVehicleCoveragesSection}>
                <section class="pa-asset-tree__subsection pa-asset-tree__subsection_vehicle">
                  <header class="pa-asset-tree__subhead">
                    <span class="pa-asset-tree__badge pa-asset-tree__badge_coverage">Vehicle Coverages</span>
                  </header>
                  <div class="pa-asset-tree__cov-rows">
                    <!-- Review mode: iterate the pre-filtered list so
                         only rows that were checked AND valued paint.
                         Each row is a summary line: bold coverage
                         name on the left, plain-text value on the
                         right - no checkbox, no picklist-shaped chip. -->
                    <template lwc:if={isReview}>
                      <template for:each={veh.visibleVehicleCoverageRowsForReview} for:item="row">
                        <div class="pa-asset-tree__cov-row_review" key={row.key}>
                          <span class="pa-asset-tree__cov-ro-label">{row.label}</span>
                          <div class="pa-asset-tree__cov-ro-group">
                            <span class="pa-asset-tree__cov-range-label">{row.valueLabel}</span>
                            <span class="pa-asset-tree__cov-ro-value">{row.roValueDisplay}</span>
                          </div>
                        </div>
                      </template>
                    </template>

                    <template lwc:else>
                      <template for:each={veh.vehicleCoverageRows} for:item="row">
                        <div class={row.rowClass} key={row.key}>
                          <label class="pa-asset-tree__cov-include">
                            <input
                              type="checkbox"
                              data-vehicle-id={veh.id}
                              data-key={row.includedKey}
                              checked={row.included}
                              disabled={row.mandatory}
                              onchange={handleVehicleCovInclude}
                            />
                            <span class="pa-asset-tree__cov-faux" aria-hidden="true"></span>
                            <span class="pa-asset-tree__cov-include-label">{row.label}</span>
                          </label>
                          <div class="pa-asset-tree__cov-row-value">
                            <span class="pa-asset-tree__cov-range-label">
                              {row.valueLabel}
                              <template lwc:if={row.mandatory}><abbr class="slds-required" title="required">*</abbr></template>
                            </span>
                            <c-picklist
                              options={row.options}
                              value={row.value}
                              placeholder="Select..."
                              accessible-label={row.valueLabel}
                              disabled={row.disabled}
                              required={row.mandatory}
                              data-vehicle-id={veh.id}
                              data-key={row.valueKey}
                              onchange={handleVehicleCovChange}
                            ></c-picklist>
                          </div>
                        </div>
                      </template>
                    </template>
                  </div>
                </section>
                </template>

                <!-- Level 2b: Assigned Drivers -->
                <section class="pa-asset-tree__subsection pa-asset-tree__subsection_drivers">
                  <header class="pa-asset-tree__subhead">
                    <span class="pa-asset-tree__badge pa-asset-tree__badge_driver">Assigned Drivers</span>
                  </header>

                  <ul class="pa-asset-tree__drivers" role="group">
                    <template for:each={veh.drivers} for:item="d">
                      <li class="pa-asset-tree__driver-node" key={d.key}>
                        <div class="pa-asset-tree__driver" role="treeitem" aria-expanded={d.expanded}>
                          <button
                            class="pa-asset-tree__chevron-btn"
                            type="button"
                            data-driver-key={d.key}
                            onclick={toggleDriver}
                            aria-label="Toggle driver coverages"
                            aria-expanded={d.expanded}
                          >
                            <svg class={d.chevronClass} viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M17.9 4.4l20.7 20.5c.6.6.6 1.6 0 2.2L17.9 47.6c-.6.6-1.6.6-2.2 0l-2.2-2.2c-.6-.6-.6-1.6 0-2.2l16.3-16.1c.6-.6.6-1.6 0-2.2L13.6 8.8c-.6-.6-.6-1.6 0-2.2l2.2-2.2c.6-.5 1.5-.5 2.1 0z"/></svg>
                          </button>
                          <span class="pa-asset-tree__avatar" aria-hidden="true">
                            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                          </span>
                          <div class="pa-asset-tree__driver-body">
                            <div class="pa-asset-tree__driver-namerow">
                              <span class="pa-asset-tree__driver-name">{d.name}</span>
                              <button
                                class="pa-asset-tree__view-btn pa-asset-tree__view-btn_sm"
                                type="button"
                                data-driver-id={d.id}
                                onclick={handleViewDriver}
                                title="View driver details"
                                aria-label="View driver details"
                              >
                                <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><g ><path d="M51.8 25.1C47.1 15.6 37.3 9 26 9S4.9 15.6.2 25.1c-.3.6-.3 1.3 0 1.8C4.9 36.4 14.7 43 26 43s21.1-6.6 25.8-16.1c.3-.6.3-1.2 0-1.8zM26 37c-6.1 0-11-4.9-11-11s4.9-11 11-11 11 4.9 11 11-4.9 11-11 11z"/><path d="M26 19c-3.9 0-7 3.1-7 7s3.1 7 7 7 7-3.1 7-7-3.1-7-7-7z"/></g></svg>
                                <span class="slds-assistive-text">View driver details</span>
                              </button>
                            </div>
                            <div class="pa-asset-tree__driver-meta">DL {d.dl}</div>
                          </div>
                          <template lwc:if={isCoveragesOrReview}>
                            <span class="pa-asset-tree__driver-count">{d.coverageChipLabel}</span>
                          </template>
                        </div>

                        <!-- Level 3: Driver Coverages - same
                             row-per-coverage layout (checkbox + value
                             select) as the Vehicle Coverages above.
                             In review mode `d.showCoverage` also
                             requires at least one captured driver
                             coverage, so drivers with none of their
                             own coverages skip the pill + list. -->
                        <template lwc:if={d.showCoverage}>
                          <div class="pa-asset-tree__driver-cov">
                            <header class="pa-asset-tree__subhead">
                              <span class="pa-asset-tree__badge pa-asset-tree__badge_coverage">Driver Coverages</span>
                            </header>
                            <div class="pa-asset-tree__cov-rows">
                              <!-- Review mode: iterate the pre-filtered
                                   list so only checked-AND-valued rows
                                   paint as summary lines. -->
                              <template lwc:if={isReview}>
                                <template for:each={d.visibleDriverCoverageRowsForReview} for:item="row">
                                  <div class="pa-asset-tree__cov-row_review" key={row.key}>
                                    <span class="pa-asset-tree__cov-ro-label">{row.label}</span>
                                    <div class="pa-asset-tree__cov-ro-group">
                                      <span class="pa-asset-tree__cov-range-label">{row.valueLabel}</span>
                                      <span class="pa-asset-tree__cov-ro-value">{row.roValueDisplay}</span>
                                    </div>
                                  </div>
                                </template>
                              </template>

                              <template lwc:else>
                                <template for:each={d.coverageRows} for:item="row">
                                  <div class={row.rowClass} key={row.key}>
                                    <label class="pa-asset-tree__cov-include">
                                      <input
                                        type="checkbox"
                                        data-vehicle-id={veh.id}
                                        data-driver-id={d.id}
                                        data-key={row.includedKey}
                                        checked={row.included}
                                        disabled={row.mandatory}
                                        onchange={handleDriverCovInclude}
                                      />
                                      <span class="pa-asset-tree__cov-faux" aria-hidden="true"></span>
                                      <span class="pa-asset-tree__cov-include-label">{row.label}</span>
                                    </label>
                                    <div class="pa-asset-tree__cov-row-value">
                                      <span class="pa-asset-tree__cov-range-label">
                                        {row.valueLabel}
                                        <template lwc:if={row.mandatory}><abbr class="slds-required" title="required">*</abbr></template>
                                      </span>
                                      <c-picklist
                                        options={row.options}
                                        value={row.value}
                                        placeholder="Select..."
                                        accessible-label={row.valueLabel}
                                        disabled={row.disabled}
                                        required={row.mandatory}
                                        data-vehicle-id={veh.id}
                                        data-driver-id={d.id}
                                        data-key={row.valueKey}
                                        onchange={handleDriverSelect}
                                      ></c-picklist>
                                    </div>
                                  </div>
                                </template>
                              </template>
                            </div>
                          </div>
                        </template>
                      </li>
                    </template>
                  </ul>

                  <!-- Coverages mode is edit-only: assigning / adding drivers
                       happens back in the Vehicles & Drivers step. -->
                  <template lwc:if={veh.hasDrivers}></template>
                  <template lwc:else>
                    <p class="pa-asset-tree__cov-empty">
                      No drivers assigned. Add or assign drivers in the
                      <strong>Vehicles &amp; Drivers</strong> step.
                    </p>
                  </template>
                </section>
              </div>
            </template>

            <!-- ═══ ROSTER MODE: driver chips + assign ═══
                 Only roster (Step 1) renders the flat driver-chip
                 strip with the remove-driver X. Coverages AND review
                 both paint the drivers under the hierarchical body
                 above via the Level 2b section, so this branch stays
                 suppressed for those modes. -->
            <template lwc:if={isRoster}>
              <template lwc:if={veh.hasDrivers}>
                <ul class="pa-asset-tree__drivers" role="group">
                  <template for:each={veh.drivers} for:item="d">
                    <li class="pa-asset-tree__driver" key={d.key} role="treeitem">
                      <span class="pa-asset-tree__avatar" aria-hidden="true">
                        <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                      </span>
                      <div class="pa-asset-tree__driver-body">
                        <div class="pa-asset-tree__driver-namerow">
                          <span class="pa-asset-tree__driver-name">{d.name}</span>
                          <button
                            class="pa-asset-tree__view-btn pa-asset-tree__view-btn_sm"
                            type="button"
                            data-driver-id={d.id}
                            onclick={handleViewDriver}
                            title="View driver details"
                            aria-label="View driver details"
                          >
                            <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><g ><path d="M51.8 25.1C47.1 15.6 37.3 9 26 9S4.9 15.6.2 25.1c-.3.6-.3 1.3 0 1.8C4.9 36.4 14.7 43 26 43s21.1-6.6 25.8-16.1c.3-.6.3-1.2 0-1.8zM26 37c-6.1 0-11-4.9-11-11s4.9-11 11-11 11 4.9 11 11-4.9 11-11 11z"/><path d="M26 19c-3.9 0-7 3.1-7 7s3.1 7 7 7 7-3.1 7-7-3.1-7-7-7z"/></g></svg>
                            <span class="slds-assistive-text">View driver details</span>
                          </button>
                        </div>
                        <div class="pa-asset-tree__driver-meta">DL {d.dl}</div>
                      </div>
                      <button
                        class="pa-asset-tree__driver-remove"
                        type="button"
                        data-vehicle-id={veh.id}
                        data-driver-id={d.id}
                        onclick={handleRemoveDriverClick}
                        title="Remove driver"
                      >
