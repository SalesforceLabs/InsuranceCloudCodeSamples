<template>
  <template lwc:if={open}>
    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      aria-labelledby="add-asset-modal-heading"
      class="slds-modal slds-fade-in-open slds-modal_small"
      onclick={handleBackdrop}
    >
      <div class="slds-modal__container" onclick={stopPropagation}>
        <header class="slds-modal__header">
          <button
            class="slds-button slds-button_icon slds-modal__close"
            type="button"
            title="Close"
            aria-label="Close this window"
            onclick={handleCancel}
          >
            <svg stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path d="M31 25.4l13-13.1c.6-.6.6-1.5 0-2.1l-2-2.1c-.6-.6-1.5-.6-2.1 0L26.8 21.2c-.4.4-1 .4-1.4 0L12.3 8c-.6-.6-1.5-.6-2.1 0l-2.1 2.1c-.6.6-.6 1.5 0 2.1l13.1 13.1c.4.4.4 1 0 1.4L8 39.9c-.6.6-.6 1.5 0 2.1l2.1 2.1c.6.6 1.5.6 2.1 0L25.3 31c.4-.4 1-.4 1.4 0l13.1 13.1c.6.6 1.5.6 2.1 0L44 42c.6-.6.6-1.5 0-2.1L31 26.8c-.4-.4-.4-1 0-1.4z"/></svg>
          </button>
          <h1 id="add-asset-modal-heading" class="slds-modal__title">{modalTitle}</h1>
        </header>

        <div class="slds-modal__content">
          <!-- Step 1: picker cards - shown when the root has 2+ child
               kinds. Auto-skipped by the setter when only one option
               is available. -->
          <template lwc:if={isStep1}>
            <p class="add-asset-modal__hint">
              What would you like to add to this RFQ?
            </p>
            <div class="add-asset-modal__picker">
              <template for:each={pickerCards} for:item="card">
                <button
                  key={card.id}
                  type="button"
                  class="add-asset-modal__card"
                  data-id={card.id}
                  onclick={handlePickerSelect}
                >
                  <span class="add-asset-modal__card-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" focusable="false">
                      <path fill="currentColor" d={card.iconPath}></path>
                    </svg>
                  </span>
                  <span class="add-asset-modal__card-body">
                    <span class="add-asset-modal__card-title">{card.label}</span>
                    <span class="add-asset-modal__card-desc">{card.description}</span>
                  </span>
                  <span class="add-asset-modal__card-chev" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                      <polyline points="9 6 15 12 9 18"></polyline>
                    </svg>
                  </span>
                </button>
              </template>
            </div>
          </template>

          <!-- Step 2: form fields for the picked kind. -->
          <template lwc:if={isVehicleStep}>
            <c-pa-vehicle-form-fields
              available-vehicles={availableVehicles}
            ></c-pa-vehicle-form-fields>
          </template>
          <template lwc:if={isDriverStep}>
            <c-pa-driver-form-fields
              available-drivers={availableDrivers}
            ></c-pa-driver-form-fields>
          </template>
        </div>

        <footer class="slds-modal__footer">
          <template lwc:if={isStep1}>
            <button class="slds-button slds-button_neutral" type="button" onclick={handleCancel}>
              Cancel
            </button>
          </template>
          <template lwc:if={isStep2}>
            <template lwc:if={canGoBack}>
              <button class="slds-button slds-button_neutral" type="button" onclick={handleBack}>
                Back
              </button>
            </template>
            <template lwc:else>
              <button class="slds-button slds-button_neutral" type="button" onclick={handleCancel}>
                Cancel
              </button>
            </template>
            <button class="slds-button slds-button_brand" type="button" onclick={handleSave}>
              {saveLabel}
            </button>
          </template>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
