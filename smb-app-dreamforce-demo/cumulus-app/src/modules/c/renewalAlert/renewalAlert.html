<template>
  <article class="alert">
    <div class="accent" aria-hidden="true"></div>

    <div class="body">
      <header class="alert-head">
        <div class="alert-headline">
          <span class="alert-eyebrow">
            <span class="warn-dot" aria-hidden="true"></span>
            {alert.type}
          </span>
          <h3 class="account">
            <a
              class="account-link"
              href="#account"
              title="Open account record"
              onclick={handleAccountOpen}
            >{alert.accountName}</a>
          </h3>
        </div>
        <div class="alert-chips">
          <span class="chip days">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/>
            </svg>
            {alert.daysToExpiration} days
          </span>
          <span class="chip">{alert.policyType}</span>
        </div>
      </header>

      <!-- Structured risk flags - the decision-critical "why" moved up
           from L3 so the broker can act direct-to-quote. Reuses the
           existing .chip pattern (see .chip.days) with a risk variant. -->
      <template lwc:if={hasRiskFlags}>
        <div class="alert-chips alert-risk-flags" role="list" aria-label="Risk factors">
          <template for:each={riskFlags} for:item="flag">
            <span key={flag.key} class="chip chip--risk" role="listitem">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path fill="currentColor" d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
              </svg>
              {flag.label}
            </span>
          </template>
        </div>
      </template>

      <dl class="facts">
        <div class="fact">
          <dt>Annual Premium</dt>
          <dd class="fact-strong">{alert.premium}</dd>
        </div>
        <template lwc:if={hasPremiumDelta}>
          <div class="fact">
            <dt>Renewal Premium</dt>
            <dd class="fact-strong">
              {renewalPremiumFmt}
              <span class="fact-delta">{premiumIncreaseLabel}</span>
            </dd>
          </div>
        </template>
        <div class="fact">
          <dt>Prior Policy</dt>
          <dd>{alert.priorPolicy}</dd>
        </div>
        <div class="fact">
          <dt>Suggested Application</dt>
          <dd>{alert.applicationName}</dd>
        </div>
      </dl>
    </div>

    <footer class="alert-foot">
      <c-ai-chip tooltip="Agentforce pulled this account's most recent Commercial Auto policy and pre-filled the renewal application.">
        Pre-loaded by Agentforce
      </c-ai-chip>
      <div class="alert-actions">
        <button class="primary" onclick={handleStart} type="button">
          Start Renewal RFQ
          <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M17.9 4.4l20.7 20.5c.6.6.6 1.6 0 2.2L17.9 47.6c-.6.6-1.6.6-2.2 0l-2.2-2.2c-.6-.6-.6-1.6 0-2.2l16.3-16.1c.6-.6.6-1.6 0-2.2L13.6 8.8c-.6-.6-.6-1.6 0-2.2l2.2-2.2c.6-.5 1.5-.5 2.1 0z"/></svg>
        </button>
      </div>
    </footer>
  </article>
</template>
