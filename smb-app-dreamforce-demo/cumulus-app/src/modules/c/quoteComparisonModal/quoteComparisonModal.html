<template>
  <template lwc:if={open}>
    <div
      class="slds-backdrop slds-backdrop_open"
      onclick={handleBackdrop}
      aria-hidden="true"
    ></div>

    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      aria-labelledby="quote-modal-title"
      class={modalClass}
      onclick={handleBackdrop}
      onkeydown={handleModalKeydown}
    >
      <div class="slds-modal__container" onclick={handlePanelClick}>
        <!-- Header -->
        <header class="slds-modal__header">
          <button
            class="slds-button slds-button_icon slds-modal__close"
            type="button"
            onclick={handleClose}
            aria-label="Close"
          >
            <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M31 25.4l13-13.1c.6-.6.6-1.5 0-2.1l-2-2.1c-.6-.6-1.5-.6-2.1 0L26.8 21.2c-.4.4-1 .4-1.4 0L12.3 8c-.6-.6-1.5-.6-2.1 0l-2.1 2.1c-.6.6-.6 1.5 0 2.1l13.1 13.1c.4.4.4 1 0 1.4L8 39.9c-.6.6-.6 1.5 0 2.1l2.1 2.1c.6.6 1.5.6 2.1 0L25.3 31c.4-.4 1-.4 1.4 0l13.1 13.1c.6.6 1.5.6 2.1 0L44 42c.6-.6.6-1.5 0-2.1L31 26.8c-.4-.4-.4-1 0-1.4z"/></svg>
          </button>
          <h2
            id="quote-modal-title"
            class="slds-modal__title slds-text-heading_medium"
          >
            {modalTitle}
          </h2>
        </header>

        <!-- Body -->
        <div class={contentClass}>
          <template lwc:if={isGridView}>
            <!-- Selection bar - Select all across every compared column,
                 with a live count of what will go into the proposal. -->
            <div class="qm-select-bar">
              <span class="qm-select-all">
                <input
                  id="qm-select-all"
                  class="qm-select-all__input"
                  type="checkbox"
                  checked={isAllPicked}
                  onchange={handleToggleSelectAll}
                />
                <label class="qm-select-all__label" for="qm-select-all">
                  Select all quotes
                </label>
              </span>
              <span class="qm-select-bar__count">{selectionSummary}</span>
            </div>

            <div class="slds-grid qm-grid">
              <!-- Comparison grid - the agent recommendation lives in
                   the table's sticky-left corner cell (with the
                   "Ask an Agent" trigger). This column shrinks to ~2/3
                   width when the docked chat panel is open. -->
              <div class={gridColClass}>
                <c-quote-compare-table
                  quote-ids={gridQuoteIds}
                  flow={effectiveFlow}
                  compare-layout={compareLayout}
                  picked-ids={pickedQuoteIds}
                  onquotetoggle={handleQuoteToggle}
                  onaskagent={handleAskAgentforce}
                ></c-quote-compare-table>
              </div>

              <!-- Docked right insurance-agent chat panel - header /
                   scrollable body / sticky footer. -->
              <template lwc:if={isAgentforceOpen}>
                <aside
                  class="qm-chat slds-panel slds-panel_docked slds-panel_docked-right slds-is-open"
                  role="dialog"
                  aria-label="Insurance Agent chat"
                >
                  <header class="qm-chat__head">
                    <img
                      class="qm-chat__head-icon"
                      src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAYCAYAAADgdz34AAACMUlEQVR4AbSUi3HbMBBEj1RqSSZVJO5AHZHsSB1YriIT12IT3nfC3QCUKH9mrMEKh73PHgCSo33z70pgPP6ffxz//f2s7l5eJ1ALT6uNjySECDyAA9gg/MPx+VG252nuRifQecwmigkFQSD/BLABhR1WcsetsGKtE3g5/T6LXIQYFAz7ah5UGDSOpdZIqhNI9otGseHPNrUT0HHMCrjbtfy7g91wZG1ACnykuDo8g7bA1kak1nJXCmj1buckC0/r6deg+PautOxG1nKB7c1H6E63niwRjjNEYo5Ui124wKsdPCm8Ubicfj6Mtj6wBuGPhqpI0J2I4v3CXUDbzueY6IO9EgyMxw4hoIIDgCMOjGpAOItnR1AdXKBlpHymAAl0GmhjsIMnFsAJ3pRmi6ZdgKKQQI4nZs5w1ScjoHUBPIbMLY8YObfgArccO1x22Pol5kdcmhdNNl+Fy6ciuq5JfuGca13nBHe43E9yGKOtXkx1XAjuUON8B5w3ZEBHMNdzpWPHqMuEA4pzjjl4crTOUeMuO6gsSdU0/5IiHIgEAoJjhq/Ffef4hazlOxBhBMe5sRYmLvTeBSomXqiuOLXwgRRgwbOuOdU501VPEkIAMboFrDUXxWfxYsPV+9AJKNh3ojlFZPszPejbv0pMawpOrGW3Y6kNtlx3B+lgi1yeiKWoK833xqJ43vCPvclRictT4kxXiAH52NmCLR9Fwc3CivVxdUTObv4QAyo6A+xNyO7yDQAA//8TB3zoAAAABklEQVQDAL8VQEBvO1qsAAAAAElFTkSuQmCC"
                      alt=""
                      aria-hidden="true"
                    />
                    <h3 class="qm-chat__head-title">Insurance Agent</h3>
                    <span class="qm-chat__head-info" aria-hidden="true" title="About this assistant">
                      <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                    </span>
                    <button
                      class="qm-chat__close"
                      type="button"
                      onclick={handleCloseAgentforce}
                      aria-label="Close insurance agent panel"
                      title="Close"
                    >
                      <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M31 25.4l13-13.1c.6-.6.6-1.5 0-2.1l-2-2.1c-.6-.6-1.5-.6-2.1 0L26.8 21.2c-.4.4-1 .4-1.4 0L12.3 8c-.6-.6-1.5-.6-2.1 0l-2.1 2.1c-.6.6-.6 1.5 0 2.1l13.1 13.1c.4.4.4 1 0 1.4L8 39.9c-.6.6-.6 1.5 0 2.1l2.1 2.1c.6.6 1.5.6 2.1 0L25.3 31c.4-.4 1-.4 1.4 0l13.1 13.1c.6.6 1.5.6 2.1 0L44 42c.6-.6.6-1.5 0-2.1L31 26.8c-.4-.4-.4-1 0-1.4z"/></svg>
                    </button>
                  </header>

                  <div class="qm-chat__body slds-scrollable_y" role="log" aria-live="polite">
                    <template for:each={chatBubbles} for:item="m">
                      <div class={m.rowClass} key={m.id}>
                        <div class="qm-chat__msg">
                          <div class={m.bubbleClass}>
                            <template lwc:if={m.isRich}>
                              <p class="qm-chat__rich-intro">{m.intro}</p>
                              <ul class="qm-chat__rich-list">
                                <template for:each={m.items} for:item="it">
                                  <li class="qm-chat__rich-item" key={it.id}>
                                    <span class="qm-chat__rich-label">Quote:</span>
                                    <a class="qm-chat__rich-link" href="#quote">{it.quote}</a>
                                    <br/>
                                    <span class="qm-chat__rich-label">{m.metricLabel}:</span>
                                    <strong>{it.value}</strong>
                                  </li>
                                </template>
                              </ul>
                              <p class="qm-chat__rich-outro">{m.outro}</p>
                            </template>
                            <template lwc:else>
                              <p>{m.text}</p>
                            </template>
                          </div>
                          <span class="qm-chat__time">{m.time}</span>
                        </div>
                      </div>
                    </template>

                    <!-- Typing indicator - three pulsing dots inside an
                         agent-styled bubble while a reply composes. -->
                    <template lwc:if={agentTyping}>
                      <div class="qm-chat__row qm-chat__row_agent qm-chat__row_typing" aria-live="polite">
                        <div class="qm-chat__msg">
                          <div class="qm-chat__bubble qm-chat__bubble_agent qm-chat__typing">
                            <span class="qm-chat__typing-dot"></span>
                            <span class="qm-chat__typing-dot"></span>
                            <span class="qm-chat__typing-dot"></span>
                          </div>
                        </div>
                      </div>
                    </template>
                  </div>

                  <footer class="qm-chat__foot">
                    <input
                      class="qm-chat__input"
                      type="text"
                      placeholder="Ask about these quotes..."
                      value={chatInput}
                      oninput={handleChatInput}
                      onkeydown={handleChatKeydown}
                      aria-label="Message insurance agent"
                    />
                    <button
                      class="qm-chat__send"
                      type="button"
                      onclick={handleSendChat}
                      disabled={isSendDisabled}
                      aria-label="Send message"
                      title="Send"
                    >
                      <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M2.1 44.5l4.4-16.3h18.6c.5 0 1-.5 1-1v-2c0-.5-.5-1-1-1H6.5l-4.3-16C2.1 8 2 7.7 2 7.4c0-.7.7-1.4 1.5-1.3.2 0 .3.1.5.1l45 18.5c.6.2 1 .8 1 1.4s-.4 1.1-.9 1.3L4 46.4c-.2.1-.4.1-.6.1-.8-.1-1.4-.7-1.4-1.5 0-.2 0-.3.1-.5z"/></svg>
                    </button>
                  </footer>
                </aside>
              </template>
            </div>
          </template>

          <!-- Compose only. Sending closes this modal and confirms with a
               toast from the shell, so there is no success state here:
               the send is the broker's own action, and a dialog left
               open on a confirmation has nothing to act on. -->
          <template lwc:if={isEmailView}>
            <div class="qm-email">
            <div class="qm-email-card">
                <!-- The carriers are named in the message body and
                     compared in full in the attached PDF, so the
                     compose view no longer restates them as a card
                     list above the fields. -->
                <div class="qm-email-field">
                  <label class="qm-email-label" for="qm-to">To</label>
                  <div class="qm-email-recipient">
                    <span class="qm-email-recipient-name">{emailView.recipientName}</span>
                    <span class="qm-email-recipient-email">&lt;{emailView.recipientEmail}&gt;</span>
                  </div>
                </div>

                <div class="qm-email-field">
                  <label class="qm-email-label" for="qm-subject">Subject</label>
                  <input id="qm-subject" class="qm-email-input" type="text" value={emailView.subject} />
                </div>

                <div class="qm-email-field">
                  <label class="qm-email-label" for="qm-body">Message</label>
                  <textarea id="qm-body" class="qm-email-textarea" rows="9">{emailView.body}</textarea>
                </div>

                <div class="qm-email-attach">
                  <span class="qm-email-attach-icon" aria-hidden="true">
                    <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5S13.5 3.62 13.5 5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
                  </span>
                  <span class="qm-email-attach-name">{emailView.attachmentName}</span>
                  <button
                    class="slds-button slds-button_icon qm-email-attach-view"
                    type="button"
                    title="View attachment"
                    aria-label="View attachment"
                    aria-expanded={pdfPreviewAriaExpanded}
                    onclick={handleOpenPdfPreview}
                  >
                    <svg class="slds-button__icon" viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><g><path d="M51.8 25.1C47.1 15.6 37.3 9 26 9S4.9 15.6.2 25.1c-.3.6-.3 1.3 0 1.8C4.9 36.4 14.7 43 26 43s21.1-6.6 25.8-16.1c.3-.6.3-1.2 0-1.8zM26 37c-6.1 0-11-4.9-11-11s4.9-11 11-11 11 4.9 11 11-4.9 11-11 11z"/><path d="M26 19c-3.9 0-7 3.1-7 7s3.1 7 7 7 7-3.1 7-7-3.1-7-7-7z"/></g></svg>
                    <span class="slds-assistive-text">View attachment</span>
                  </button>
                </div>
              </div>

              <footer class="qm-email-actions">
                <button class="qm-btn-neutral" type="button" onclick={handleBackToCompare}>
                  Back to Comparison
                </button>
                <button class="qm-btn-brand" type="button" onclick={handleSendEmail}>
                  <span class="qm-btn-icon" aria-hidden="true">
                    <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M2.1 44.5l4.4-16.3h18.6c.5 0 1-.5 1-1v-2c0-.5-.5-1-1-1H6.5l-4.3-16C2.1 8 2 7.7 2 7.4c0-.7.7-1.4 1.5-1.3.2 0 .3.1.5.1l45 18.5c.6.2 1 .8 1 1.4s-.4 1.1-.9 1.3L4 46.4c-.2.1-.4.1-.6.1-.8-.1-1.4-.7-1.4-1.5 0-.2 0-.3.1-.5z"/></svg>
                  </span>
                  Email to Client
                </button>
              </footer>
            </div>
          </template>
        </div>

        <!-- Grid-view footer - lives on the comparison panel itself so the
             broker never leaves the matrix to send the shortlist. -->
        <template lwc:if={isGridView}>
          <footer class="slds-modal__footer qm-grid-foot">
            <span class="qm-grid-foot__count">{selectionSummary}</span>
            <div class="qm-grid-foot__actions">
              <button class="qm-btn-neutral" type="button" onclick={handleClose}>
                Cancel
              </button>
              <button
                class="qm-btn-brand"
                type="button"
                onclick={handleEmailToClient}
                disabled={nothingPicked}
              >
                <span class="qm-btn-icon" aria-hidden="true">
                  <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M2.1 44.5l4.4-16.3h18.6c.5 0 1-.5 1-1v-2c0-.5-.5-1-1-1H6.5l-4.3-16C2.1 8 2 7.7 2 7.4c0-.7.7-1.4 1.5-1.3.2 0 .3.1.5.1l45 18.5c.6.2 1 .8 1 1.4s-.4 1.1-.9 1.3L4 46.4c-.2.1-.4.1-.6.1-.8-.1-1.4-.7-1.4-1.5 0-.2 0-.3.1-.5z"/></svg>
                </span>
                Email to Client
              </button>
            </div>
          </footer>
        </template>
      </div>
    </section>

    <!-- Attachment preview, stacked over the comparison modal.
         SLDS prefers one dialog at a time, and this is the deliberate
         exception: the preview is a peek at the file the compose view
         is about to send, so the broker has to be able to read it
         without losing the half-written email underneath. It gets its
         own backdrop and Escape handling and sits one z-layer up. -->
    <template lwc:if={pdfPreviewOpen}>
      <div
        class="slds-backdrop slds-backdrop_open qm-pdf-backdrop"
        aria-hidden="true"
      ></div>
      <section
        role="dialog"
        tabindex="-1"
        aria-modal="true"
        aria-labelledby="qm-pdf-title"
        class="slds-modal slds-fade-in-open qm-pdf-modal"
        data-pdf-dialog
        onclick={handleClosePdfPreview}
        onkeydown={handlePdfKeydown}
      >
        <div class="qm-pdf" onclick={handlePanelClick}>
          <!-- Document-viewer chrome. This stands in for
               Acrobat / the browser's built-in PDF viewer, so
               the toolbar is a dark strip and the content is a
               white page floating on grey rather than app
               furniture. Everything in the toolbar except
               Close is presentational - a real viewer's zoom
               and download would be the host app's, not
               ours - so those sit in an aria-hidden span. -->
          <header class="qm-pdf__toolbar">
            <span class="qm-pdf__toolbar-file">
              <span class="qm-pdf__badge" aria-hidden="true">PDF</span>
              <span id="qm-pdf-title" class="qm-pdf__toolbar-name">{pdfPreviewTitle}</span>
            </span>
            <span class="qm-pdf__toolbar-tools">
              <span class="qm-pdf__toolbar-meta" aria-hidden="true">1 / 1</span>
              <span class="qm-pdf__toolbar-glyphs" aria-hidden="true">
                <span class="qm-pdf__toolbar-glyph">&minus;</span>
                <span class="qm-pdf__toolbar-zoom">100%</span>
                <span class="qm-pdf__toolbar-glyph">+</span>
                <span class="qm-pdf__toolbar-glyph qm-pdf__toolbar-glyph_svg">
                  <svg viewBox="0 0 24 24" fill="currentColor" focusable="false"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                </span>
              </span>
              <button
                class="slds-button slds-button_icon qm-pdf__close"
                type="button"
                title="Close preview"
                aria-label="Close preview"
                onclick={handleClosePdfPreview}
              >
                <svg class="slds-button__icon" viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path d="M31 25.4l13-13.1c.6-.6.6-1.5 0-2.1l-2-2.1c-.6-.6-1.5-.6-2.1 0L26.8 21.2c-.4.4-1 .4-1.4 0L12.3 8c-.6-.6-1.5-.6-2.1 0l-2.1 2.1c-.6.6-.6 1.5 0 2.1l13.1 13.1c.4.4.4 1 0 1.4L8 39.9c-.6.6-.6 1.5 0 2.1l2.1 2.1c.6.6 1.5.6 2.1 0L25.3 31c.4-.4 1-.4 1.4 0l13.1 13.1c.6.6 1.5.6 2.1 0L44 42c.6-.6.6-1.5 0-2.1L31 26.8c-.4-.4-.4-1 0-1.4z"/></svg>
                <span class="slds-assistive-text">Close preview</span>
              </button>
            </span>
          </header>
          <div class="qm-pdf__canvas">
            <article class="qm-pdf__sheet">
              <p class="qm-pdf__eyebrow">Quote comparison</p>
              <h4 class="qm-pdf__sheet-title">{accountLabel}</h4>
              <p class="qm-pdf__sheet-sub">{pdfPreviewMeta}</p>
              <!-- Spreadsheet-style export: attributes down the first
                   column, one column per shortlisted carrier. Bands and
                   row order come from the compare grid's own section
                   definitions, so the two cannot drift. -->
              <table class="qm-pdf__table">
                <thead>
                  <tr>
                    <th class="qm-pdf__th-attr" scope="col">Attribute</th>
                    <template for:each={pdfCarrierColumns} for:item="col">
                      <th key={col.id} scope="col">{col.name}</th>
                    </template>
                  </tr>
                </thead>
                <template for:each={pdfSheetSections} for:item="section">
                  <tbody key={section.id}>
                    <tr class="qm-pdf__band">
                      <th class="qm-pdf__band-label" scope="rowgroup">
                        {section.label}
                      </th>
                      <template for:each={pdfCarrierColumns} for:item="col">
                        <td key={col.id} class="qm-pdf__band-fill"></td>
                      </template>
                    </tr>
                    <template for:each={section.rows} for:item="row">
                      <tr key={row.key} class={row.rowClass}>
                        <th class="qm-pdf__row-label" scope="row">
                          {row.label}
                        </th>
                        <template for:each={row.cells} for:item="cell">
                          <td key={cell.id}>{cell.value}</td>
                        </template>
                      </tr>
                    </template>
                  </tbody>
                </template>
              </table>
              <footer class="qm-pdf__sheet-foot">
                <span>Prepared by Elena Rostova</span>
                <span>Page 1 of 1</span>
              </footer>
            </article>
          </div>
        </div>
      </section>
    </template>
  </template>
</template>
