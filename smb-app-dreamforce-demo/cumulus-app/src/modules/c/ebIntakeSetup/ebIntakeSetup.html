<template>
  <section class="eis" aria-label="Asset Data Capture">
    <header class="eis__head">
      <span class="eis__eyebrow">RFQ &amp; Intake Setup</span>
      <h2 class="eis__title">Asset Data Capture</h2>
      <p class="eis__sub">
        Map the risk assets (vehicles, properties, schedules) and
        operator rosters required during RFQ intake. Toggle which fields
        the broker sees in the runtime form per Root Product.
      </p>
    </header>

    <div class="eis__panel" role="status">

        <code>configurationsave</code> event. The intake-config UI

        <div class="eis__meta-row">

            <template lwc:else>- none selected -</template>
          </dd>
        </div>
        <div class="eis__meta-row">
          <dt class="eis__meta-dt">Contract</dt>
          <dd class="eis__meta-dd">
            <code>@api rootProduct</code> · emits
            <code>configurationsave</code>
          </dd>
        </div>
      </dl>

      <button
        type="button"
        class="eis__btn"
        onclick={handlePlaceholderSave}
        title="Fires the configurationsave event for QA"

      </button>
    </div>
  </section>
