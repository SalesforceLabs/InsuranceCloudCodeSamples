<template>
  <div class="rhs">

    <!-- Tabset: Runtime Preview Display | Quote Provider Selection.
         Mirrors the SLDS 2 underline tabs used by c-coverage-limits-setup. -->
    <div class="rhs-tabs" role="tablist" aria-label="Integrations and Preview sections">
      <template for:each={tabsView} for:item="t">
        <button
          key={t.id}
          type="button"
          role="tab"
          class={t.cls}
          data-id={t.id}
          aria-selected={t.ariaSelected}
          tabindex={t.tabIndex}
          onclick={handleTabClick}
          onkeydown={handleTabKeydown}
        >{t.label}</button>
      </template>
    </div>

    <!-- Panel-level SLDS 2 empty/error state. Wired to the shared
         `c-empty-state` component so the illustration is picked
         directly from the SLDS 2 Cosmos catalog by `set:symbol`.
         Toggled via `?forceEmpty=rhs@<code>` for demo purposes. -->
    <template lwc:if={hasForcedState}>
      <c-empty-state
        illustration-name={forcedStateName}
        title={forcedStateTitle}
        size="medium"
      >
        {forcedStateDescription}
        <template lwc:if={hasForcedStateCta}>
          <button
            slot="cta"
            type="button"
            class="slds-button slds-button_brand"
          >{forcedStateCtaLabel}</button>
        </template>
      </c-empty-state>
    </template>

    <!-- ── Tab: Runtime Preview Display ────────────────────────
         Layout builder for what the broker sees on the runtime
         review screen. Section A (Quote Details) is LOB-agnostic;
         Section B (LOB Attributes) is filtered by the Root Product
         via isAutoLine / isGroupBenefits. -->
    <template lwc:if={showPreviewPanel}>
      <section class="rhs-panel" role="tabpanel" aria-label="Runtime Preview Display">

          <!-- Section A: Quote Details (always rendered) -->
          <div class="rhs-group">
            <h4 class="rhs-group__title">Quote Details</h4>
            <ul class="rhs-group__list" role="list">
              <li class="rhs-row">
                <label class="rhs-check">
                  <input
                    type="checkbox"
                    class="rhs-check__input"
                    data-group="quote"
                    data-key="policyStartDate"
                    checked={quotePolicyStart}
                    onchange={handlePreviewToggle}
                  />
                  <span class="rhs-check__faux" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="currentColor" focusable="false"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
                  </span>
                  <span class="rhs-check__label">Policy Start Date</span>
                </label>
              </li>
              <li class="rhs-row">
                <label class="rhs-check">
                  <input
                    type="checkbox"
                    class="rhs-check__input"
                    data-group="quote"
                    data-key="policyEndDate"
                    checked={quotePolicyEnd}
                    onchange={handlePreviewToggle}
                  />
                  <span class="rhs-check__faux" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="currentColor" focusable="false"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
                  </span>
                  <span class="rhs-check__label">Policy End Date</span>
                </label>
              </li>
              <li class="rhs-row">
                <label class="rhs-check">
                  <input
                    type="checkbox"
                    class="rhs-check__input"
                    data-group="quote"
                    data-key="linesOfCoverage"
                    checked={quoteCoverages}
                    onchange={handlePreviewToggle}
                  />
                  <span class="rhs-check__faux" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="currentColor" focusable="false"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
                  </span>
                  <span class="rhs-check__label">Line of Coverage(s)</span>
                </label>
              </li>
              <li class="rhs-row rhs-row_stacked">
                <label class="rhs-check">
                  <input
                    type="checkbox"
                    class="rhs-check__input"
                    data-group="quote"
                    data-key="priorPolicy"
                    checked={quotePriorPolicy}
                    onchange={handlePreviewToggle}
                  />
                  <span class="rhs-check__faux" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="currentColor" focusable="false"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
                  </span>
                  <span class="rhs-check__label">Prior Policy</span>
                </label>
                <p class="rhs-row__hint">
                  Conditional - visible in runtime only if a prior policy
                  is linked to the account.
                </p>
              </li>
            </ul>
          </div>

          <!-- Section B: LOB-Specific Attributes (Phase 1) -->
          <div class="rhs-group">
            <h4 class="rhs-group__title">Line of Business Attributes</h4>

            <template lwc:if={isAutoLine}>
              <ul class="rhs-group__list" role="list">
                <li class="rhs-row rhs-row_lob">
                  <span class="rhs-row__label">
                    Vehicle Assets (Make, Model, Year)
                  </span>
                  <span class="rhs-row__actions">
                    <label class="rhs-toggle rhs-toggle_switch" aria-label="Toggle Vehicle Assets">
                      <input
                        type="checkbox"
                        class="rhs-toggle__input"
                        data-group="lob"
                        data-key="vehicleAssets"
                        checked={lobVehicleAssets}
                        onchange={handlePreviewToggle}
                      />
                      <span class="rhs-toggle__track">
                        <span class="rhs-toggle__thumb"></span>
                      </span>
                    </label>
                    <button
                      type="button"
                      class="rhs-gear"
                      disabled
                      aria-disabled="true"
                      title="Granular attribute selection available in Phase 2"
                    >
                      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
                        <path d="M19.4 13c.04-.33.06-.66.06-1s-.02-.67-.06-1l2.1-1.65a.5.5 0 00.12-.64l-2-3.46a.5.5 0 00-.6-.22l-2.49 1a7.43 7.43 0 00-1.73-1l-.38-2.65A.5.5 0 0014 2h-4a.5.5 0 00-.5.42l-.38 2.65c-.62.25-1.2.59-1.73 1l-2.49-1a.5.5 0 00-.6.22l-2 3.46a.5.5 0 00.12.64L4.52 11c-.04.33-.06.66-.06 1s.02.67.06 1l-2.1 1.65a.5.5 0 00-.12.64l2 3.46c.13.23.41.32.6.22l2.49-1c.53.41 1.11.75 1.73 1l.38 2.65c.05.24.26.42.5.42h4c.24 0 .45-.18.5-.42l.38-2.65c.62-.25 1.2-.59 1.73-1l2.49 1c.19.1.47.01.6-.22l2-3.46a.5.5 0 00-.12-.64L19.4 13zM12 15.5A3.5 3.5 0 1112 8.5a3.5 3.5 0 010 7z"/>
                      </svg>
                    </button>
                  </span>
                </li>
                <li class="rhs-row rhs-row_lob">
                  <span class="rhs-row__label">
                    Drivers (First Name, Last Name, DOB)
                  </span>
                  <span class="rhs-row__actions">
                    <label class="rhs-toggle rhs-toggle_switch" aria-label="Toggle Drivers">
                      <input
                        type="checkbox"
                        class="rhs-toggle__input"
                        data-group="lob"
                        data-key="drivers"
                        checked={lobDrivers}
                        onchange={handlePreviewToggle}
                      />
                      <span class="rhs-toggle__track">
                        <span class="rhs-toggle__thumb"></span>
                      </span>
                    </label>
                    <button
                      type="button"
                      class="rhs-gear"
                      disabled
                      aria-disabled="true"
                      title="Granular attribute selection available in Phase 2"
                    >
                      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
                        <path d="M19.4 13c.04-.33.06-.66.06-1s-.02-.67-.06-1l2.1-1.65a.5.5 0 00.12-.64l-2-3.46a.5.5 0 00-.6-.22l-2.49 1a7.43 7.43 0 00-1.73-1l-.38-2.65A.5.5 0 0014 2h-4a.5.5 0 00-.5.42l-.38 2.65c-.62.25-1.2.59-1.73 1l-2.49-1a.5.5 0 00-.6.22l-2 3.46a.5.5 0 00.12.64L4.52 11c-.04.33-.06.66-.06 1s.02.67.06 1l-2.1 1.65a.5.5 0 00-.12.64l2 3.46c.13.23.41.32.6.22l2.49-1c.53.41 1.11.75 1.73 1l.38 2.65c.05.24.26.42.5.42h4c.24 0 .45-.18.5-.42l.38-2.65c.62-.25 1.2-.59 1.73-1l2.49 1c.19.1.47.01.6-.22l2-3.46a.5.5 0 00-.12-.64L19.4 13zM12 15.5A3.5 3.5 0 1112 8.5a3.5 3.5 0 010 7z"/>
                      </svg>
                    </button>
                  </span>
                </li>
              </ul>
            </template>

            <template lwc:if={isGroupBenefits}>
              <ul class="rhs-group__list" role="list">
                <li class="rhs-row rhs-row_lob">
                  <span class="rhs-row__label">
                    Rate Plan (Plan Type, Frequency, Tiers &amp; Counts)
                  </span>
                  <span class="rhs-row__actions">
                    <label class="rhs-toggle rhs-toggle_switch" aria-label="Toggle Rate Plan">
                      <input
                        type="checkbox"
                        class="rhs-toggle__input"
                        data-group="lob"
                        data-key="ratePlan"
                        checked={lobRatePlan}
                        onchange={handlePreviewToggle}
                      />
                      <span class="rhs-toggle__track">
                        <span class="rhs-toggle__thumb"></span>
                      </span>
                    </label>
                    <button
                      type="button"
                      class="rhs-gear"
                      disabled
                      aria-disabled="true"
                      title="Granular attribute selection available in Phase 2"
                    >
                      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
                        <path d="M19.4 13c.04-.33.06-.66.06-1s-.02-.67-.06-1l2.1-1.65a.5.5 0 00.12-.64l-2-3.46a.5.5 0 00-.6-.22l-2.49 1a7.43 7.43 0 00-1.73-1l-.38-2.65A.5.5 0 0014 2h-4a.5.5 0 00-.5.42l-.38 2.65c-.62.25-1.2.59-1.73 1l-2.49-1a.5.5 0 00-.6.22l-2 3.46a.5.5 0 00.12.64L4.52 11c-.04.33-.06.66-.06 1s.02.67.06 1l-2.1 1.65a.5.5 0 00-.12.64l2 3.46c.13.23.41.32.6.22l2.49-1c.53.41 1.11.75 1.73 1l.38 2.65c.05.24.26.42.5.42h4c.24 0 .45-.18.5-.42l.38-2.65c.62-.25 1.2-.59 1.73-1l2.49 1c.19.1.47.01.6-.22l2-3.46a.5.5 0 00-.12-.64L19.4 13zM12 15.5A3.5 3.5 0 1112 8.5a3.5 3.5 0 010 7z"/>
                      </svg>
                    </button>
                  </span>
                </li>
              </ul>
            </template>

            <template lwc:if={hasNoLobMatch}>
              <c-empty-state
                illustration-name="success:new"
                title="No LOB-specific attributes for this Root Product"
                size="small"
              >
                Quote Details above will still surface for the broker.
                LOB-specific rows appear here once this Root Product is
                mapped to an LOB with attribute metadata.
              </c-empty-state>
            </template>
          </div>

      </section>
    </template>

    <!-- ── Tab: Quote Provider Selection ───────────────────────
         Accordion of InsQuoteProvider cards (one open at a time).
         Account Id + Flow API Name are typeahead lookups. -->
    <template lwc:if={showProviderPanel}>
      <section class="rhs-panel" role="tabpanel" aria-label="Quote Provider Selection">
        <p class="rhs-qp__sub">
          Add one or more quote provider destinations. Each row is
          saved as an InsQuoteProvider when you publish.
        </p>

        <template lwc:if={hasNoProviders}>
          <c-empty-state
            illustration-name="success:new"
            title="No quote providers yet"
            size="medium"
          >
            Add one or more InsQuoteProvider destinations so runtime
            quoting can route to them. Each provider maps an account
            and flow to the carriers it can quote.
            <button
              slot="cta"
              type="button"
              class="slds-button slds-button_brand"
              onclick={handleAddQuoteProvider}
            >Add quote provider</button>
          </c-empty-state>
        </template>

        <div class="rhs-qp__list">
          <template for:each={providersView} for:item="qp">
            <article class={qp.cardClass} key={qp.id}>
              <div class="rhs-qp-card__head">
                <button
                  type="button"
                  class="rhs-qp-card__toggle"
                  data-id={qp.id}
                  aria-expanded={qp.ariaExpanded}
                  onclick={handleToggleProvider}
                >
                  <svg class={qp.chevronClass} viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
                    <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
                  </svg>
                  <span class="rhs-qp-card__title">{qp.headerLabel}</span>
                </button>
                <button
                  type="button"
                  class="rhs-qp-card__remove"
                  data-id={qp.id}
                  disabled={qp.removeDisabled}
                  onclick={handleRemoveQuoteProvider}
                  title="Delete quote provider"
                  aria-label="Delete quote provider"
                >
                  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
                    <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                  </svg>
                </button>
              </div>

              <template lwc:if={qp.isExpanded}>
                <div class="rhs-qp-card__body">
                  <div class="rhs-qp-card__fields">
                    <div class="slds-form-element">
                      <label class="slds-form-element__label" for={qp.nameId}>Quote Provider Name</label>
                      <div class="slds-form-element__control">
                        <input
                          type="text"
                          class="slds-input"
                          id={qp.nameId}
                          data-id={qp.id}
                          data-field="name"
                          value={qp.name}
                          onchange={handleProviderFieldChange}
                          placeholder="Select one"
                        />
                      </div>
                    </div>

                    <!-- Account Id lookup -->
                    <div class="slds-form-element">
                      <label class="slds-form-element__label" for={qp.accountId}>Account Id</label>
                      <div class="slds-form-element__control">
                        <div class="rhs-qp-typeahead">
                          <div class="rhs-qp-typeahead__control">
                            <button
                              type="button"
                              class="rhs-qp-typeahead__trigger"
                              id={qp.accountId}
                              data-id={qp.id}
                              onclick={handleOpenAccountLookup}
                            >
                              <span class="rhs-qp-typeahead__icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="currentColor" focusable="false">
                                  <path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/>
                                </svg>
                              </span>
                              <template lwc:if={qp.hasAccount}>
                                <span class="rhs-qp-typeahead__value">{qp.accountName}</span>
                              </template>
                              <template lwc:else>
                                <span class="rhs-qp-typeahead__placeholder">Search accounts</span>
                              </template>
                            </button>
                            <template lwc:if={qp.hasAccount}>
                              <button
                                type="button"
                                class="rhs-qp-typeahead__clear"
                                data-id={qp.id}
                                onclick={handleClearAccount}
                                title="Clear account"
                                aria-label="Clear account"
                              >
                                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
                                  <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                                </svg>
                              </button>
                            </template>
                          </div>

                          <template lwc:if={qp.accountLookupOpen}>
                            <div class="rhs-qp-typeahead__scrim" onclick={handleLookupScrim}></div>
                            <div class="rhs-qp-typeahead__panel" role="listbox" aria-label="Account options" onclick={stopPropagation}>
                              <div class="rhs-qp-typeahead__search">
                                <input
                                  type="text"
                                  class="slds-input"
                                  value={qp.lookupQuery}
                                  oninput={handleLookupQueryInput}
                                  placeholder="Search accounts"
                                  aria-label="Search accounts"
                                />
                              </div>
                              <template lwc:if={qp.hasAccountResults}>
                                <ul class="rhs-qp-typeahead__results">
                                  <template for:each={qp.accountResults} for:item="opt">
                                    <li key={opt.id}>
                                      <button
                                        type="button"
                                        class="rhs-qp-typeahead__option"
                                        role="option"
                                        data-provider-id={qp.id}
                                        data-label={opt.label}
                                        onclick={handleSelectAccount}
                                      >{opt.label}</button>
                                    </li>
                                  </template>
                                </ul>
                              </template>
                              <template lwc:else>
                                <p class="rhs-qp-typeahead__empty">No accounts found</p>
                              </template>
                            </div>
                          </template>
                        </div>
                      </div>
                    </div>

                    <!-- Flow API Name lookup -->
                    <div class="slds-form-element">
                      <label class="slds-form-element__label" for={qp.flowId}>Flow API Name</label>
                      <div class="slds-form-element__control">
                        <div class="rhs-qp-typeahead">
                          <div class="rhs-qp-typeahead__control">
                            <button
                              type="button"
                              class="rhs-qp-typeahead__trigger"
                              id={qp.flowId}
                              data-id={qp.id}
                              onclick={handleOpenFlowLookup}
                            >
                              <template lwc:if={qp.hasFlow}>
                                <span class="rhs-qp-typeahead__value">{qp.flowApiName}</span>
                              </template>
                              <template lwc:else>
                                <span class="rhs-qp-typeahead__placeholder">Select one</span>
                              </template>
                            </button>
                            <template lwc:if={qp.hasFlow}>
                              <button
                                type="button"
                                class="rhs-qp-typeahead__clear"
                                data-id={qp.id}
                                onclick={handleClearFlow}
                                title="Clear flow API name"
                                aria-label="Clear flow API name"
                              >
                                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
                                  <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                                </svg>
                              </button>
                            </template>
                          </div>

                          <template lwc:if={qp.flowLookupOpen}>
                            <div class="rhs-qp-typeahead__scrim" onclick={handleLookupScrim}></div>
                            <div class="rhs-qp-typeahead__panel" role="listbox" aria-label="Flow API options" onclick={stopPropagation}>
                              <div class="rhs-qp-typeahead__search">
                                <input
                                  type="text"
                                  class="slds-input"
                                  value={qp.lookupQuery}
                                  oninput={handleLookupQueryInput}
                                  placeholder="Search flows"
                                  aria-label="Search flows"
                                />
                              </div>
                              <template lwc:if={qp.hasFlowResults}>
                                <ul class="rhs-qp-typeahead__results">
                                  <template for:each={qp.flowResults} for:item="opt">
                                    <li key={opt.id}>
                                      <button
                                        type="button"
                                        class="rhs-qp-typeahead__option"
                                        role="option"
                                        data-provider-id={qp.id}
                                        data-label={opt.label}
                                        onclick={handleSelectFlow}
                                      >{opt.label}</button>
                                    </li>
                                  </template>
                                </ul>
                              </template>
                              <template lwc:else>
                                <p class="rhs-qp-typeahead__empty">No flows found</p>
                              </template>
                            </div>
                          </template>
                        </div>
                      </div>
                    </div>

                    <div class="slds-form-element">
                      <div class="slds-form-element__control">
                        <label class="rhs-qp-active">
                          <input
                            type="checkbox"
                            class="rhs-qp-active__input"
                            data-id={qp.id}
                            checked={qp.isActive}
                            onchange={handleProviderActiveToggle}
                          />
                          <span class="rhs-qp-active__faux" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="currentColor" focusable="false"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
                          </span>
                          <span class="rhs-qp-active__label">Active</span>
                        </label>
                      </div>
                    </div>

                    <div class="slds-form-element rhs-qp-card__json">
                      <label class="slds-form-element__label" for={qp.jsonId}>
                        Additional Information (JSON)
                        <span class="rhs-qp-info" title="Optional JSON payload passed to the quote provider at runtime." aria-hidden="true">
                          <svg viewBox="0 0 24 24" fill="currentColor" focusable="false">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                          </svg>
                        </span>
                      </label>
                      <div class="slds-form-element__control">
                        <textarea
                          class="rhs-qp-textarea"
                          id={qp.jsonId}
                          data-id={qp.id}
                          data-field="additionalInfoJson"
                          onchange={handleProviderFieldChange}
                          rows="4"
                          placeholder="\{ }"
                        >{qp.additionalInfoJson}</textarea>
                      </div>
                    </div>
                  </div>

                  <div class="rhs-qp-carriers">
                    <p class="rhs-qp-carriers__msg">
                      Show available carriers for this quote provider
                      <template lwc:if={qp.hasSelectedCarriers}>
                        <span class="rhs-qp-carriers__count">({qp.selectedCarrierCount} selected)</span>
                      </template>
                    </p>
                    <button
                      type="button"
                      class="rhs-qp-carriers__info"
                      data-id={qp.id}
                      onclick={handleOpenCarriersModal}
                      title="View and select carriers"
                      aria-label="View and select available carriers"
                    >
                      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                      </svg>
                    </button>
                  </div>
                </div>
              </template>
            </article>
          </template>
        </div>

      </section>
    </template>

    <!-- ── Carriers selection modal ──────────────────────────── -->
    <template lwc:if={isCarrierModalOpen}>
      <section
        role="dialog"
        tabindex="-1"
        aria-modal="true"
        aria-labelledby="rhs-carriers-modal-title"
        class="slds-modal slds-fade-in-open slds-modal_small"
        onclick={handleCarrierModalBackdrop}
      >
        <div class="slds-modal__container" onclick={stopPropagation}>
          <header class="slds-modal__header">
            <button
              class="slds-button slds-button_icon slds-modal__close"
              type="button"
              title="Close"
              aria-label="Close this window"
              onclick={handleCloseCarriersModal}
            >
              <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false">
                <path d="M31 25.4l13-13.1c.6-.6.6-1.5 0-2.1l-2-2.1c-.6-.6-1.5-.6-2.1 0L26.8 21.2c-.4.4-1 .4-1.4 0L12.3 8c-.6-.6-1.5-.6-2.1 0l-2.1 2.1c-.6.6-.6 1.5 0 2.1l13.1 13.1c.4.4.4 1 0 1.4L8 39.9c-.6.6-.6 1.5 0 2.1l2.1 2.1c.6.6 1.5.6 2.1 0L25.3 31c.4-.4 1-.4 1.4 0l13.1 13.1c.6.6 1.5.6 2.1 0L44 42c.6-.6.6-1.5 0-2.1L31 26.8c-.4-.4-.4-1 0-1.4z"/>
              </svg>
            </button>
            <h1 id="rhs-carriers-modal-title" class="slds-modal__title">Available Carriers</h1>
            <p class="rhs-qp-modal__sub">{carrierModalSubtitle}</p>
          </header>

          <div class="slds-modal__content">
            <ul class="rhs-qp-modal__list" role="list">
              <template for:each={carrierModalList} for:item="c">
                <li class="rhs-qp-modal__row" key={c.id}>
                  <label class="rhs-check">
                    <input
                      type="checkbox"
                      class="rhs-check__input"
                      data-id={c.id}
                      checked={c.isSelected}
                      onchange={handleCarrierDraftToggle}
                    />
                    <span class="rhs-check__faux" aria-hidden="true">
                      <svg viewBox="0 0 24 24" fill="currentColor" focusable="false"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
                    </span>
                    <span class="rhs-check__label">{c.name}</span>
                  </label>
                </li>
              </template>
            </ul>
          </div>

          <footer class="slds-modal__footer">
            <button class="slds-button slds-button_neutral" type="button" onclick={handleCloseCarriersModal}>
              Cancel
            </button>
            <button class="slds-button slds-button_brand" type="button" onclick={handleSaveCarriersModal}>
              Done
            </button>
          </footer>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

  </div>
</template>
