<template>
  <article class="afs slds-card" role="region" aria-label={panelTitle}>
    <!-- ─────────────────────── Panel header ──────────────────────── -->
    <header class="afs__head">
      <div class="afs__title-group">
        <h2 class="afs__title">{panelTitle}</h2>
        <template lwc:if={hasInfo}>
          <button
            type="button"
            class="afs__icon-btn"
            aria-label="What are top recommendations?"
            title={infoTitle}
          >
            <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M26 2C12.7 2 2 12.7 2 26s10.7 24 24 24 24-10.7 24-24S39.3 2 26 2zm0 12.1c1.7 0 3 1.3 3 3s-1.3 3-3 3-3-1.3-3-3 1.3-3 3-3zm5 21c0 .5-.4.9-1 .9h-8c-.5 0-1-.3-1-.9v-2c0-.5.4-1.1 1-1.1.5 0 1-.3 1-.9v-4c0-.5-.4-1.1-1-1.1-.5 0-1-.3-1-.9v-2c0-.5.4-1.1 1-1.1h6c.5 0 1 .5 1 1.1v8c0 .5.4.9 1 .9.5 0 1 .5 1 1.1v2z"/></svg>
          </button>
        </template>
      </div>
      <template lwc:if={showMenu}>
        <button
          type="button"
          class="afs__icon-btn"
          aria-label="More options"
          aria-haspopup="menu"
          onclick={handleMenu}
        >
          <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M8 20c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6 2.7-6 6-6zm18 0c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6 2.7-6 6-6zm18 0c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6 2.7-6 6-6z"/></svg>
        </button>
      </template>
    </header>

    <!-- ─────────────────────── Recommendation list ──────────────── -->
    <ul class="afs__list" role="list">
      <template for:each={cards} for:item="card">
        <li class={card.itemClass} key={card.id} data-id={card.id}>
          <div class="afs__card-tag">
            <span class="afs__spark" aria-hidden="true">
              <svg aria-hidden="true" viewBox="0 0 13 13" focusable="false">
                <path
                  fill="currentColor"
                  d="M8.86791 6.77738L7.03536 7.68928C6.48478 7.96366 6.03946 8.40751 5.76418 8.95626L4.84925 10.7827C4.7197 11.0437 4.34456 11.0437 4.21501 10.7827L3.30008 8.95626C3.02479 8.40751 2.57947 7.96366 2.0289 7.68928L0.196345 6.77738C-0.0654483 6.64826 -0.0654483 6.27436 0.196345 6.14524L2.0289 5.23334C2.57947 4.95896 3.02479 4.51512 3.30008 3.96636L4.21501 2.13987C4.34456 1.87894 4.7197 1.87894 4.84925 2.13987L5.76418 3.96636C6.03946 4.51512 6.48478 4.95896 7.03536 5.23334L8.86791 6.14524C9.12971 6.27436 9.12971 6.64826 8.86791 6.77738ZM12.865 10.8392L12.0796 10.4465C11.8421 10.3308 11.6532 10.1372 11.5344 9.90313L11.1404 9.12035C11.0864 9.00737 10.9245 9.00737 10.8678 9.12035L10.4738 9.90313C10.3577 10.1398 10.1634 10.3281 9.92858 10.4465L9.1432 10.8392C9.02985 10.893 9.02985 11.0544 9.1432 11.1109L9.92858 11.5037C10.1661 11.6193 10.355 11.813 10.4738 12.047L10.8678 12.8298C10.9218 12.9428 11.0837 12.9428 11.1404 12.8298L11.5344 12.047C11.6505 11.8103 11.8448 11.622 12.0796 11.5037L12.865 11.1109C12.9783 11.0571 12.9783 10.8957 12.865 10.8392ZM12.865 1.80363L12.0796 1.41089C11.8421 1.29522 11.6532 1.10154 11.5344 0.867516L11.1404 0.0847341C11.0864 -0.0282447 10.9245 -0.0282447 10.8678 0.0847341L10.4738 0.867516C10.3577 1.10423 10.1634 1.29253 9.92858 1.41089L9.1432 1.80363C9.02985 1.85742 9.02985 2.01882 9.1432 2.07531L9.92858 2.46805C10.1661 2.58372 10.355 2.7774 10.4738 3.01142L10.8678 3.7942C10.9218 3.90718 11.0837 3.90718 11.1404 3.7942L11.5344 3.01142C11.6505 2.77471 11.8448 2.58641 12.0796 2.46805L12.865 2.07531C12.9783 2.02151 12.9783 1.86011 12.865 1.80363Z"
                />
              </svg>
            </span>
            <span class="afs__tag-label">{tagLabel}</span>
            <button
              type="button"
              class="afs__icon-btn afs__icon-btn_inline"
              aria-label="What does AI generated mean?"
            >
              <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M26 2C12.7 2 2 12.7 2 26s10.7 24 24 24 24-10.7 24-24S39.3 2 26 2zm0 12.1c1.7 0 3 1.3 3 3s-1.3 3-3 3-3-1.3-3-3 1.3-3 3-3zm5 21c0 .5-.4.9-1 .9h-8c-.5 0-1-.3-1-.9v-2c0-.5.4-1.1 1-1.1.5 0 1-.3 1-.9v-4c0-.5-.4-1.1-1-1.1-.5 0-1-.3-1-.9v-2c0-.5.4-1.1 1-1.1h6c.5 0 1 .5 1 1.1v8c0 .5.4.9 1 .9.5 0 1 .5 1 1.1v2z"/></svg>
            </button>
          </div>

          <div class="afs__card-body">
            <h3 class="afs__card-title">{card.title}</h3>
            <template lwc:if={card.description}>
              <p class="afs__card-desc">{card.description}</p>
            </template>

            <template lwc:if={card.hasFields}>
              <dl class="afs__fields">
                <template for:each={card.fields} for:item="field">
                  <div class="afs__field" key={field.label}>
                    <dt class="afs__field-label">{field.label}</dt>
                    <dd class="afs__field-value">{field.value}</dd>
                  </div>
                </template>
              </dl>
            </template>
          </div>

          <div class="afs__card-actions" role="group" aria-label="Recommendation actions">
            <button
              type="button"
              class={card.acceptClass}
              aria-pressed={card.acceptPressed}
              data-id={card.id}
              data-action="accept"
              onclick={handleCardAction}
            >
              <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M19.1 42.5L2.6 25.9c-.6-.6-.6-1.6 0-2.2l2.2-2.2c.6-.6 1.6-.6 2.2 0L19.4 34c.4.4 1.1.4 1.5 0L45.2 9.5c.6-.6 1.6-.6 2.2 0l2.2 2.2c.6.6.6 1.6 0 2.2L21.3 42.5c-.6.7-1.6.7-2.2 0z"/></svg>
              <span class="slds-assistive-text">Accept</span>
            </button>
            <button
              type="button"
              class={card.rejectClass}
              aria-pressed={card.rejectPressed}
              data-id={card.id}
              data-action="reject"
              onclick={handleCardAction}
            >
              <svg viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M31 25.4l13-13.1c.6-.6.6-1.5 0-2.1l-2-2.1c-.6-.6-1.5-.6-2.1 0L26.8 21.2c-.4.4-1 .4-1.4 0L12.3 8c-.6-.6-1.5-.6-2.1 0l-2.1 2.1c-.6.6-.6 1.5 0 2.1l13.1 13.1c.4.4.4 1 0 1.4L8 39.9c-.6.6-.6 1.5 0 2.1l2.1 2.1c.6.6 1.5.6 2.1 0L25.3 31c.4-.4 1-.4 1.4 0l13.1 13.1c.6.6 1.5.6 2.1 0L44 42c.6-.6.6-1.5 0-2.1L31 26.8c-.4-.4-.4-1 0-1.4z"/></svg>
              <span class="slds-assistive-text">Reject</span>
            </button>
          </div>
        </li>
      </template>
    </ul>

    <!-- ─────────────────────── Footer actions ───────────────────── -->
    <footer class="afs__foot">
      <button
        type="button"
        class="slds-button slds-button_brand afs__btn afs__btn_primary"
        disabled={applyDisabled}
        onclick={handleApply}
      >
        {applyLabel}
      </button>
      <button
        type="button"
        class="slds-button slds-button_neutral afs__btn afs__btn_neutral"
        onclick={handleReset}
      >
        <span>{resetLabel}</span>
        <svg class="afs__caret" viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path  d="M47.6 17.8L27.1 38.5c-.6.6-1.6.6-2.2 0L4.4 17.8c-.6-.6-.6-1.6 0-2.2l2.2-2.2c.6-.6 1.6-.6 2.2 0l16.1 16.3c.6.6 1.6.6 2.2 0l16.1-16.2c.6-.6 1.6-.6 2.2 0l2.2 2.2c.5.6.5 1.5 0 2.1z"/></svg>
      </button>
    </footer>
  </article>
</template>
