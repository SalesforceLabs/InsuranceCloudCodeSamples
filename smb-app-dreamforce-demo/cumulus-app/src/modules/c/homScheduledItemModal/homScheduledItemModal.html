<template>
  <template lwc:if={open}>
    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      aria-labelledby="hom-sch-modal-heading"
      class="slds-modal slds-fade-in-open slds-modal_small"
      onclick={handleBackdrop}
    >
      <div class="slds-modal__container" onclick={stopPropagation}>
        <header class="slds-modal__header">
          <button
            class="slds-button slds-button_icon slds-modal__close"
            type="button"
            title="Close"
            aria-label="Close this window"
            onclick={handleCancel}
          >
            <svg stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path d="M31 25.4l13-13.1c.6-.6.6-1.5 0-2.1l-2-2.1c-.6-.6-1.5-.6-2.1 0L26.8 21.2c-.4.4-1 .4-1.4 0L12.3 8c-.6-.6-1.5-.6-2.1 0l-2.1 2.1c-.6.6-.6 1.5 0 2.1l13.1 13.1c.4.4.4 1 0 1.4L8 39.9c-.6.6-.6 1.5 0 2.1l2.1 2.1c.6.6 1.5.6 2.1 0L25.3 31c.4-.4 1-.4 1.4 0l13.1 13.1c.6.6 1.5.6 2.1 0L44 42c.6-.6.6-1.5 0-2.1L31 26.8c-.4-.4-.4-1 0-1.4z"/></svg>
          </button>
          <h1 id="hom-sch-modal-heading" class="slds-modal__title">{modalTitle}</h1>
          <template lwc:if={hasDwelling}>
            <p class="hom-sch-modal__subhead">Will be scheduled under {dwellingName}</p>
          </template>
        </header>

        <div class="slds-modal__content">
          <div class="hom-sch-modal">
            <template lwc:if={showLookup}>
              <div class="hom-lookup">
                <span class="hom-lookup__label">Search existing scheduled items</span>
                <button
                  class={lookupTriggerClass}
                  type="button"
                  aria-haspopup="dialog"
                  aria-expanded={searchOpen}
                  onclick={handleSearchToggle}
                >
                  <svg class="hom-lookup__trigger-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="M21 21l-4.35-4.35"></path>
                  </svg>
                  <span class="hom-lookup__trigger-label">{lookupTriggerLabel}</span>
                  <template lwc:if={hasLookupSelection}>
                    <span
                      class="hom-lookup__clear"
                      role="button"
                      tabindex="0"
                      aria-label="Clear selection"
                      onclick={handleClearLookup}
                    >
                      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
                        <path d="M18.3 5.71L12 12.01l6.3 6.29-1.42 1.42L10.59 13.43 4.29 19.72 2.88 18.3l6.3-6.29-6.3-6.29L4.29 4.3l6.3 6.29 6.3-6.29z"/>
                      </svg>
                    </span>
                  </template>
                </button>

                <template lwc:if={searchOpen}>
                  <div class="hom-lookup__scrim" onclick={handleSearchScrim}></div>
                  <div class="hom-lookup__panel" role="dialog" aria-label="Scheduled item lookup">
                    <div class="hom-lookup__input-wrap">
                      <svg class="hom-lookup__input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="M21 21l-4.35-4.35"></path>
                      </svg>
                      <input
                        class="hom-lookup__input"
                        type="search"
                        placeholder="Search by name, category, or appraiser..."
                        value={searchQuery}
                        oninput={handleSearchInput}
                        onkeydown={handleSearchKey}
                        aria-label="Search existing scheduled items"
                      />
                    </div>
                    <template lwc:if={hasLookupResults}>
                      <ul class="hom-lookup__results" role="listbox">
                        <template for:each={lookupResults} for:item="r">
                          <li
                            key={r.id}
                            class={r.cls}
                            role="option"
                            aria-selected={r.ariaSelected}
                            data-id={r.id}
                            tabindex="0"
                            onclick={handleLookupSelection}
                            onkeydown={handleSearchKey}
                          >
                            <span class="hom-lookup__result-name">{r.displayName}</span>
                            <span class="hom-lookup__result-meta">{r.metaLabel}</span>
                          </li>
                        </template>
                      </ul>
                    </template>
                    <template lwc:else>
                      <p class="hom-lookup__empty" role="status">{lookupEmptyCopy}</p>
                    </template>
                  </div>
                </template>
              </div>
            </template>

            <p class="required-legend">
              <abbr class="slds-required" title="required">*</abbr> = Required
            </p>

            <template lwc:if={hasLookupSelection}>
              <div class="hom-sch-modal__selected">
                <label class="slds-form-element__label" for="hom-sch-selected-name">Item</label>
                <input
                  id="hom-sch-selected-name"
                  class="slds-input hom-sch-modal__selected-input"
                  type="text"
                  value={selectedItemName}
                  disabled
                  aria-readonly="true"
                />
              </div>
            </template>

            <div class="hom-sch-modal__grid">
              <div class={nameClass} data-col="wide">
                <label class="slds-form-element__label" for="hom-sch-name">
                  Item Name <abbr class="slds-required" title="required">*</abbr>
                </label>
                <input
                  id="hom-sch-name"
                  class="slds-input"
                  type="text"
                  placeholder="e.g. Diamond Ring"
                  data-field="name"
                  value={name}
                  oninput={handleInput}
                />
                <template lwc:if={nameError}>
                  <span class="hom-sch-modal__error">Enter an item name.</span>
                </template>
              </div>

              <div class="slds-form-element">
                <label class="slds-form-element__label">Category</label>
                <c-picklist
                  options={categoryOptions}
                  value={category}
                  placeholder="Select..."
                  accessible-label="Category"
                  data-field="category"
                  onchange={handlePicklist}
                ></c-picklist>
              </div>

              <div class={valueClass}>
                <label class="slds-form-element__label" for="hom-sch-value">
                  Appraised Value <abbr class="slds-required" title="required">*</abbr>
                </label>
                <input
                  id="hom-sch-value"
                  class="slds-input"
                  type="number"
                  inputmode="numeric"
                  placeholder="Enter USD"
                  data-field="appraisedValue"
                  value={appraisedValue}
                  oninput={handleInput}
                />
                <template lwc:if={valueError}>
                  <span class="hom-sch-modal__error">Enter an appraised value.</span>
                </template>
              </div>

              <div class="slds-form-element" data-col="wide">
                <label class="slds-form-element__label" for="hom-sch-desc">Description</label>
                <input
                  id="hom-sch-desc"
                  class="slds-input"
                  type="text"
                  placeholder="Free-form description"
                  data-field="description"
                  value={description}
                  oninput={handleInput}
                />
              </div>

              <div class="slds-form-element">
                <label class="slds-form-element__label" for="hom-sch-date">Appraisal Date</label>
                <c-date-input
                  input-id="hom-sch-date"
                  data-field="appraisalDate"
                  value={appraisalDate}
                  accessible-label="Appraisal Date"
                  onchange={handleInput}
                ></c-date-input>
              </div>

              <div class="slds-form-element">
                <label class="slds-form-element__label" for="hom-sch-by">Appraised By</label>
                <input
                  id="hom-sch-by"
                  class="slds-input"
                  type="text"
                  placeholder="e.g. Continental Jewelers"
                  data-field="appraisedBy"
                  value={appraisedBy}
                  oninput={handleInput}
                />
              </div>
            </div>
          </div>
        </div>

        <footer class="slds-modal__footer">
          <button class="slds-button slds-button_neutral" type="button" onclick={handleCancel}>
            Cancel
          </button>
          <button class="slds-button slds-button_brand" type="button" onclick={handleSave}>
            {saveLabel}
          </button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
