<template>
  <template lwc:if={open}>
    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      aria-labelledby="hom-dwl-modal-heading"
      class="slds-modal slds-fade-in-open slds-modal_medium"
      onclick={handleBackdrop}
    >
      <div class="slds-modal__container" onclick={stopPropagation}>
        <header class="slds-modal__header">
          <button
            class="slds-button slds-button_icon slds-modal__close"
            type="button"
            title="Close"
            aria-label="Close this window"
            onclick={handleCancel}
          >
            <svg stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 52 52" fill="currentColor" aria-hidden="true" focusable="false"><path d="M31 25.4l13-13.1c.6-.6.6-1.5 0-2.1l-2-2.1c-.6-.6-1.5-.6-2.1 0L26.8 21.2c-.4.4-1 .4-1.4 0L12.3 8c-.6-.6-1.5-.6-2.1 0l-2.1 2.1c-.6.6-.6 1.5 0 2.1l13.1 13.1c.4.4.4 1 0 1.4L8 39.9c-.6.6-.6 1.5 0 2.1l2.1 2.1c.6.6 1.5.6 2.1 0L25.3 31c.4-.4 1-.4 1.4 0l13.1 13.1c.6.6 1.5.6 2.1 0L44 42c.6-.6.6-1.5 0-2.1L31 26.8c-.4-.4-.4-1 0-1.4z"/></svg>
          </button>
          <h1 id="hom-dwl-modal-heading" class="slds-modal__title">{modalTitle}</h1>
        </header>

        <div class="slds-modal__content">
          <c-hom-dwelling-form-fields
            seed={formSeed}
            available-dwellings={availableDwellings}
          ></c-hom-dwelling-form-fields>
        </div>

        <footer class="slds-modal__footer">
          <button class="slds-button slds-button_neutral" type="button" onclick={handleCancel}>
            Cancel
          </button>
          <button class="slds-button slds-button_brand" type="button" onclick={handleSave}>
            {saveLabel}
          </button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
