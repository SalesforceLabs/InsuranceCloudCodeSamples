<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Moved — Atlas Final Mock</title>
    <!-- This preview was renamed from v03/ to final-mock/. The stub stays
         behind because the v03 URL was already shared around. The script
         forwards query string and hash too, so deep-links such as
         ?tab=tab-setup keep resolving to the same screen. The meta refresh
         is the no-JS fallback and drops those params. -->
    <meta http-equiv="refresh" content="3; url=../final-mock/" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f3f3f3;
        color: #03234d;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          Roboto, sans-serif;
        line-height: 1.5;
      }
      .card {
        background: #fff;
        border: 1px solid #c9c9c9;
        border-radius: 0.5rem;
        padding: 2rem;
        max-width: 30rem;
        text-align: center;
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.25rem; }
      p { margin: 0 0 1.25rem; color: #5c5c5c; font-size: 0.9375rem; }
      a {
        display: inline-block;
        background: #0250d9;
        color: #fff;
        text-decoration: none;
        padding: 0.5rem 1rem;
        border-radius: 0.25rem;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>This preview moved</h1>
      <p>
        <code>v03/</code> is now <code>final-mock/</code>. Redirecting you
        now&hellip;
      </p>
      <a id="go" href="../final-mock/">Open the final mock &rarr;</a>
    </div>
    <script>
      (function () {
        var target = '../final-mock/' + window.location.search + window.location.hash;
        document.getElementById('go').setAttribute('href', target);
        window.location.replace(target);
      })();
    </script>
  </body>
</html>
